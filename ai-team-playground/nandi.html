.sub{display:block;margin-top:4px;font-size:9px;letter-spacing:.1em;color:#bdc8d4}
.centerStatus{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;max-width:min(680px,88vw);text-align:center}
.status{padding:10px 16px;border:1px solid rgba(255,255,255,.1);background:rgba(5,9,14,.52);backdrop-filter:blur(18px);border-radius:999px;color:#e9f2f8;font-size:11px;letter-spacing:.09em;box-shadow:0 14px 38px rgba(0,0,0,.35)}
.heard{min-height:20px;color:#d9e6ef;font-size:13px;text-shadow:0 2px 14px #000}
.enable{border:1px solid rgba(215,181,109,.36);background:rgba(11,14,18,.66);color:#fff0c9;border-radius:999px;padding:11px 16px;cursor:pointer;font:inherit;display:none}
.enable.show{display:block}
.answer{position:absolute;right:22px;bottom:22px;width:min(420px,40vw);max-height:44vh;overflow:auto;border:1px solid rgba(255,255,255,.09);background:rgba(4,8,13,.7);backdrop-filter:blur(20px);border-radius:20px;padding:17px 18px;color:#e8eef4;font-size:13px;line-height:1.5;opacity:0;transform:translateY(12px);pointer-events:none;transition:.3s}
.answer.show{opacity:1;transform:none}
.answer b{display:block;color:#ffe7ad;font-size:10px;letter-spacing:.14em;margin-bottom:8px}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.72}}
@keyframes nandiAck{0%,100%{transform:scale(1.02) rotate(0)}22%{transform:scale(1.025) rotate(-.28deg)}48%{transform:scale(1.02) rotate(.32deg)}72%{transform:scale(1.024) rotate(-.18deg)}}
@media(max-width:700px){.answer{left:14px;right:14px;width:auto;bottom:88px}.top{left:16px;top:16px}.centerStatus{bottom:18px}}
</style>
</head>
<body>
<div id="scene" class="scene">
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="aura"></div>
  <div class="top">
    <span class="mark"></span>
    <div><span class="name">NANDI</span><span id="mode" class="sub">IDLE · SAY “HI NANDI”</span></div>
  </div>
  <div id="answer" class="answer"><b>NANDI</b><span id="answerText"></span></div>
  <div class="centerStatus">
    <div id="heard" class="heard"></div>
    <button id="enable" class="enable" type="button">Enable microphone</button>
    <div id="status" class="status">Preparing default microphone…</div>
  </div>
</div>
<script>
(() => {
  const scene=document.getElementById('scene');
  const status=document.getElementById('status');
  const heard=document.getElementById('heard');
  const mode=document.getElementById('mode');
  const enable=document.getElementById('enable');
  const answer=document.getElementById('answer');
  const answerText=document.getElementById('answerText');
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  let recognition=null,awake=false,busy=false,restartTimer=null;
  let history=[];

  function setStatus(text){ status.textContent=text; }
  function speak(text){
    if(!('speechSynthesis' in window)||!text)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=.98; u.pitch=.92; u.volume=.92;
    window.speechSynthesis.speak(u);
  }
  function acknowledge(){
    scene.classList.remove('ack'); void scene.offsetWidth; scene.classList.add('ack');
    scene.classList.add('awake'); awake=true;
    mode.textContent='ACTIVE · LISTENING';
    setStatus('Listening…');
    speak("I'm listening.");
  }
  function sleep(){
    awake=false; scene.classList.remove('awake'); mode.textContent='IDLE · SAY “HI NANDI”';
    setStatus('Waiting for “Hi Nandi”…'); answer.classList.remove('show');
    speak('Going quiet.');
  }
  async function askRelay(question){
    if(busy)return;
    busy=true; setStatus('Working…'); heard.textContent=question;
    answer.classList.remove('show');
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),55000);
      const response=await fetch('/api/ask',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question,history:history.slice(-6)}),
        signal:controller.signal
      });
      clearTimeout(timer);
      if(!response.ok)throw new Error('Relay returned '+response.status);
      if(!response.body)throw new Error('Streaming unavailable');
      const reader=response.body.getReader(),decoder=new TextDecoder();
      let buffer='',finalAnswer='';
      while(true){
        const part=await reader.read();
        buffer+=decoder.decode(part.value||new Uint8Array(),{stream:!part.done});
        const lines=buffer.split('\n'); buffer=lines.pop()||'';
        for(const line of lines){
          if(!line.trim())continue;
          const evt=JSON.parse(line);
          if(evt.type==='planner')setStatus('Understanding…');
          if(evt.type==='worker'||evt.type==='worker_selected')setStatus('Thinking…');
          if(evt.type==='tool')setStatus('Using '+String(evt.tool||'tool')+'…');
          if(evt.type==='reviewer')setStatus('Verifying…');
          if(evt.type==='done')finalAnswer=String(evt.answer||'').trim();
          if(evt.type==='error')throw new Error(evt.message||'Relay error');
        }
        if(part.done)break;
      }
      if(buffer.trim()){
        const evt=JSON.parse(buffer);
        if(evt.type==='done')finalAnswer=String(evt.answer||'').trim();
      }
      if(!finalAnswer)finalAnswer='I finished, but no answer text came back.';
      answerText.textContent=finalAnswer; answer.classList.add('show');
      history.push({role:'user',content:question},{role:'assistant',content:finalAnswer});
      history=history.slice(-8);
      setStatus('Listening…'); speak(finalAnswer);
    }catch(err){
      const msg=err&&err.name==='AbortError'?'That took too long. I stopped the request.':('I hit a problem: '+(err.message||String(err)));
      answerText.textContent=msg; answer.classList.add('show'); setStatus('Listening…'); speak(msg);
    }finally{busy=false}
  }
  function handleTranscript(text){
    const t=text.trim(); if(!t)return;
    heard.textContent='“'+t+'”';
    const lower=t.toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();
    if(!awake){
      if(/(^|\s)(hi|hey)\s+nandi(\s|$)/.test(lower)||lower==='nandi'){
        acknowledge();
      }else{
        setStatus('Waiting for “Hi Nandi”…');
      }
      return;
    }
    if(/\b(go to sleep|sleep nandi|nandi sleep)\b/.test(lower)){ sleep(); return; }
    if(/\b(stop talking|stop speaking)\b/.test(lower)){ window.speechSynthesis&&speechSynthesis.cancel(); return; }
    askRelay(t);
  }
  function buildRecognition(){
    if(!SpeechRecognition){
      setStatus('Voice recognition is not available in this browser.');
      mode.textContent='BROWSER VOICE UNSUPPORTED';
      return false;
    }
    recognition=new SpeechRecognition();
    recognition.continuous=true; recognition.interimResults=true; recognition.lang='en-IN';
    recognition.onstart=()=>{ enable.classList.remove('show'); setStatus(awake?'Listening…':'Waiting for “Hi Nandi”…'); };
    recognition.onresult=(e)=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const tx=e.results[i][0].transcript;
        if(e.results[i].isFinal)handleTranscript(tx); else interim+=tx;
      }
      if(interim&&!busy)heard.textContent=interim;
    };
    recognition.onerror=(e)=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        enable.classList.add('show'); setStatus('Microphone permission needed once.');
      } else if(e.error!=='no-speech'&&e.error!=='aborted'){
        setStatus('Mic issue: '+e.error);
      }
    };
    recognition.onend=()=>{
      clearTimeout(restartTimer);
      restartTimer=setTimeout(()=>{try{recognition.start()}catch(_){}},650);
    };
    return true;
  }
  async function startMic(){
    try{
      if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        stream.getTracks().forEach(t=>t.stop());
      }
      if(!recognition&& !buildRecognition())return;
      try{recognition.start()}catch(_){}
    }catch(err){
      enable.classList.add('show');
      setStatus('Allow microphone access to start Nandi.');
    }
  }
  enable.addEventListener('click',startMic);
  window.addEventListener('load',()=>setTimeout(startMic,500));
})();
</script>
</body>
</html>
