<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03070b">
<title>Nandi</title>
<style>
:root{color-scheme:dark;--bg:#03070b;--panel:rgba(8,14,20,.72);--line:rgba(142,239,255,.14);--cyan:#8eefff;--gold:#e2bd72;--green:#82f1b9;--muted:#8d9ca8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eef6fa}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 50% 43%,rgba(50,157,184,.09),transparent 26%),
radial-gradient(circle at 50% 74%,rgba(226,189,114,.045),transparent 32%),
linear-gradient(180deg,#040a10 0,#020509 72%,#010305 100%)}
.shell{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;z-index:5}.brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.22em}
.dot{width:8px;height:8px;border-radius:50%;background:#59646d;box-shadow:0 0 0 transparent;transition:.25s}
.activity{height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);border-radius:999px;color:#8d9aa4;font-size:8px;letter-spacing:.13em}
.stage{position:relative;display:grid;place-items:center;min-height:0}
.presence{position:relative;width:min(66vw,520px);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;border:1px solid rgba(142,239,255,.10);border-radius:50%;transition:.45s}
.r1{inset:7%;box-shadow:0 0 60px rgba(142,239,255,.035)}.r2{inset:21%;border-color:rgba(226,189,114,.10)}.r3{inset:33%;border-color:rgba(142,239,255,.17)}
.core{position:relative;width:29%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:
radial-gradient(circle at 42% 35%,rgba(237,249,252,.20),rgba(142,239,255,.08) 26%,rgba(4,12,18,.94) 69%);
border:1px solid rgba(142,239,255,.25);box-shadow:0 0 70px rgba(142,239,255,.10),inset 0 0 40px rgba(142,239,255,.07);transition:.35s}
.core:before,.core:after{content:"";position:absolute;top:-29%;width:43%;height:54%;border:2px solid rgba(226,189,114,.45);border-bottom:0;opacity:.66}
.core:before{left:0;border-right:0;border-radius:90% 0 0 0;transform:rotate(-17deg)}.core:after{right:0;border-left:0;border-radius:0 90% 0 0;transform:rotate(17deg)}
.core span{font-size:clamp(32px,7vw,64px);font-weight:300;letter-spacing:-.04em;color:#dff9fc;text-shadow:0 0 24px rgba(142,239,255,.45)}
.state{position:absolute;top:calc(50% + 38%);text-align:center;white-space:nowrap}.state b{display:block;font-size:10px;letter-spacing:.22em;color:#dde7ec}.state span{display:block;margin-top:7px;font-size:9px;color:var(--muted);letter-spacing:.06em}
.shell.listening .dot{background:var(--cyan);box-shadow:0 0 16px rgba(142,239,255,.75)}.shell.listening .r1{animation:pulse 1.25s ease-in-out infinite}.shell.listening .r2{animation:pulse 1.25s .15s ease-in-out infinite}.shell.listening .core{box-shadow:0 0 90px rgba(142,239,255,.24),inset 0 0 44px rgba(142,239,255,.10)}
.shell.thinking .dot{background:var(--gold);box-shadow:0 0 16px rgba(226,189,114,.7)}.shell.thinking .r1,.shell.thinking .r3{animation:rotate 3.4s linear infinite;border-style:dashed;border-color:rgba(226,189,114,.25)}.shell.thinking .core{box-shadow:0 0 90px rgba(226,189,114,.18),inset 0 0 44px rgba(226,189,114,.08)}
.shell.speaking .dot{background:var(--green);box-shadow:0 0 16px rgba(130,241,185,.72)}.shell.speaking .r1{animation:speak 1s ease-in-out infinite}.shell.speaking .r2{animation:speak 1s .17s ease-in-out infinite}.shell.speaking .core{box-shadow:0 0 95px rgba(130,241,185,.19),inset 0 0 44px rgba(130,241,185,.08)}
.shell.error .dot{background:#ff7f89}
@keyframes pulse{50%{transform:scale(1.055);opacity:.46}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes speak{50%{transform:scale(1.035);border-color:rgba(130,241,185,.34)}}
.bottom{z-index:7;display:flex;flex-direction:column;align-items:center;gap:8px}
.answer{width:min(760px,94vw);max-height:23vh;overflow:auto;padding:0 8px;text-align:center;opacity:0;transform:translateY(5px);transition:.22s}.answer.show{opacity:1;transform:none}
.heard{font-size:11px;color:#91a3ae;margin-bottom:5px}.reply{font-size:14px;line-height:1.45;color:#eaf1f4}
.controls{width:min(760px,96vw);display:grid;grid-template-columns:56px 1fr;gap:9px;align-items:center}
.mic{width:56px;height:56px;border-radius:50%;border:1px solid rgba(142,239,255,.20);background:rgba(10,20,27,.76);color:#bff9ff;display:grid;place-items:center;box-shadow:0 12px 35px rgba(0,0,0,.28)}
.mic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7}.mic.recording{background:rgba(142,239,255,.11);box-shadow:0 0 40px rgba(142,239,255,.16)}
.composer{height:56px;display:flex;align-items:center;gap:7px;padding:7px 8px 7px 15px;border:1px solid rgba(255,255,255,.075);background:rgba(6,11,16,.62);backdrop-filter:blur(18px);border-radius:999px}
.composer input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#edf4f7;font:inherit;font-size:13px}.composer input::placeholder{color:#71818c}
.send{width:42px;height:42px;border-radius:50%;border:1px solid rgba(226,189,114,.18);background:linear-gradient(145deg,#d8b166,#8d5928);color:#120c07;font-size:17px}
.voice-note{min-height:15px;color:#6f7f8a;font-size:8px;letter-spacing:.08em;text-align:center}
.drawer{position:fixed;z-index:20;top:58px;right:14px;width:min(360px,calc(100vw - 28px));max-height:60vh;overflow:auto;padding:14px;border:1px solid rgba(255,255,255,.07);border-radius:18px;background:rgba(4,9,13,.92);backdrop-filter:blur(24px);box-shadow:0 24px 70px rgba(0,0,0,.45);opacity:0;transform:translateY(-6px);pointer-events:none;transition:.2s}
.drawer.show{opacity:1;transform:none;pointer-events:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:8px;letter-spacing:.16em;color:#8b99a3}.close{border:0;background:transparent;color:#99a7b0;font-size:18px}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}.step{padding:16px 3px 6px;border:1px solid rgba(255,255,255,.04);border-radius:8px;text-align:center;color:#5f6d77;font-size:6px;letter-spacing:.07em;position:relative}.step:before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#27313a}.step.active:before{background:var(--cyan)}.step.done:before{background:var(--green)}.step.fail:before{background:#ff7f89}.step span{display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#72808a}
.events{display:flex;flex-direction:column;gap:5px}.event{padding:8px;border:1px solid rgba(255,255,255,.035);background:rgba(255,255,255,.015);border-radius:8px;font-size:8px;color:#83909a;line-height:1.35}.event b{color:#c8d3d9}
@media(max-width:720px){.shell{padding-left:11px;padding-right:11px}.presence{width:min(86vw,480px)}.state{top:calc(50% + 40%)}.answer{max-height:20vh}.controls{grid-template-columns:58px 1fr;width:100%}.composer{height:58px}.mic{width:58px;height:58px}.activity{height:32px}.brand{font-size:10px}}
@media(prefers-reduced-motion:reduce){.ring{animation:none!important}}
</style>
</head>
<body>
<main id="shell" class="shell idle">
<header><div class="brand"><span class="dot"></span><span>NANDI</span></div><button id="activityBtn" class="activity" type="button">ACTIVITY</button></header>
<section class="stage">
  <div class="presence" aria-hidden="true"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"><span>N</span></div><div class="state"><b id="stateLabel">READY</b><span id="stateHint">Tap the microphone to speak</span></div></div>
</section>
<section class="bottom">
  <div id="answer" class="answer"><div id="heard" class="heard"></div><div id="reply" class="reply"></div></div>
  <div class="controls">
    <button id="micBtn" class="mic" type="button" aria-label="Speak to Nandi"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"></path></svg></button>
    <form id="askForm" class="composer" autocomplete="off"><input id="prompt" type="text" placeholder="Ask Nandi anything..." aria-label="Ask Nandi anything"><button id="send" class="send" type="submit" aria-label="Send">›</button></form>
  </div>
  <div id="voiceNote" class="voice-note">MOBILE VOICE: TAP TO SPEAK • TAP AGAIN TO SEND</div>
</section>
<aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-head"><span>AGENT ACTIVITY</span><button id="closeDrawer" class="close" type="button">×</button></div><div class="pipeline"><div class="step" data-stage="listen">LISTEN<span>idle</span></div><div class="step" data-stage="route">ROUTE<span>idle</span></div><div class="step" data-stage="act">ACT<span>idle</span></div><div class="step" data-stage="verify">VERIFY<span>idle</span></div><div class="step" data-stage="respond">RESPOND<span>idle</span></div></div><div id="events" class="events"></div></aside>
</main>
<script type="module" src="/assets/nandi-neural-voice.js"></script>
<script>
// NANDI_MOBILE_VOICE_V1
(function(){
const shell=document.getElementById('shell'),stateLabel=document.getElementById('stateLabel'),stateHint=document.getElementById('stateHint'),micBtn=document.getElementById('micBtn'),
askForm=document.getElementById('askForm'),promptInput=document.getElementById('prompt'),send=document.getElementById('send'),answer=document.getElementById('answer'),
heard=document.getElementById('heard'),reply=document.getElementById('reply'),voiceNote=document.getElementById('voiceNote'),activityBtn=document.getElementById('activityBtn'),
drawer=document.getElementById('drawer'),closeDrawer=document.getElementById('closeDrawer'),events=document.getElementById('events');
let recorder=null,stream=null,chunks=[],recordTimer=null,history=[],busy=false,voiceReady=false,voiceLoading=false,currentAbort=null;
const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent||'');

function setState(state,label,hint){
 shell.classList.remove('idle','listening','thinking','speaking','error');shell.classList.add(state||'idle');
 stateLabel.textContent=label||String(state||'ready').toUpperCase();stateHint.textContent=hint||'';
}
function setStage(name,status,text){
 const el=document.querySelector('[data-stage="'+name+'"]');if(!el)return;el.classList.remove('active','done','fail');if(status)el.classList.add(status);if(text)el.querySelector('span').textContent=text;
}
function resetStages(){for(const name of ['listen','route','act','verify','respond'])setStage(name,'','idle')}
function addEvent(title,detail=''){const el=document.createElement('div');el.className='event';el.innerHTML='<b>'+String(title).replace(/[<>]/g,'')+'</b>'+(detail?' · '+String(detail).replace(/[<>]/g,''):'');events.prepend(el);while(events.children.length>8)events.removeChild(events.lastChild)}
function openDrawer(open){drawer.classList.toggle('show',open);drawer.setAttribute('aria-hidden',String(!open))}
function stopTracks(){if(stream){for(const t of stream.getTracks())try{t.stop()}catch(_){ }stream=null}}
function stopVoice(){const v=window.NandiNeuralVoice;if(v)try{v.cancel()}catch(_){}}
function waitVoice(timeout=10000){return new Promise(resolve=>{if(window.NandiNeuralVoice)return resolve(window.NandiNeuralVoice);const start=Date.now(),t=setInterval(()=>{if(window.NandiNeuralVoice){clearInterval(t);resolve(window.NandiNeuralVoice)}else if(Date.now()-start>timeout){clearInterval(t);resolve(null)}},50)})}
async function unlockVoice(){
 const v=window.NandiNeuralVoice||await waitVoice();if(!v)return false;
 try{return await v.unlock()}catch(_){return false}
}
async function warmVoice(){
 if(voiceReady||voiceLoading)return voiceReady;voiceLoading=true;
 const v=await waitVoice();if(!v){voiceLoading=false;voiceNote.textContent='NEURAL VOICE MODULE DID NOT LOAD';return false}
 voiceNote.textContent=mobile?'PREPARING MOBILE NEURAL VOICE...':'PREPARING NEURAL VOICE...';
 try{const model=await v.load();const s=v.status?.()||{};voiceReady=Boolean(model&&s.ready);voiceNote.textContent=voiceReady?('NEURAL VOICE READY • '+String(s.dtype||'LOCAL').toUpperCase()):'NEURAL VOICE UNAVAILABLE';return voiceReady}
 catch(_){voiceNote.textContent='NEURAL VOICE UNAVAILABLE';return false}
 finally{voiceLoading=false}
}
async function speak(text){
 const clean=String(text||'').replace(/```[\s\S]*?```/g,' ').replace(/https?:\/\/\S+/g,'link').replace(/[*_#>|~]/g,' ').replace(/\s+/g,' ').trim();
 if(!clean)return;
 const v=await waitVoice();if(!v)return;
 if(!voiceReady)await warmVoice();if(!voiceReady)return;
 setState('speaking','SPEAKING','Tap the microphone to interrupt');setStage('respond','active','voice');
 const short=clean.length>520?clean.slice(0,500)+' The remaining details are on screen.':clean;
 const ok=await v.speak(short,{voice:'bm_george',speed:.97,volume:.98});
 if(ok){setStage('respond','done','delivered');setState('idle','READY','Tap the microphone to speak')}
 else{voiceNote.textContent='VOICE COULD NOT PLAY • TAP MIC ONCE AND RETRY';setStage('respond','fail','audio');setState('idle','READY','Text answer is on screen')}
}
function chooseMime(){
 const choices=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
 for(const type of choices){try{if(MediaRecorder.isTypeSupported(type))return type}catch(_){}}
 return '';
}
async function transcribe(blob){
 setState('thinking','HEARING','Transcribing your voice');setStage('listen','active','transcribing');
 const fd=new FormData();fd.append('file',blob,'nandi-voice.'+(blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm'));
 const r=await fetch('/api/transcribe',{method:'POST',headers:{'X-Nandi-Voice':'1'},body:fd});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.error||'Speech recognition failed');
 const text=String(data.text||'').trim();if(!text)throw new Error('I could not hear clear speech. Try again.');
 setStage('listen','done','captured');addEvent('VOICE IN',data.model||'whisper');return text;
}
async function ask(question){
 if(!question||busy)return;
 busy=true;send.disabled=true;promptInput.disabled=true;stopVoice();resetStages();setStage('listen','done','captured');setStage('route','active','routing');
 heard.textContent='You: '+question;reply.textContent='';answer.classList.add('show');setState('thinking','THINKING','Working on it');
 if(currentAbort)try{currentAbort.abort()}catch(_){}
 const controller=new AbortController();currentAbort=controller;const timer=setTimeout(()=>controller.abort(),65000);
 try{
  const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:'[Nandi mobile voice] Answer naturally and briefly for speech, but use tools when the request needs them. '+question,history:history.slice(-6)}),signal:controller.signal});
  if(!r.ok)throw new Error('Relay returned '+r.status);if(!r.body)throw new Error('Streaming unavailable');
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',final='',live='';
  while(true){const p=await rd.read();buf+=dec.decode(p.value||new Uint8Array(),{stream:!p.done});const lines=buf.split('\n');buf=lines.pop()||'';
   for(const line of lines){if(!line.trim())continue;const e=JSON.parse(line);
    if(e.type==='planner'){setStage('route','active',e.taskType||'planned');addEvent('PLAN',e.taskType||'general')}
    if(e.type==='worker'||e.type==='worker_selected'){setStage('route','done','model');setStage('act','active','working')}
    if(e.type==='tool'){setStage('act','active',e.tool||'tool');addEvent('TOOL',(e.tool||'tool')+(e.live?' live':''))}
    if(e.type==='reviewer'){setStage('act','done','complete');setStage('verify','active','review')}
    if(e.type==='fast_path'||e.type==='review_skipped'){setStage('verify','done','fast')}
    if(e.type==='delta'){live+=String(e.text||'');reply.textContent=live}
    if(e.type==='done'){final=String(e.answer||'').trim();setStage('act','done','complete');setStage('verify','done',String(e.review||'done'))}
    if(e.type==='error')throw new Error(e.message||'Relay error');
   }if(p.done)break}
  if(buf.trim()){const e=JSON.parse(buf);if(e.type==='done')final=String(e.answer||'').trim()}
  if(!final)final=live.trim()||'I finished, but no answer text came back.';
  reply.textContent=final;history.push({role:'user',content:question},{role:'assistant',content:final});history=history.slice(-8);
  setStage('respond','active','voice');addEvent('DONE','response ready');await speak(final);
 }catch(e){
  const msg=e&&e.name==='AbortError'?'I stopped that request.':'I hit a problem: '+(e.message||String(e));reply.textContent=msg;answer.classList.add('show');setStage('act','fail','error');setStage('respond','fail','error');setState('error','ISSUE','See the response below');addEvent('ERROR',e.message||String(e));
 }finally{clearTimeout(timer);if(currentAbort===controller)currentAbort=null;busy=false;send.disabled=false;promptInput.disabled=false}
}
async function finishRecording(){
 if(!recorder)return;
 const active=recorder;recorder=null;clearTimeout(recordTimer);recordTimer=null;micBtn.classList.remove('recording');
 try{if(active.state!=='inactive')active.stop()}catch(_){}
}
async function beginRecording(){
 if(busy){if(currentAbort)currentAbort.abort();busy=false}
 stopVoice();
 const voice=window.NandiNeuralVoice;if(voice&&typeof voice.unlock==='function')voice.unlock();
 warmVoice();
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){throw new Error('This browser does not expose microphone recording.')}
 stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
 const mime=chooseMime();chunks=[];
 recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
 recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 recorder.onerror=e=>{addEvent('MIC ERROR',e.error?.message||'recorder');setState('error','MIC ISSUE','Try tapping the microphone again')};
 recorder.onstop=async()=>{
   const type=recorder?.mimeType||mime||chunks[0]?.type||'audio/webm';const blob=new Blob(chunks,{type});stopTracks();chunks=[];
   if(!blob.size){setState('idle','READY','No audio captured. Tap to retry');return}
   try{const text=await transcribe(blob);heard.textContent='You: '+text;answer.classList.add('show');await ask(text)}
   catch(e){reply.textContent=String(e.message||e);answer.classList.add('show');setState('error','DID NOT HEAR THAT','Tap the microphone and try again');addEvent('STT ERROR',e.message||String(e))}
 };
 recorder.start(250);micBtn.classList.add('recording');setState('listening','LISTENING','Tap again to send');setStage('listen','active','recording');voiceNote.textContent='LISTENING • TAP AGAIN TO SEND';
 recordTimer=setTimeout(()=>finishRecording(),18000);
}
micBtn.addEventListener('click',async()=>{
 try{
  if(recorder&&recorder.state==='recording'){voiceNote.textContent='SENDING VOICE...';await finishRecording();return}
  await unlockVoice();await beginRecording();
 }catch(e){stopTracks();recorder=null;micBtn.classList.remove('recording');setState('error','MICROPHONE BLOCKED','Allow microphone access and tap again');reply.textContent=String(e.message||e);answer.classList.add('show');addEvent('MIC',e.message||String(e))}
});
askForm.addEventListener('submit',async e=>{e.preventDefault();const q=promptInput.value.trim();if(!q)return;promptInput.value='';await unlockVoice();warmVoice();await ask(q)});
activityBtn.addEventListener('click',()=>openDrawer(!drawer.classList.contains('show')));closeDrawer.addEventListener('click',()=>openDrawer(false));
window.addEventListener('nandi-voice',e=>{const d=e.detail||{};if(d.type==='ready'){voiceReady=true;voiceNote.textContent='NEURAL VOICE READY • '+String(d.dtype||'LOCAL').toUpperCase()}if(d.type==='blocked')voiceNote.textContent='TAP MICROPHONE ONCE TO ENABLE AUDIO';if(d.type==='error')addEvent('VOICE ERROR',String(d.error||''))});
window.__NANDI_MOBILE_TEST__={beginRecording,finishRecording,ask,setState,state:()=>({busy,recording:Boolean(recorder&&recorder.state==='recording'),voiceReady})};
resetStages();setState('idle','READY','Tap the microphone to speak');
})();
</script>
</body>
</html>
