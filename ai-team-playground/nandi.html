<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Nandi Agent</title>
<style>
/* NANDI_UI_V2 — functional agent first, reference-derived cinematic HUD */
:root{
  color-scheme:dark;
  --bg:#05070b;
  --bg2:#0b1017;
  --panel:rgba(11,15,21,.62);
  --panel-strong:rgba(11,15,21,.82);
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.14);
  --text:#f0f4f8;
  --muted:#8b96a3;
  --muted2:#626d79;
  --cyan:#7deaf6;
  --cyan2:#3aaec3;
  --gold:#d8ad61;
  --green:#76e5aa;
  --red:#ff7d86;
  --violet:#aa98ff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif}
button,input{font:inherit}
button{color:inherit}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 59% 43%,rgba(53,116,138,.16),transparent 22%),
    radial-gradient(circle at 52% 55%,rgba(214,173,97,.055),transparent 31%),
    linear-gradient(180deg,#080c12 0,#05070b 72%);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(circle at 58% 48%,#000 0,transparent 68%);
}
.app{position:fixed;inset:0;display:grid;grid-template-columns:188px 1fr;isolation:isolate}
.sidebar{
  position:relative;z-index:30;padding:18px 12px 14px;border-right:1px solid rgba(255,255,255,.065);
  background:linear-gradient(180deg,rgba(5,7,11,.90),rgba(5,7,11,.72));
  backdrop-filter:blur(24px);display:flex;flex-direction:column
}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 26px}
.brand-mark{position:relative;width:26px;height:26px;border-radius:50%;border:1px solid rgba(125,234,246,.25)}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(216,173,97,.22)}
.brand-mark:after{inset:10px;background:rgba(125,234,246,.65);border:0;box-shadow:0 0 14px rgba(125,234,246,.32)}
.brand-dot{position:absolute;right:-3px;top:-2px;width:7px;height:7px;border-radius:50%;background:#66717d;box-shadow:0 0 0 transparent;transition:.3s}
.awake .brand-dot{background:var(--green);box-shadow:0 0 15px rgba(118,229,170,.7)}
.brand h1{margin:0;font-size:12px;letter-spacing:.28em;font-weight:650}
.brand small{display:block;margin-top:5px;font-size:8px;letter-spacing:.13em;color:#6f7a86}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{
  position:relative;border:0;background:transparent;color:#8f9aa6;text-align:left;
  padding:10px 11px;border-radius:11px;cursor:pointer;transition:.2s;font-size:12px
}
.nav button:before{
  content:"";position:absolute;left:-12px;top:50%;width:2px;height:0;transform:translateY(-50%);
  background:var(--gold);box-shadow:0 0 14px rgba(216,173,97,.48);transition:.2s
}
.nav button:hover{background:rgba(255,255,255,.035);color:#dce4eb}
.nav button.active{background:linear-gradient(90deg,rgba(216,173,97,.12),rgba(255,255,255,.025));color:#fff}
.nav button.active:before{height:28px}
.nav span{display:inline-grid;place-items:center;width:22px;color:#66727e}
.nav button.active span{color:var(--gold)}
.sidebar-foot{margin-top:auto;padding:10px;color:#596571;font-size:9px;line-height:1.55;letter-spacing:.04em}
.main{position:relative;min-width:0;min-height:0}
.topbar{
  position:absolute;z-index:24;left:0;right:0;top:0;height:58px;padding:0 22px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.055);background:rgba(5,8,12,.48);backdrop-filter:blur(16px)
}
.mode-title{font-size:10px;letter-spacing:.18em;color:#a5b0bb}
.top-actions{display:flex;gap:7px}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.025);color:#8995a1;cursor:pointer;transition:.2s
}
.icon-btn:hover{color:#fff;border-color:rgba(125,234,246,.25);background:rgba(125,234,246,.055)}
.workspace{position:absolute;inset:58px 0 0;overflow:hidden}
.pipeline{
  position:absolute;z-index:20;top:18px;left:50%;transform:translateX(-50%);
  width:min(760px,64vw);height:68px;display:flex;align-items:flex-start;justify-content:space-between;
  padding:0 2px
}
.pipeline:before{
  content:"";position:absolute;left:42px;right:42px;top:16px;height:1px;
  background:linear-gradient(90deg,rgba(118,229,170,.28),rgba(125,234,246,.16),rgba(170,152,255,.16),rgba(216,173,97,.16))
}
.stage{
  position:relative;width:20%;min-width:80px;text-align:center;padding-top:34px;color:#687480;transition:.25s
}
.stage:before{
  content:"";position:absolute;top:11px;left:50%;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);
  background:#111821;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 5px rgba(8,11,16,.92);transition:.25s
}
.stage:after{
  content:"";position:absolute;top:8px;left:50%;width:16px;height:16px;border-radius:50%;transform:translateX(-50%) scale(.5);
  border:1px solid rgba(125,234,246,.28);opacity:0;transition:.25s
}
.stage .k{font-size:8px;letter-spacing:.14em}
.stage .v{font-size:9px;margin-top:4px;color:#7f8a95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.stage.active{color:#cfe7ec}
.stage.active:before{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 5px rgba(8,11,16,.95),0 0 16px rgba(125,234,246,.55)}
.stage.active:after{opacity:1;animation:nodePulse 1.4s ease-out infinite}
.stage.done:before{background:var(--green);border-color:var(--green);box-shadow:0 0 0 5px rgba(8,11,16,.95),0 0 13px rgba(118,229,170,.35)}
.stage.done{color:#93cbb1}
.stage.fail:before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 5px rgba(8,11,16,.95),0 0 13px rgba(255,125,134,.35)}
@keyframes nodePulse{0%{transform:translateX(-50%) scale(.55);opacity:.9}100%{transform:translateX(-50%) scale(1.7);opacity:0}}
.agent-zone{
  position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);
  width:min(660px,54vw);aspect-ratio:1;display:grid;place-items:center
}
.agent-zone:before{
  content:"";position:absolute;inset:1%;border-radius:50%;
  background:radial-gradient(circle,rgba(125,234,246,.045) 0,rgba(125,234,246,.012) 46%,transparent 70%);
  filter:blur(2px)
}
.agent{position:relative;width:100%;height:100%;display:grid;place-items:center}
.orbit{position:absolute;border-radius:50%;pointer-events:none}
.orbit.o1{inset:7%;border:1px solid rgba(125,234,246,.085)}
.orbit.o2{inset:16%;border:1px solid rgba(216,173,97,.075)}
.orbit.o3{inset:27%;border:1px solid rgba(170,152,255,.065)}
.orbit.o1:before,.orbit.o2:before,.orbit.o3:before{
  content:"";position:absolute;top:50%;left:50%;width:4px;height:4px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 12px rgba(125,234,246,.75);transform:translate(-50%,-50%)
}
.orbit.o1:before{top:0}.orbit.o2:before{left:100%;background:var(--gold);box-shadow:0 0 12px rgba(216,173,97,.55)}.orbit.o3:before{top:100%;background:var(--violet);box-shadow:0 0 12px rgba(170,152,255,.55)}
.ring{position:absolute;border-radius:50%;transition:.35s}
.ring.r1{inset:20%;border:1px solid rgba(125,234,246,.10)}
.ring.r2{inset:29%;border:1px dashed rgba(216,173,97,.12)}
.ring.r3{inset:38%;border:1px solid rgba(170,152,255,.10)}
.core-wrap{
  position:relative;width:30%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(125,234,246,.08),transparent 67%);
  box-shadow:0 0 70px rgba(125,234,246,.055)
}
.core{
  position:relative;width:68%;aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 36% 33%,rgba(244,254,255,.98) 0 3%,rgba(157,241,250,.95) 8%,rgba(77,177,197,.82) 22%,rgba(21,60,72,.95) 50%,#071018 74%,#05080c 100%);
  box-shadow:
    0 0 36px rgba(125,234,246,.16),
    0 0 90px rgba(125,234,246,.06),
    inset -12px -18px 28px rgba(0,0,0,.4),
    inset 10px 10px 24px rgba(255,255,255,.08);
  transition:.35s
}
.core:before{
  content:"";position:absolute;inset:-13%;border-radius:50%;border:1px solid rgba(125,234,246,.13);
  box-shadow:inset 0 0 25px rgba(125,234,246,.04)
}
.core:after{
  content:"";position:absolute;width:34%;height:16%;border-radius:50%;left:20%;top:16%;
  background:rgba(255,255,255,.11);filter:blur(7px);transform:rotate(-26deg)
}
.wave{
  position:absolute;bottom:14.5%;left:50%;transform:translateX(-50%);height:34px;
  display:flex;align-items:center;justify-content:center;gap:4px
}
.wave i{display:block;width:2px;height:5px;border-radius:4px;background:var(--cyan);opacity:.22}
.agent-label{
  position:absolute;top:76.5%;left:50%;transform:translateX(-50%);width:340px;text-align:center
}
.agent-label strong{display:block;font-size:11px;letter-spacing:.18em;font-weight:650}
.agent-label span{display:block;margin-top:6px;color:#707c88;font-size:10px}
.agent.idle .core{animation:idleBreath 4.8s ease-in-out infinite}
.agent.idle .orbit.o1{animation:orbitSlow 18s linear infinite}
.agent.idle .orbit.o2{animation:orbitSlow 24s linear infinite reverse}
.agent.wake .core{animation:wakeBurst .9s cubic-bezier(.2,.8,.2,1)}
.agent.listening .core{animation:listenPulse 1.65s ease-in-out infinite}
.agent.listening .orbit.o1{animation:orbitSlow 7s linear infinite}
.agent.listening .orbit.o2{animation:orbitSlow 9s linear infinite reverse}
.agent.routing .ring.r1{animation:spin 2.4s linear infinite}
.agent.routing .ring.r2{animation:spin 3.2s linear infinite reverse}
.agent.routing .orbit.o1{animation:orbitSlow 5s linear infinite}
.agent.acting .ring.r1,.agent.acting .ring.r2{animation:actPulse 1.35s ease-in-out infinite}
.agent.verifying .ring.r3{animation:verifyScan 1.05s ease-in-out infinite}
.agent.speaking .core{animation:speakPulse .68s ease-in-out infinite}
.agent.success .core{box-shadow:0 0 54px rgba(118,229,170,.31),0 0 115px rgba(118,229,170,.08);background:radial-gradient(circle at 36% 33%,#f1fff7 0 4%,#93edbd 11%,#2d8d68 31%,#11382c 58%,#07110d 100%)}
.agent.failure .core{box-shadow:0 0 46px rgba(255,125,134,.28)}
@keyframes idleBreath{50%{transform:scale(1.045);filter:brightness(1.08)}}
@keyframes wakeBurst{0%{transform:scale(.76);opacity:.6}45%{transform:scale(1.18);box-shadow:0 0 76px rgba(216,173,97,.4)}100%{transform:scale(1)}}
@keyframes listenPulse{50%{transform:scale(1.07);box-shadow:0 0 54px rgba(125,234,246,.32),0 0 110px rgba(125,234,246,.08)}}
@keyframes orbitSlow{to{transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes actPulse{50%{transform:scale(1.045);border-color:rgba(216,173,97,.35);box-shadow:0 0 30px rgba(216,173,97,.05)}}
@keyframes verifyScan{0%,100%{transform:scale(.93);opacity:.25}50%{transform:scale(1.08);opacity:1;border-color:rgba(170,152,255,.55)}}
@keyframes speakPulse{50%{transform:scale(1.07);filter:brightness(1.16)}}
.listening .wave i,.speaking .wave i{animation:wave 1s ease-in-out infinite;opacity:.9}
.wave i:nth-child(2){animation-delay:-.15s}.wave i:nth-child(3){animation-delay:-.35s}.wave i:nth-child(4){animation-delay:-.08s}.wave i:nth-child(5){animation-delay:-.5s}.wave i:nth-child(6){animation-delay:-.25s}.wave i:nth-child(7){animation-delay:-.42s}
@keyframes wave{0%,100%{height:5px}50%{height:27px}}
.answer{
  position:absolute;z-index:18;left:24px;top:110px;width:min(350px,28vw);max-height:calc(100% - 240px);overflow:auto;
  border:1px solid rgba(255,255,255,.075);border-radius:16px;
  background:linear-gradient(180deg,rgba(10,14,20,.78),rgba(8,11,16,.65));backdrop-filter:blur(20px);
  padding:15px 16px;opacity:0;transform:translateX(-8px);pointer-events:none;transition:.28s;
  box-shadow:0 20px 60px rgba(0,0,0,.16)
}
.answer.show{opacity:1;transform:none;pointer-events:auto}
.answer h3{margin:0 0 10px;color:var(--gold);font-size:8px;letter-spacing:.18em}
.answer p{margin:0;white-space:pre-wrap;font-size:11px;line-height:1.6;color:#d2dbe3}
.activity{
  position:absolute;z-index:18;right:24px;top:110px;width:min(300px,24vw);max-height:calc(100% - 240px);overflow:auto;
  padding:12px;background:transparent
}
.activity h3{margin:0 0 12px;font-size:8px;letter-spacing:.17em;color:#596571;text-align:right}
.event{
  position:relative;margin-top:8px;padding:9px 10px 9px 13px;border:1px solid rgba(255,255,255,.055);
  border-radius:11px;background:rgba(255,255,255,.023);font-size:9px;color:#7f8b96;backdrop-filter:blur(10px)
}
.event:before{content:"";position:absolute;left:-4px;top:50%;width:5px;height:5px;border-radius:50%;background:#33404c;transform:translateY(-50%)}
.event:first-of-type:before{background:var(--cyan);box-shadow:0 0 10px rgba(125,234,246,.55)}
.event b{color:#cbd5dd;font-weight:600}
.composer-wrap{
  position:absolute;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);
  width:min(800px,calc(100% - 80px))
}
.heard{min-height:18px;text-align:center;color:#9ba8b2;font-size:10px;margin-bottom:6px;text-shadow:0 2px 10px #000}
.composer{
  position:relative;display:flex;align-items:center;gap:9px;padding:8px 9px;
  border:1px solid rgba(255,255,255,.095);border-radius:999px;
  background:linear-gradient(180deg,rgba(13,17,23,.88),rgba(8,11,16,.87));backdrop-filter:blur(22px);
  box-shadow:0 18px 58px rgba(0,0,0,.38),0 0 0 1px rgba(125,234,246,.018) inset
}
.composer:before{
  content:"";position:absolute;inset:-1px;border-radius:999px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(125,234,246,.13),transparent);opacity:.35;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;padding:1px
}
.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#edf3f7;padding:0 8px;font-size:12px}
.composer input::placeholder{color:#66727e}
.mic,.send{flex:0 0 40px;width:40px;height:40px;border-radius:50%;cursor:pointer}
.mic{border:1px solid rgba(125,234,246,.16);background:rgba(125,234,246,.06);color:var(--cyan);box-shadow:0 0 18px rgba(125,234,246,.03)}
.send{border:0;background:linear-gradient(145deg,#e0b969,#a37332);color:#140e08;font-size:15px;box-shadow:0 0 18px rgba(216,173,97,.14)}
.status-line{text-align:center;margin-top:7px;font-size:8px;letter-spacing:.11em;color:#596571}
.enable{display:none;margin:8px auto 0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#141a21;color:#d9e2e9}.enable.show{display:block}
@media(max-width:980px){
  .app{grid-template-columns:78px 1fr}.brand{padding:8px 7px 24px}.brand h1,.brand small,.nav button{font-size:0}.brand>div:last-child{display:none}
  .brand-mark{margin:auto}.nav button{height:44px;padding:0}.nav span{width:100%;font-size:14px}.sidebar-foot{display:none}
  .pipeline{width:78vw}.activity{display:none}.answer{left:16px;width:min(320px,38vw)}
}
@media(max-width:720px){
  .app{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 14px}.workspace{inset:58px 0 0}
  .pipeline{top:12px;width:94vw;height:58px}.stage{min-width:0;padding-top:30px}.stage .v{display:none}.stage .k{font-size:7px}
  .agent-zone{width:92vw;top:48%}.answer{left:12px;right:12px;top:auto;bottom:100px;width:auto;max-height:31vh}
  .composer-wrap{width:calc(100% - 18px);bottom:9px}.mode-title{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span class="brand-dot"></span></div>
      <div><h1>NANDI</h1><small id="brandMode">IDLE</small></div>
    </div>
    <nav class="nav" id="nav">
      <button class="active" data-mode="Chat"><span>◉</span>Chat</button>
      <button data-mode="Knowledge"><span>⌘</span>Knowledge</button>
      <button data-mode="Daily Life"><span>◌</span>Daily Life</button>
      <button data-mode="Work Help"><span>▣</span>Work Help</button>
    </nav>
    <div class="sidebar-foot">VOICE + TEXT AGENT<br>RELAY-BACKED · VISIBLE EXECUTION</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="mode-title" id="modeTitle">CHAT · SAY “HI NANDI” OR TYPE</div>
      <div class="top-actions">
        <button class="icon-btn" id="muteBtn" title="Mute speech">◧</button>
        <button class="icon-btn" id="clearBtn" title="Clear session">↺</button>
      </div>
    </header>

    <section class="workspace">
      <div class="pipeline" id="stagebar">
        <div class="stage" data-stage="listen"><div class="k">LISTEN</div><div class="v" id="sListen">waiting</div></div>
        <div class="stage" data-stage="route"><div class="k">ROUTE</div><div class="v" id="sRoute">—</div></div>
        <div class="stage" data-stage="act"><div class="k">ACT</div><div class="v" id="sAct">—</div></div>
        <div class="stage" data-stage="verify"><div class="k">VERIFY</div><div class="v" id="sVerify">—</div></div>
        <div class="stage" data-stage="respond"><div class="k">RESPOND</div><div class="v" id="sRespond">—</div></div>
      </div>

      <aside id="answer" class="answer"><h3>NANDI RESPONSE</h3><p id="answerText"></p></aside>
      <aside class="activity"><h3>LIVE TRACE</h3><div id="events"></div></aside>

      <div class="agent-zone">
        <div id="agent" class="agent idle">
          <div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div>
          <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
          <div class="core-wrap"><div class="core"></div></div>
          <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="agent-label"><strong id="agentState">READY</strong><span id="agentSub">Say “Hi Nandi” or ask directly</span></div>
        </div>
      </div>

      <div class="composer-wrap">
        <div id="heard" class="heard"></div>
        <form id="askForm" class="composer" autocomplete="off">
          <button id="micBtn" class="mic" type="button" aria-label="Microphone">●</button>
          <input id="prompt" type="text" placeholder="Ask Nandi anything…" aria-label="Ask Nandi anything">
          <button id="sendBtn" class="send" type="submit" aria-label="Send">➤</button>
        </form>
        <div id="statusLine" class="status-line">Preparing microphone…</div>
        <button id="enable" class="enable" type="button">Enable microphone</button>
      </div>
    </section>
  </main>
</div>

<script type="module" src="/assets/nandi-neural-voice.js"></script>
<script>
// NANDI_VOICE_AGENT_V1
// NANDI_AUTOPLAY_RECOVERY_V1
(function(){
const $=id=>document.getElementById(id);
const app=$('app'),agent=$('agent'),brandMode=$('brandMode'),modeTitle=$('modeTitle'),heard=$('heard'),statusLine=$('statusLine'),
answer=$('answer'),answerText=$('answerText'),events=$('events'),askForm=$('askForm'),prompt=$('prompt'),micBtn=$('micBtn'),sendBtn=$('sendBtn'),
enable=$('enable'),muteBtn=$('muteBtn'),clearBtn=$('clearBtn'),nav=$('nav');
const stages=[...document.querySelectorAll('.stage')];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,awake=false,busy=false,restart=null,history=[],muted=false,currentMode='Chat';
let activeController=null,turnId=0,lastBargeAt=0,bargePending=false;
let voiceEpoch=0,voiceChain=Promise.resolve(),voiceSpeaking=false,currentVoiceText='',lastVoiceText='',lastVoiceEndedAt=0;
let speechBuffer='',voiceWarmStarted=false,voiceReady=false,voiceBlocked=false,pendingVoiceText='';

function stageEl(name){return document.querySelector('[data-stage="'+name+'"]')}
function resetStages(){stages.forEach(x=>x.classList.remove('active','done','fail'));$('sListen').textContent='waiting';$('sRoute').textContent='—';$('sAct').textContent='—';$('sVerify').textContent='—';$('sRespond').textContent='—'}
function setStage(name,state,label){const el=stageEl(name);if(!el)return;el.classList.remove('active','done','fail');if(state)el.classList.add(state);const map={listen:'sListen',route:'sRoute',act:'sAct',verify:'sVerify',respond:'sRespond'};if(label)$(map[name]).textContent=label}
function addEvent(title,detail){const d=document.createElement('div');d.className='event';d.innerHTML='<b>'+escapeHtml(title)+'</b>'+(detail?' · '+escapeHtml(detail):'');events.prepend(d);while(events.children.length>8)events.removeChild(events.lastChild)}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setAgent(state,title,sub){agent.className='agent '+state;$('agentState').textContent=title||state.toUpperCase();$('agentSub').textContent=sub||'';brandMode.textContent=(awake?'ACTIVE · ':'')+(title||state).toUpperCase()}
function setStatus(t){statusLine.textContent=t}
function shortModel(m){m=String(m||'');return m.replace(/^.*\//,'').replace(/:free$/,'').slice(0,24)||'model'}

function waitVoiceModule(timeout=12000){return new Promise(resolve=>{if(window.NandiNeuralVoice)return resolve(window.NandiNeuralVoice);const started=Date.now();const timer=setInterval(()=>{if(window.NandiNeuralVoice){clearInterval(timer);resolve(window.NandiNeuralVoice)}else if(Date.now()-started>timeout){clearInterval(timer);resolve(null)}},80)})}
async function warmVoice(){
 const voice=await waitVoiceModule();
 if(!voice){setStatus('Neural voice module unavailable.');addEvent('VOICE','module unavailable');return false}
 const existing=voice.status?.();
 if(voiceWarmStarted&&existing?.ready){voiceReady=true;return true}
 voiceWarmStarted=true;setStatus('Loading neural voice locally…');
 const loaded=await voice.load();const st=voice.status();voiceReady=Boolean(loaded&&st.ready);
 if(voiceReady){setStatus(awake?'Listening…':'Waiting for “Hi Nandi”…');addEvent('VOICE','Kokoro '+st.voice+' · '+st.device)}
 else{setStatus('Neural voice could not load. Text mode remains available.');addEvent('VOICE','load failed')}
 return voiceReady
}
async function unlockVoice(retryPending=true){
 const immediate=window.NandiNeuralVoice;
 const voice=immediate||await waitVoiceModule();if(!voice)return false;
 const unlockPromise=typeof voice.unlock==='function'?voice.unlock():Promise.resolve(Boolean(navigator.userActivation?.hasBeenActive));
 if(!voiceReady)warmVoice();
 const ok=await unlockPromise;
 if(ok){
  voiceBlocked=false;enable.classList.remove('show');
  const st=voice.status?.();if(st?.ready)voiceReady=true;
  if(awake&&!busy&&!voiceSpeaking){setAgent('listening','LISTENING','Ready for your voice');setStatus('Listening…')}
  if(retryPending&&pendingVoiceText){const pending=pendingVoiceText;pendingVoiceText='';enqueueVoice(pending)}
 }
 return ok
}
window.addEventListener('nandi-voice',ev=>{
 const e=ev.detail||{};const msg=String(e.error||'unknown');
 if(e.type==='loading'&&!busy)setStatus('Loading neural voice '+Math.round((e.progress||0)*100)+'%…');
 if(e.type==='ready'){voiceReady=true;addEvent('VOICE','ready · '+String(e.voice||''))}
 if(e.type==='unlocked'){voiceBlocked=false;enable.classList.remove('show');addEvent('VOICE','audio unlocked')}
 if(e.type==='blocked'){
  voiceReady=Boolean(window.NandiNeuralVoice?.status?.().ready);voiceBlocked=true;voiceSpeaking=false;currentVoiceText='';
  enable.textContent='Enable Nandi voice';enable.classList.add('show');setStage('respond','fail','tap to enable');
  if(awake)setAgent('listening','LISTENING','Tap once to enable voice');
  setStatus('Browser blocked audio. Tap “Enable Nandi voice” once.');addEvent('VOICE BLOCKED','one browser click required');
 }
 if(e.type==='error'){voiceSpeaking=false;currentVoiceText='';voiceReady=false;addEvent('VOICE ERROR',msg.slice(0,80))}
 if(e.type==='start'){voiceBlocked=false;enable.classList.remove('show');voiceSpeaking=true;currentVoiceText=String(e.text||'');setAgent('speaking','SPEAKING','Conversational response');setStage('respond','active','speaking')}
 if(e.type==='cancelled'){voiceSpeaking=false;currentVoiceText=''}
});

function cleanForSpeech(text){return String(text||'').replace(/\x60\x60\x60[\s\S]*?\x60\x60\x60/g,' ').replace(/\x60([^\x60]+)\x60/g,'$1').replace(/https?:\/\/\S+/g,'link').replace(/[*_#>|~]/g,' ').replace(/\[([^\]]+)\]\([^\)]+\)/g,'$1').replace(/\s+/g,' ').trim()}
function spokenSummary(text){const clean=cleanForSpeech(text);if(clean.length<=420)return clean;const parts=clean.match(/[^.!?]+[.!?]+/g)||[];let out='';for(const p of parts){if((out+p).length>420)break;out+=p}return (out.trim()||clean.slice(0,400).trim())+' I’ve put the remaining details on screen.'}
function resetVoiceQueue(reason=''){voiceEpoch++;speechBuffer='';voiceChain=Promise.resolve();const v=window.NandiNeuralVoice;if(v)try{v.cancel()}catch(_){}voiceSpeaking=false;currentVoiceText='';if(reason)addEvent('VOICE STOP',reason)}
function enqueueVoice(text){
 const cleaned=cleanForSpeech(text);if(!cleaned||muted)return;
 const epoch=voiceEpoch;voiceChain=voiceChain.then(async()=>{
  if(epoch!==voiceEpoch||muted)return false;
  const voice=await waitVoiceModule();if(!voice){voiceReady=false;return false}
  if(!voiceReady){await warmVoice();if(!voiceReady)return false}
  if(voiceBlocked&&!voice.status?.().unlocked){
   pendingVoiceText=cleaned;enable.textContent='Enable Nandi voice';enable.classList.add('show');
   setStatus('Tap “Enable Nandi voice” once to allow spoken replies.');return false
  }
  currentVoiceText=cleaned;voiceSpeaking=true;setAgent('speaking','SPEAKING','Responding naturally');setStage('respond','active','speaking');
  const ok=await voice.speak(cleaned,{voice:'bm_george',speed:.96,volume:.97});
  if(epoch!==voiceEpoch)return false;
  voiceSpeaking=false;currentVoiceText='';
  if(!ok){
   const st=voice.status?.()||{};const blocked=!st.unlocked||/user didn.?t interact|notallowed|play\(\).*failed|autoplay/i.test(String(st.lastError||''));
   if(blocked){
    voiceBlocked=true;pendingVoiceText=cleaned;enable.textContent='Enable Nandi voice';enable.classList.add('show');
    setStage('respond','fail','tap to enable');if(awake)setAgent('listening','LISTENING','Tap once to enable voice');
    setStatus('Browser blocked audio. Tap “Enable Nandi voice” once.');
   }
   return false
  }
  lastVoiceText=cleaned;lastVoiceEndedAt=Date.now();
  if(awake&&!busy){setStage('respond','done','delivered');setAgent('listening','LISTENING','Ready for the next request');setStatus('Listening…')}
  return true
 })
}
function feedSpeechDelta(delta,flush=false){if(delta)speechBuffer+=delta;let clean=speechBuffer;let cut=-1;const re=/[.!?](?:["')\]]*)\s+/g;let m;while((m=re.exec(clean))!==null){if(m.index>=24)cut=re.lastIndex}if(cut>0){const ready=clean.slice(0,cut);speechBuffer=clean.slice(cut);enqueueVoice(ready)}if(flush&&speechBuffer.trim()){const rest=speechBuffer;speechBuffer='';enqueueVoice(rest)}}
function tokenSet(s){return new Set(String(s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(x=>x.length>1))}
function likelyEcho(text){const heardSet=tokenSet(text);if(!heardSet.size)return false;const reference=(currentVoiceText+' '+lastVoiceText).trim();if(!reference)return false;const h=String(text||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').trim();const r=reference.toLowerCase().replace(/[^a-z0-9\s]/g,' ').trim();if(h.length>5&&(r.includes(h)||h.includes(r.slice(0,Math.min(r.length,80)))))return true;const refSet=tokenSet(reference);let overlap=0;for(const w of heardSet)if(refSet.has(w))overlap++;const ratio=overlap/Math.max(1,heardSet.size);const nearTail=Date.now()-lastVoiceEndedAt<1200;return ratio>=.72&&(voiceSpeaking||nearTail)}
function interruptTurn(reason='interrupted'){turnId++;if(activeController){try{activeController.abort()}catch(_){}activeController=null}busy=false;prompt.disabled=false;sendBtn.disabled=false;resetVoiceQueue(reason);bargePending=true;setStage('respond','','interrupted');setAgent('listening','LISTENING','I’m listening to the new instruction');setStatus('Interrupted · listening…')}
function beginBarge(text){if(Date.now()-lastBargeAt<700)return;if(likelyEcho(text))return;lastBargeAt=Date.now();interruptTurn('barge-in');heard.textContent=text;addEvent('BARGE-IN','new instruction detected')}
function wake(ack=true){awake=true;app.classList.add('awake');setAgent('wake','AWAKE','I’m listening');setStage('listen','active','wake detected');addEvent('WAKE','Hi Nandi');if(!voiceWarmStarted)warmVoice();setTimeout(()=>{if(!busy&&!voiceSpeaking){setAgent('listening','LISTENING','Speak naturally');setStage('listen','active','listening')}},700);if(ack)setTimeout(()=>enqueueVoice('Yes?'),120)}
function sleep(){awake=false;app.classList.remove('awake');resetStages();setAgent('idle','READY','Say “Hi Nandi” or ask directly');modeTitle.textContent=currentMode.toUpperCase()+' · SAY “HI NANDI” OR TYPE';setStatus('Waiting for “Hi Nandi”…');answer.classList.remove('show');resetVoiceQueue();if(!muted)enqueueVoice('Going quiet.')}
function modePrefix(q){const voiceGuide='[Nandi voice session] Respond naturally and concisely in one to three short spoken sentences unless I explicitly ask for detail. Never claim a tool is unavailable before trying an available tool. Do not narrate that you are about to use a tool; use it first, then report the result.';if(currentMode==='Chat')return voiceGuide+' '+q;return voiceGuide+' ['+currentMode+' mode] '+q}

async function ask(raw,{interrupt=false}={}){
 const q=String(raw||'').trim();if(!q)return;
 if(busy){if(!interrupt)return;interruptTurn('new request')}
 if(!awake){awake=true;app.classList.add('awake')}
 const myTurn=++turnId;busy=true;bargePending=false;prompt.disabled=true;sendBtn.disabled=true;answer.classList.remove('show');heard.textContent='“'+q+'”';speechBuffer='';
 resetStages();setStage('listen','done','captured');setStage('route','active','classifying');setAgent('routing','ROUTING','Choosing the right path');setStatus('Routing request…');addEvent('INPUT',currentMode);
 const c=new AbortController();activeController=c;const timer=setTimeout(()=>c.abort(),65000);let streamedSpeech=false;
 try{
  const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:modePrefix(q),history:history.slice(-6)}),signal:c.signal});
  if(!r.ok)throw new Error('Relay returned '+r.status);if(!r.body)throw new Error('Streaming unavailable');
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',final='',worker='',voiceStreamed=false;
  while(true){
   const p=await rd.read();if(myTurn!==turnId)throw new DOMException('Superseded','AbortError');
   buf+=dec.decode(p.value||new Uint8Array(),{stream:!p.done});const lines=buf.split('\n');buf=lines.pop()||'';
   for(const line of lines){
    if(!line.trim())continue;const e=JSON.parse(line);
    if(e.type==='planner'){voiceStreamed=Boolean(e.voiceStreamSafe);setStage('route','active',e.taskType||'planned');setAgent('routing','ROUTING',String(e.taskType||'planning'));addEvent('PLAN',e.taskType||'general')}
    if(e.type==='worker'||e.type==='worker_selected'){worker=e.model||worker;setStage('route','done',shortModel(worker));setStage('act','active','model working');setAgent('acting','WORKING',shortModel(worker));addEvent('MODEL',shortModel(worker))}
    if(e.type==='fallback'||e.type==='emergency_fallback'){setStage('route','active','fallback');addEvent('FALLBACK',shortModel(e.model))}
    if(e.type==='tool'){setStage('act',e.status==='unavailable'?'fail':'active',String(e.tool||'tool'));setAgent('acting','USING TOOL',String(e.tool||'tool'));addEvent('TOOL',String(e.tool||'tool')+' '+String(e.status||''))}
    if(e.type==='render'){setStage('act','active','rendering');addEvent('RENDER',e.presentation?.label||'visual')}
    if(e.type==='delta'){streamedSpeech=true;voiceStreamed=true;feedSpeechDelta(String(e.text||''),false);setStage('respond','active','streaming');if(!voiceSpeaking)setAgent('acting','RESPONDING','Preparing speech')}
    if(e.type==='stream_reset'){resetVoiceQueue('provider stream reset');streamedSpeech=false;voiceStreamed=false}
    if(e.type==='reviewer'){setStage('act','done','complete');setStage('verify','active',shortModel(e.model||'reviewer'));setAgent('verifying','VERIFYING','Independent review');addEvent('REVIEW',shortModel(e.model))}
    if(e.type==='review_failed'||e.type==='retry'){setStage('verify','active','refining');addEvent('REFINE','review requested changes')}
    if(e.type==='review_skipped'||e.type==='fast_path'){setStage('verify','done',e.type==='fast_path'?'fast path':'skipped')}
    if(e.type==='done'){final=String(e.answer||'').trim();voiceStreamed=Boolean(e.voiceStreamed||voiceStreamed);setStage('act','done','complete');setStage('verify','done',String(e.review||'done'));setStage('respond','active',voiceStreamed?'finishing speech':'preparing speech')}
    if(e.type==='error')throw new Error(e.message||'Relay error');
   }
   if(p.done)break;
  }
  if(buf.trim()){const e=JSON.parse(buf);if(e.type==='done'){final=String(e.answer||'').trim();voiceStreamed=Boolean(e.voiceStreamed||voiceStreamed)}}
  if(myTurn!==turnId)return;if(!final)final='I finished, but no answer text came back.';
  answerText.textContent=final;answer.classList.add('show');history.push({role:'user',content:q},{role:'assistant',content:final});history=history.slice(-8);
  if(voiceStreamed||streamedSpeech)feedSpeechDelta('',true);else enqueueVoice(spokenSummary(final));
  setStage('respond','active','speaking');setStatus('Complete');addEvent('DONE',voiceStreamed?'streamed voice':'verified response');if(!voiceSpeaking)setAgent('success','COMPLETE','Response ready');
 }catch(e){
  if(myTurn!==turnId)return;
  if(e&&e.name==='AbortError'){if(!bargePending){setStatus('Request stopped.');setAgent('listening','LISTENING','Ready for a new request')}return}
  const m='I hit a problem: '+(e.message||String(e));answerText.textContent=m;answer.classList.add('show');setStage('act','fail','failed');setStage('verify','fail','not reached');setStage('respond','fail','error');setAgent('failure','FAILED','See the response panel');setStatus('Request failed');addEvent('ERROR',e.message||String(e));enqueueVoice('I hit a problem. The details are on screen.');
 }finally{clearTimeout(timer);if(myTurn===turnId){busy=false;activeController=null;prompt.disabled=false;sendBtn.disabled=false;if(!voiceSpeaking&&awake)setAgent('listening','LISTENING','Ready for the next request')}}
}

function handle(t){
 t=String(t||'').trim();if(!t)return;heard.textContent='“'+t+'”';const l=t.toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();
 if(likelyEcho(t)){addEvent('ECHO','suppressed');return}
 if(!awake){if(/(^|\s)(hi|hey)\s+nandi(\s|$)/.test(l)||l==='nandi'){const rest=t.replace(/^(hi|hey)?\s*nandi[,:]?\s*/i,'').trim();wake(!rest);if(rest)setTimeout(()=>ask(rest),280)}else setStatus('Waiting for “Hi Nandi”…');return}
 if(/\b(go to sleep|sleep nandi|nandi sleep)\b/.test(l)){sleep();return}
 if(/\b(stop talking|stop speaking|be quiet)\b/.test(l)){resetVoiceQueue('user stop');setAgent('listening','LISTENING','Speech stopped');setStatus('Listening…');return}
 if(/\b(cancel that|cancel it|never mind|nevermind)\b/.test(l)){interruptTurn('cancelled by user');setStatus('Cancelled. Listening…');return}
 ask(t,{interrupt:busy||bargePending});
}
function buildMic(){
 if(!SR){setStatus('Voice recognition is not available in this browser.');return false}
 rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-IN';
 rec.onstart=()=>{enable.classList.remove('show');setStatus(awake?'Listening…':'Waiting for “Hi Nandi”…')};
 rec.onresult=ev=>{
  let inter='',finals=[];
  for(let i=ev.resultIndex;i<ev.results.length;i++){const tx=ev.results[i][0].transcript.trim();if(ev.results[i].isFinal){if(tx)finals.push(tx)}else inter+=tx+' '}
  inter=inter.trim();
  if(inter){heard.textContent=inter;const words=inter.split(/\s+/).filter(Boolean).length;if((voiceSpeaking||busy)&&words>=3&&!likelyEcho(inter))beginBarge(inter);else if(awake&&!busy)setAgent('listening','LISTENING','Hearing you…')}
  for(const tx of finals){if(likelyEcho(tx))continue;if((voiceSpeaking||busy)&&!bargePending)beginBarge(tx);handle(tx)}
 };
 rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){enable.classList.add('show');setStatus('Microphone permission needed once.')}else if(ev.error!=='no-speech'&&ev.error!=='aborted')setStatus('Mic issue: '+ev.error)};
 rec.onend=()=>{clearTimeout(restart);restart=setTimeout(()=>{try{rec.start()}catch(_){}},450)};return true;
}
async function startMic(){try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});s.getTracks().forEach(t=>t.stop())}if(!rec&&!buildMic())return;try{rec.start()}catch(_){}warmVoice()}catch(e){enable.classList.add('show');setStatus('Allow microphone access to start voice mode.')}}

if(new URLSearchParams(location.search).has('nandi_test')){
 window.__NANDI_VOICE_TEST__={
  setEcho(text){currentVoiceText=String(text||'');lastVoiceText=currentVoiceText;voiceSpeaking=true;lastVoiceEndedAt=Date.now()},
  clearEcho(){currentVoiceText='';lastVoiceText='';voiceSpeaking=false;lastVoiceEndedAt=0},
  likelyEcho(text){return likelyEcho(text)},
  armAbortProbe(){const c=new AbortController();window.__NANDI_ABORT_OBSERVED__=false;c.signal.addEventListener('abort',()=>{window.__NANDI_ABORT_OBSERVED__=true},{once:true});activeController=c;busy=true;bargePending=false;return true},
  barge(text){beginBarge(String(text||'new instruction'));return {aborted:window.__NANDI_ABORT_OBSERVED__===true,bargePending,busy,agentClass:agent.className}},
  state(){return {busy,voiceSpeaking,bargePending,turnId,agentClass:agent.className}}
 };
}
askForm.addEventListener('submit',ev=>{ev.preventDefault();const q=prompt.value.trim();if(!q)return;prompt.value='';if(!awake)wake(false);ask(q,{interrupt:busy})});
micBtn.addEventListener('click',()=>{unlockVoice();if(!rec)startMic();if(!awake)wake(true);else{if(voiceSpeaking||busy)beginBarge('voice interruption');setAgent('listening','LISTENING','Speak now')}});
enable.addEventListener('click',()=>{unlockVoice();startMic()});
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'×':'◧';if(muted)resetVoiceQueue('muted');else warmVoice()});
clearBtn.addEventListener('click',()=>{interruptTurn('session cleared');history=[];events.innerHTML='';answer.classList.remove('show');heard.textContent='';awake=false;app.classList.remove('awake');resetStages();setAgent('idle','READY','Say “Hi Nandi” or ask directly');setStatus('Waiting for “Hi Nandi”…')});
nav.addEventListener('click',ev=>{const b=ev.target.closest('button[data-mode]');if(!b)return;[...nav.querySelectorAll('button')].forEach(x=>x.classList.remove('active'));b.classList.add('active');currentMode=b.dataset.mode;modeTitle.textContent=currentMode.toUpperCase()+' · '+(awake?'ACTIVE':'SAY “HI NANDI” OR TYPE');prompt.placeholder='Ask Nandi in '+currentMode+' mode…';addEvent('MODE',currentMode)});
window.addEventListener('pointerdown',()=>{const v=window.NandiNeuralVoice;if(v&&typeof v.unlock==='function')v.unlock();warmVoice()},{once:true});
window.addEventListener('keydown',()=>{const v=window.NandiNeuralVoice;if(v&&typeof v.unlock==='function')v.unlock();warmVoice()},{once:true});
window.addEventListener('load',()=>{resetStages();setTimeout(startMic,500);setTimeout(warmVoice,1200)});
})();
