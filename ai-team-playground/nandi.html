<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Nandi Agent</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07090d;--panel:rgba(14,18,25,.72);--line:rgba(255,255,255,.09);
  --text:#eef3f7;--muted:#8f9aa6;--cyan:#78e7f4;--gold:#d6a754;--green:#72e4a9;
  --red:#ff7a82;--violet:#a993ff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:
radial-gradient(circle at 50% 20%,#16202b 0,#0c1118 34%,#07090d 70%);font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text)}
button,input{font:inherit}
.app{position:fixed;inset:0;display:grid;grid-template-columns:210px 1fr;min-height:100dvh}
.sidebar{border-right:1px solid var(--line);background:rgba(7,9,13,.74);backdrop-filter:blur(18px);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-dot{width:9px;height:9px;border-radius:50%;background:#64707d;box-shadow:0 0 0 transparent;transition:.3s}
.awake .brand-dot{background:var(--green);box-shadow:0 0 18px rgba(114,228,169,.7)}
.brand h1{margin:0;font-size:13px;letter-spacing:.24em}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.08em;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{border:0;background:transparent;color:#aab3bd;text-align:left;padding:11px 12px;border-radius:12px;cursor:pointer;transition:.18s}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{box-shadow:inset 2px 0 0 var(--gold)}
.nav span{display:inline-block;width:22px;color:#798694}
.sidebar-foot{margin-top:auto;color:#69747f;font-size:10px;padding:8px;line-height:1.5}
.main{position:relative;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(8,11,16,.52);backdrop-filter:blur(16px)}
.mode-title{font-size:12px;letter-spacing:.12em;color:#cbd4dd}
.top-actions{display:flex;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:#cfd8e0;cursor:pointer}
.stagebar{display:grid;grid-template-columns:repeat(5,minmax(80px,1fr));gap:8px;padding:14px 22px 0}
.stage{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:13px;padding:10px 12px;min-height:54px;transition:.25s;overflow:hidden}
.stage:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--cyan);transition:.35s}
.stage .k{font-size:9px;letter-spacing:.14em;color:#6f7b87}
.stage .v{font-size:11px;margin-top:5px;color:#aeb8c1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage.active{border-color:rgba(120,231,244,.3);background:rgba(120,231,244,.055);box-shadow:0 0 28px rgba(120,231,244,.06)}
.stage.active:after{width:100%;animation:stageSweep 1.4s ease-in-out infinite}
.stage.done{border-color:rgba(114,228,169,.22);background:rgba(114,228,169,.045)}
.stage.done:after{width:100%;background:var(--green)}
.stage.fail{border-color:rgba(255,122,130,.3);background:rgba(255,122,130,.05)}
.stage.fail:after{width:100%;background:var(--red)}
@keyframes stageSweep{0%,100%{opacity:.4;transform:translateX(-30%)}50%{opacity:1;transform:translateX(10%)}}
.workspace{position:relative;flex:1;display:grid;place-items:center;padding:24px 24px 132px;overflow:hidden}
.gridGlow{position:absolute;inset:0;opacity:.22;background-image:
linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
background-size:34px 34px;mask-image:radial-gradient(circle at 50% 45%,#000 0,transparent 72%)}
.agent{position:relative;width:min(42vw,410px);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(120,231,244,.13);inset:8%;transition:.4s}
.ring.r2{inset:20%;border-color:rgba(214,167,84,.14)}
.ring.r3{inset:31%;border-color:rgba(169,147,255,.16)}
.core{position:relative;width:34%;aspect-ratio:1;border-radius:50%;
background:radial-gradient(circle at 38% 34%,#d8fbff 0,#7bd8e3 12%,#214b59 37%,#101820 67%,#080b0f 100%);
box-shadow:0 0 42px rgba(120,231,244,.15),inset 0 0 24px rgba(255,255,255,.1);transition:.35s}
.core:before,.core:after{content:"";position:absolute;border-radius:50%;inset:-18%;border:1px solid rgba(120,231,244,.12);opacity:.25}
.core:after{inset:-36%;border-color:rgba(214,167,84,.12)}
.agent.idle .core{animation:idleBreath 4.8s ease-in-out infinite}
.agent.wake .core{animation:wakeBurst .9s cubic-bezier(.2,.8,.2,1)}
.agent.listening .core{animation:listenPulse 1.65s ease-in-out infinite}
.agent.routing .ring{animation:spin 5s linear infinite}
.agent.routing .r2{animation-direction:reverse;animation-duration:3.7s}
.agent.acting .ring{animation:actPulse 1.4s ease-in-out infinite}
.agent.verifying .r3{animation:verifyScan 1.1s ease-in-out infinite}
.agent.speaking .core{animation:speakPulse .72s ease-in-out infinite}
.agent.success .core{box-shadow:0 0 56px rgba(114,228,169,.42);background:radial-gradient(circle at 38% 34%,#e8fff4,#72e4a9 16%,#184838 44%,#09120f 100%)}
.agent.failure .core{box-shadow:0 0 48px rgba(255,122,130,.35)}
@keyframes idleBreath{50%{transform:scale(1.045);box-shadow:0 0 52px rgba(120,231,244,.2)}}
@keyframes wakeBurst{0%{transform:scale(.8);opacity:.55}45%{transform:scale(1.22);box-shadow:0 0 80px rgba(214,167,84,.44)}100%{transform:scale(1)}}
@keyframes listenPulse{50%{transform:scale(1.08);box-shadow:0 0 72px rgba(120,231,244,.36)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes actPulse{50%{transform:scale(1.03);border-color:rgba(214,167,84,.45);box-shadow:0 0 34px rgba(214,167,84,.08)}}
@keyframes verifyScan{0%,100%{transform:scale(.94);opacity:.25}50%{transform:scale(1.08);opacity:.9;border-color:rgba(169,147,255,.6)}}
@keyframes speakPulse{50%{transform:scale(1.065);filter:brightness(1.12)}}
.wave{position:absolute;bottom:-48px;display:flex;align-items:center;justify-content:center;gap:5px;height:38px}
.wave i{display:block;width:3px;height:8px;border-radius:4px;background:var(--cyan);opacity:.28}
.listening .wave i,.speaking .wave i{animation:wave 1s ease-in-out infinite;opacity:.9}
.wave i:nth-child(2){animation-delay:-.15s}.wave i:nth-child(3){animation-delay:-.35s}.wave i:nth-child(4){animation-delay:-.1s}.wave i:nth-child(5){animation-delay:-.48s}.wave i:nth-child(6){animation-delay:-.25s}.wave i:nth-child(7){animation-delay:-.4s}
@keyframes wave{0%,100%{height:7px}50%{height:31px}}
.agent-label{position:absolute;top:calc(100% + 12px);text-align:center;width:320px;left:50%;transform:translateX(-50%)}
.agent-label strong{display:block;font-size:12px;letter-spacing:.12em}
.agent-label span{display:block;margin-top:6px;color:#8d99a4;font-size:11px}
.activity{position:absolute;right:22px;top:86px;width:min(330px,30vw);max-height:calc(100% - 230px);overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(11,14,19,.62);backdrop-filter:blur(16px);padding:12px}
.activity h3{margin:0 0 9px;font-size:9px;letter-spacing:.16em;color:#7c8894}
.event{padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.025);margin-top:7px;font-size:10px;color:#9da9b3;border:1px solid rgba(255,255,255,.04)}
.event b{color:#d7e0e7;font-weight:600}
.answer{position:absolute;left:22px;top:86px;width:min(360px,29vw);max-height:calc(100% - 230px);overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(11,14,19,.66);backdrop-filter:blur(16px);padding:14px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}
.answer.show{opacity:1;transform:none;pointer-events:auto}
.answer h3{margin:0 0 9px;font-size:9px;letter-spacing:.16em;color:var(--gold)}
.answer p{margin:0;white-space:pre-wrap;font-size:12px;line-height:1.52;color:#d6dee5}
.composer-wrap{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(820px,calc(100% - 56px));z-index:30}
.heard{min-height:20px;text-align:center;color:#9eabb5;font-size:11px;margin-bottom:7px}
.composer{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid rgba(255,255,255,.1);background:rgba(10,13,18,.84);backdrop-filter:blur(20px);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.composer input{flex:1;min-width:0;border:0;outline:0;color:#edf3f7;background:transparent;padding:0 8px;font-size:13px}
.composer input::placeholder{color:#6f7b86}
.mic,.send{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);cursor:pointer}
.mic{background:rgba(120,231,244,.07);color:var(--cyan)}
.send{background:linear-gradient(145deg,#e0b767,#9e6e2b);color:#171009;border:0;font-weight:700}
.status-line{text-align:center;margin-top:7px;font-size:9px;letter-spacing:.1em;color:#75818d}
.enable{display:none;margin:8px auto 0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#151b22;color:#dce5eb}.enable.show{display:block}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.sidebar{display:none}.stagebar{grid-template-columns:repeat(5,1fr);padding:10px 10px 0}.stage{padding:8px;min-width:0}.stage .v{display:none}
 .topbar{padding:0 14px}.workspace{padding:12px 12px 126px}.agent{width:min(72vw,360px)}
 .activity{display:none}.answer{left:12px;right:12px;top:auto;bottom:112px;width:auto;max-height:32vh}.composer-wrap{width:calc(100% - 20px);bottom:10px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-dot"></span><div><h1>NANDI</h1><small id="brandMode">IDLE</small></div></div>
    <nav class="nav" id="nav">
      <button class="active" data-mode="Chat"><span>◉</span>Chat</button>
      <button data-mode="Knowledge"><span>⌘</span>Knowledge</button>
      <button data-mode="Daily Life"><span>◌</span>Daily Life</button>
      <button data-mode="Work Help"><span>▣</span>Work Help</button>
    </nav>
    <div class="sidebar-foot">Voice + text agent<br>Relay-backed · visible execution</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="mode-title" id="modeTitle">CHAT · SAY “HI NANDI” OR TYPE</div>
      <div class="top-actions"><button class="icon-btn" id="muteBtn" title="Mute speech">◧</button><button class="icon-btn" id="clearBtn" title="Clear">↺</button></div>
    </header>

    <section class="stagebar" id="stagebar">
      <div class="stage" data-stage="listen"><div class="k">01 · LISTEN</div><div class="v" id="sListen">waiting</div></div>
      <div class="stage" data-stage="route"><div class="k">02 · ROUTE</div><div class="v" id="sRoute">—</div></div>
      <div class="stage" data-stage="act"><div class="k">03 · ACT</div><div class="v" id="sAct">—</div></div>
      <div class="stage" data-stage="verify"><div class="k">04 · VERIFY</div><div class="v" id="sVerify">—</div></div>
      <div class="stage" data-stage="respond"><div class="k">05 · RESPOND</div><div class="v" id="sRespond">—</div></div>
    </section>

    <section class="workspace">
      <div class="gridGlow"></div>
      <aside id="answer" class="answer"><h3>NANDI</h3><p id="answerText"></p></aside>
      <aside class="activity"><h3>LIVE FLOW</h3><div id="events"></div></aside>

      <div id="agent" class="agent idle">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="core"></div>
        <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="agent-label"><strong id="agentState">READY</strong><span id="agentSub">Say “Hi Nandi” or ask directly</span></div>
      </div>

      <div class="composer-wrap">
        <div id="heard" class="heard"></div>
        <form id="askForm" class="composer" autocomplete="off">
          <button id="micBtn" class="mic" type="button" aria-label="Microphone">●</button>
          <input id="prompt" type="text" placeholder="Ask Nandi anything…" aria-label="Ask Nandi anything">
          <button id="sendBtn" class="send" type="submit" aria-label="Send">➤</button>
        </form>
        <div id="statusLine" class="status-line">Preparing microphone…</div>
        <button id="enable" class="enable" type="button">Enable microphone</button>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const app=$('app'),agent=$('agent'),brandMode=$('brandMode'),modeTitle=$('modeTitle'),heard=$('heard'),statusLine=$('statusLine'),
answer=$('answer'),answerText=$('answerText'),events=$('events'),askForm=$('askForm'),prompt=$('prompt'),micBtn=$('micBtn'),sendBtn=$('sendBtn'),
enable=$('enable'),muteBtn=$('muteBtn'),clearBtn=$('clearBtn'),nav=$('nav');
const stages=[...document.querySelectorAll('.stage')];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,awake=false,busy=false,restart=null,history=[],muted=false,currentMode='Chat';

function stageEl(name){return document.querySelector('[data-stage="'+name+'"]')}
function resetStages(){stages.forEach(x=>x.classList.remove('active','done','fail'));$('sListen').textContent='waiting';$('sRoute').textContent='—';$('sAct').textContent='—';$('sVerify').textContent='—';$('sRespond').textContent='—'}
function setStage(name,state,label){
 const el=stageEl(name); if(!el)return;
 el.classList.remove('active','done','fail'); if(state)el.classList.add(state);
 const map={listen:'sListen',route:'sRoute',act:'sAct',verify:'sVerify',respond:'sRespond'}; if(label)$(map[name]).textContent=label;
}
function addEvent(title,detail){
 const d=document.createElement('div');d.className='event';d.innerHTML='<b>'+escapeHtml(title)+'</b>'+(detail?' · '+escapeHtml(detail):'');events.prepend(d);
 while(events.children.length>8)events.removeChild(events.lastChild);
}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setAgent(state,title,sub){
 agent.className='agent '+state;
 $('agentState').textContent=title||state.toUpperCase();
 $('agentSub').textContent=sub||'';
 brandMode.textContent=(awake?'ACTIVE · ':'')+(title||state).toUpperCase();
}
function setStatus(t){statusLine.textContent=t}
function wake(){
 awake=true;app.classList.add('awake');setAgent('wake','AWAKE','I’m listening');
 setStage('listen','active','wake detected');addEvent('WAKE','Hi Nandi');
 setTimeout(()=>{if(!busy){setAgent('listening','LISTENING','Speak naturally');setStage('listen','active','listening')}},850);
}
function sleep(){
 awake=false;app.classList.remove('awake');resetStages();setAgent('idle','READY','Say “Hi Nandi” or ask directly');
 modeTitle.textContent=currentMode.toUpperCase()+' · SAY “HI NANDI” OR TYPE';setStatus('Waiting for “Hi Nandi”…');answer.classList.remove('show');
 if(!muted)say('Going quiet.');
}
function say(t){
 if(muted||!('speechSynthesis' in window)||!t)return;
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.98;u.pitch=.92;u.volume=.92;
 u.onstart=()=>{setAgent('speaking','SPEAKING','Responding');setStage('respond','active','speaking')};
 u.onend=()=>{setStage('respond','done','delivered');if(awake&&!busy)setAgent('listening','LISTENING','Ready for the next request')};
 speechSynthesis.speak(u);
}
function modePrefix(q){
 if(currentMode==='Chat')return q;
 return '['+currentMode+' mode] '+q;
}
async function ask(raw){
 const q=String(raw||'').trim();if(!q||busy)return;
 if(!awake){awake=true;app.classList.add('awake')}
 busy=true;prompt.disabled=true;sendBtn.disabled=true;answer.classList.remove('show');heard.textContent='“'+q+'”';
 resetStages();setStage('listen','done','captured');setStage('route','active','classifying');setAgent('routing','ROUTING','Choosing the right path');setStatus('Routing request…');addEvent('INPUT',currentMode);
 try{
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),55000);
  const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:modePrefix(q),history:history.slice(-6)}),signal:c.signal});
  clearTimeout(timer);if(!r.ok)throw new Error('Relay returned '+r.status);if(!r.body)throw new Error('Streaming unavailable');
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',final='',worker='';
  while(true){
   const p=await rd.read();buf+=dec.decode(p.value||new Uint8Array(),{stream:!p.done});const lines=buf.split('\n');buf=lines.pop()||'';
   for(const line of lines){
    if(!line.trim())continue;const e=JSON.parse(line);
    if(e.type==='planner'){
      setStage('route','active',e.taskType||'planned');setAgent('routing','ROUTING',String(e.taskType||'planning'));addEvent('PLAN',e.taskType||'general');
    }
    if(e.type==='worker'||e.type==='worker_selected'){
      worker=e.model||worker;setStage('route','done',shortModel(worker));setStage('act','active','model working');setAgent('acting','WORKING',shortModel(worker));addEvent('MODEL',shortModel(worker));
    }
    if(e.type==='fallback'||e.type==='emergency_fallback'){
      setStage('route','active','fallback');addEvent('FALLBACK',shortModel(e.model));
    }
    if(e.type==='tool'){
      setStage('act',e.status==='unavailable'?'fail':'active',String(e.tool||'tool'));setAgent('acting','USING TOOL',String(e.tool||'tool'));addEvent('TOOL',String(e.tool||'tool')+' '+String(e.status||''));
    }
    if(e.type==='render'){setStage('act','active','rendering');addEvent('RENDER',e.presentation?.label||'visual')}
    if(e.type==='reviewer'){
      setStage('act','done','complete');setStage('verify','active',shortModel(e.model||'reviewer'));setAgent('verifying','VERIFYING','Independent review');addEvent('REVIEW',shortModel(e.model));
    }
    if(e.type==='review_failed'||e.type==='retry'){setStage('verify','active','refining');addEvent('REFINE','review requested changes')}
    if(e.type==='review_skipped'||e.type==='fast_path'){setStage('verify','done',e.type==='fast_path'?'fast path':'skipped')}
    if(e.type==='done'){
      final=String(e.answer||'').trim();setStage('act','done','complete');setStage('verify','done',String(e.review||'done'));setStage('respond','active','preparing');
    }
    if(e.type==='error')throw new Error(e.message||'Relay error');
   }
   if(p.done)break;
  }
  if(buf.trim()){const e=JSON.parse(buf);if(e.type==='done')final=String(e.answer||'').trim()}
  if(!final)final='I finished, but no answer text came back.';
  answerText.textContent=final;answer.classList.add('show');history.push({role:'user',content:q},{role:'assistant',content:final});history=history.slice(-8);
  setStage('respond','active','speaking');setAgent('success','COMPLETE','Verified response ready');setStatus('Complete');addEvent('DONE','response ready');
  setTimeout(()=>say(final),280);
 }catch(e){
  const m=e&&e.name==='AbortError'?'That took too long. I stopped the request.':'I hit a problem: '+(e.message||String(e));
  answerText.textContent=m;answer.classList.add('show');setStage('act','fail','failed');setStage('verify','fail','not reached');setStage('respond','fail','error');
  setAgent('failure','FAILED','See the response panel');setStatus('Request failed');addEvent('ERROR',e.message||String(e));if(!muted)say(m);
 }finally{busy=false;prompt.disabled=false;sendBtn.disabled=false}
}
function shortModel(m){m=String(m||'');return m.replace(/^.*\//,'').replace(/:free$/,'').slice(0,24)||'model'}
function handle(t){
 t=String(t||'').trim();if(!t)return;heard.textContent='“'+t+'”';
 const l=t.toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();
 if(!awake){
  if(/(^|\s)(hi|hey)\s+nandi(\s|$)/.test(l)||l==='nandi'){wake();if(l.replace(/^(hi|hey)?\s*nandi\s*/,'').trim())setTimeout(()=>ask(t.replace(/^(hi|hey)?\s*nandi[,:]?\s*/i,'')),900)}
  else setStatus('Waiting for “Hi Nandi”…');
  return;
 }
 if(/\b(go to sleep|sleep nandi|nandi sleep)\b/.test(l)){sleep();return}
 if(/\b(stop talking|stop speaking)\b/.test(l)){if('speechSynthesis'in window)speechSynthesis.cancel();setAgent('listening','LISTENING','Speech stopped');return}
 ask(t);
}
function buildMic(){
 if(!SR){setStatus('Voice recognition is not available in this browser.');return false}
 rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-IN';
 rec.onstart=()=>{enable.classList.remove('show');setStatus(awake?'Listening…':'Waiting for “Hi Nandi”…')};
 rec.onresult=ev=>{let inter='';for(let i=ev.resultIndex;i<ev.results.length;i++){const tx=ev.results[i][0].transcript;if(ev.results[i].isFinal)handle(tx);else inter+=tx}if(inter&&!busy){heard.textContent=inter;if(awake)setAgent('listening','LISTENING','Hearing you…')}};
 rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){enable.classList.add('show');setStatus('Microphone permission needed once.')}else if(ev.error!=='no-speech'&&ev.error!=='aborted')setStatus('Mic issue: '+ev.error)};
 rec.onend=()=>{clearTimeout(restart);restart=setTimeout(()=>{try{rec.start()}catch(_){}},650)};return true;
}
async function startMic(){
 try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}if(!rec&&!buildMic())return;try{rec.start()}catch(_){}}
 catch(e){enable.classList.add('show');setStatus('Allow microphone access to start voice mode.')}
}
askForm.addEventListener('submit',ev=>{ev.preventDefault();const q=prompt.value.trim();if(!q)return;prompt.value='';if(!awake)wake();setTimeout(()=>ask(q),awake?0:650)});
micBtn.addEventListener('click',()=>{if(!rec)startMic();if(!awake)wake();else setAgent('listening','LISTENING','Speak now')});
enable.addEventListener('click',startMic);
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'×':'◧';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel()});
clearBtn.addEventListener('click',()=>{history=[];events.innerHTML='';answer.classList.remove('show');heard.textContent='';sleep()});
nav.addEventListener('click',ev=>{const b=ev.target.closest('button[data-mode]');if(!b)return;[...nav.querySelectorAll('button')].forEach(x=>x.classList.remove('active'));b.classList.add('active');currentMode=b.dataset.mode;modeTitle.textContent=currentMode.toUpperCase()+' · '+(awake?'ACTIVE':'SAY “HI NANDI” OR TYPE');prompt.placeholder='Ask Nandi in '+currentMode+' mode…';addEvent('MODE',currentMode)});
window.addEventListener('load',()=>{resetStages();setTimeout(startMic,500)});
})();
</script>
