<div class="top"><span class="dot"></span><div><span class="name">NANDI</span><span id="mode" class="mode">IDLE · SAY “HI NANDI”</span></div></div>
<div id="answer" class="answer"><b>NANDI</b><span id="answerText"></span></div>
<div class="center"><div id="heard" class="heard"></div><button id="enable" class="enable" type="button">Enable microphone</button><div id="status" class="status">Preparing default microphone…</div></div>
</div>
<script>
(function(){
const scene=document.getElementById('scene'),status=document.getElementById('status'),heard=document.getElementById('heard'),mode=document.getElementById('mode'),enable=document.getElementById('enable'),answer=document.getElementById('answer'),answerText=document.getElementById('answerText');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,awake=false,busy=false,restart=null,history=[];
function setState(s){scene.classList.remove('listening','thinking','speaking');if(s)scene.classList.add(s)}
function setStatus(t){status.textContent=t;if(/Working|Understanding|Thinking|Using|Verifying/.test(t))setState('thinking');else if(/Listening/.test(t))setState('listening')}
function say(t){if(!('speechSynthesis' in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.98;u.pitch=.92;u.volume=.92;u.onstart=function(){setState('speaking')};u.onend=function(){if(awake&&!busy)setState('listening')};speechSynthesis.speak(u)}
function wake(){setState('listening');scene.classList.remove('ack');void scene.offsetWidth;scene.classList.add('ack','awake');awake=true;mode.textContent='ACTIVE · LISTENING';setStatus('Listening…');say("I'm listening.")}
function sleep(){setState('');awake=false;scene.classList.remove('awake');mode.textContent='IDLE · SAY “HI NANDI”';setStatus('Waiting for “Hi Nandi”…');answer.classList.remove('show');say('Going quiet.')}
async function ask(q){if(busy)return;busy=true;setStatus('Working…');heard.textContent='“'+q+'”';answer.classList.remove('show');try{const c=new AbortController();const timer=setTimeout(function(){c.abort()},55000);const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(-6)}),signal:c.signal});clearTimeout(timer);if(!r.ok)throw new Error('Relay returned '+r.status);if(!r.body)throw new Error('Streaming unavailable');const rd=r.body.getReader(),dec=new TextDecoder();let buf='',final='';while(true){const p=await rd.read();buf+=dec.decode(p.value||new Uint8Array(),{stream:!p.done});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(!line.trim())continue;const e=JSON.parse(line);if(e.type==='planner')setStatus('Understanding…');if(e.type==='worker'||e.type==='worker_selected')setStatus('Thinking…');if(e.type==='tool')setStatus('Using '+String(e.tool||'tool')+'…');if(e.type==='reviewer')setStatus('Verifying…');if(e.type==='done')final=String(e.answer||'').trim();if(e.type==='error')throw new Error(e.message||'Relay error')}if(p.done)break}if(buf.trim()){const e=JSON.parse(buf);if(e.type==='done')final=String(e.answer||'').trim()}if(!final)final='I finished, but no answer text came back.';answerText.textContent=final;answer.classList.add('show');history.push({role:'user',content:q},{role:'assistant',content:final});history=history.slice(-8);setStatus('Listening…');say(final)}catch(e){const m=e&&e.name==='AbortError'?'That took too long. I stopped the request.':'I hit a problem: '+(e.message||String(e));answerText.textContent=m;answer.classList.add('show');setStatus('Listening…');say(m)}finally{busy=false}}
function handle(t){t=String(t||'').trim();if(!t)return;heard.textContent='“'+t+'”';const l=t.toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();if(!awake){if(/(^|\s)(hi|hey)\s+nandi(\s|$)/.test(l)||l==='nandi')wake();else setStatus('Waiting for “Hi Nandi”…');return}if(/\b(go to sleep|sleep nandi|nandi sleep)\b/.test(l)){sleep();return}if(/\b(stop talking|stop speaking)\b/.test(l)){if('speechSynthesis' in window)speechSynthesis.cancel();return}ask(t)}
function build(){if(!SR){mode.textContent='BROWSER VOICE UNSUPPORTED';setStatus('Voice recognition is not available in this browser.');return false}rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-IN';rec.onstart=function(){enable.classList.remove('show');setStatus(awake?'Listening…':'Waiting for “Hi Nandi”…')};rec.onresult=function(ev){let inter='';for(let i=ev.resultIndex;i<ev.results.length;i++){const tx=ev.results[i][0].transcript;if(ev.results[i].isFinal)handle(tx);else inter+=tx}if(inter&&!busy)heard.textContent=inter};rec.onerror=function(ev){if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){enable.classList.add('show');setStatus('Microphone permission needed once.')}else if(ev.error!=='no-speech'&&ev.error!=='aborted')setStatus('Mic issue: '+ev.error)};rec.onend=function(){clearTimeout(restart);restart=setTimeout(function(){try{rec.start()}catch(_){}},650)};return true}
async function start(){try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(function(t){t.stop()})}if(!rec&&!build())return;try{rec.start()}catch(_){}}catch(e){enable.classList.add('show');setStatus('Allow microphone access to start Nandi.')}}
enable.addEventListener('click',start);window.addEventListener('load',function(){setTimeout(start,500)})
})();
</script>
</body>
</html>
