<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>Nandi</title>
<style>
:root{color-scheme:dark;--gold:#d7b56d;--cyan:#8eefff;--green:#83f4bd}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;font-family:Inter,Segoe UI,system-ui,sans-serif}
.scene{position:fixed;inset:0;overflow:hidden;background:#05080d}
.bg{position:absolute;inset:-2%;width:104%;height:104%;filter:saturate(.98) brightness(.9) contrast(1.04);transform:scale(1.025);transition:.45s;user-select:none;pointer-events:none}
.bg svg{display:block;width:100%;height:100%}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,transparent 0 26%,rgba(2,6,10,.08) 48%,rgba(2,6,10,.38) 100%),linear-gradient(180deg,rgba(2,5,9,.12),transparent 38%,rgba(2,5,9,.27))}
.aura{position:absolute;left:50%;top:72%;width:200px;height:120px;transform:translate(-50%,-50%);border-radius:50%;opacity:0;box-shadow:0 0 78px 28px rgba(142,239,255,.18)}
.scene.awake .aura{opacity:1;animation:breathe 2.3s ease-in-out infinite}.scene.awake .bg{filter:saturate(1.04) brightness(.94)}.scene.ack .bg{animation:ack .92s cubic-bezier(.2,.8,.25,1)}
.top{position:absolute;left:24px;top:20px;color:#eef5fb;text-shadow:0 2px 18px #000;display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#8694a0}.scene.awake .dot{background:var(--green);box-shadow:0 0 18px rgba(131,244,189,.9)}
.name{font-size:12px;font-weight:700;letter-spacing:.23em}.mode{display:block;margin-top:4px;color:#c5d0da;font-size:9px;letter-spacing:.09em}
.center{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:9px;max-width:min(700px,90vw);text-align:center}.heard{min-height:20px;color:#e2edf5;font-size:13px;text-shadow:0 2px 15px #000}.status{padding:10px 15px;border:1px solid rgba(255,255,255,.1);background:rgba(4,8,13,.55);backdrop-filter:blur(18px);border-radius:999px;color:#eef6fb;font-size:11px;letter-spacing:.08em}
.enable{display:none;border:1px solid rgba(215,181,109,.38);background:rgba(8,10,13,.72);color:#ffecc0;border-radius:999px;padding:10px 15px;cursor:pointer}.enable.show{display:block}
.answer{position:absolute;right:22px;bottom:22px;width:min(430px,42vw);max-height:46vh;overflow:auto;border:1px solid rgba(255,255,255,.09);background:rgba(4,8,13,.74);backdrop-filter:blur(20px);border-radius:20px;padding:17px;color:#e8eef4;font-size:13px;line-height:1.52;opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none}.answer.show{opacity:1;transform:none}.answer b{display:block;color:#ffe6aa;font-size:10px;letter-spacing:.14em;margin-bottom:8px}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.68}}@keyframes ack{0%,100%{transform:scale(1.025) rotate(0)}22%{transform:scale(1.03) rotate(-.34deg)}48%{transform:scale(1.025) rotate(.34deg)}72%{transform:scale(1.029) rotate(-.2deg)}}
@media(max-width:720px){.answer{left:14px;right:14px;width:auto;bottom:90px}.top{left:16px;top:16px}.center{bottom:18px}}

/* Nandi immersive v1 — additive only; voice/Relay baseline stays unchanged */
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;background:
radial-gradient(circle at 50% 71%,rgba(142,239,255,.09),transparent 18%),
radial-gradient(circle at 50% 76%,rgba(215,181,109,.06),transparent 32%);mix-blend-mode:screen}
.aura{transition:opacity .35s,box-shadow .35s,filter .35s}
.scene.listening .aura{opacity:.95;box-shadow:0 0 90px 38px rgba(142,239,255,.30);animation:listenPulse 1.45s ease-in-out infinite}
.scene.thinking .aura{opacity:1;box-shadow:0 0 115px 44px rgba(215,181,109,.30);animation:thinkPulse 1.1s ease-in-out infinite}
.scene.speaking .aura{opacity:.9;box-shadow:0 0 105px 40px rgba(131,244,189,.27);animation:speakPulse .78s ease-in-out infinite}
.scene.awake .bg{transform-origin:50% 74%;animation:nandiBreath 4.8s ease-in-out infinite}
.scene.ack .bg{animation:nandiNod 1.08s cubic-bezier(.2,.8,.25,1)}
.scene.thinking .bg{filter:saturate(1.08) brightness(.9);transform:scale(1.032)}
.scene.speaking .bg{filter:saturate(1.07) brightness(.98)}
@keyframes nandiBreath{0%,100%{transform:scale(1.025) translateY(0)}50%{transform:scale(1.031) translateY(-2px)}}
@keyframes nandiNod{0%,100%{transform:scale(1.025) translateY(0)}24%{transform:scale(1.034) translateY(5px) rotate(-.18deg)}48%{transform:scale(1.029) translateY(-2px) rotate(.16deg)}72%{transform:scale(1.032) translateY(3px)}}
@keyframes listenPulse{50%{transform:translate(-50%,-50%) scale(1.14);filter:brightness(1.25)}}
@keyframes thinkPulse{0%,100%{transform:translate(-50%,-50%) scale(.96)}50%{transform:translate(-50%,-50%) scale(1.2);filter:brightness(1.3)}}
@keyframes speakPulse{50%{transform:translate(-50%,-50%) scale(1.11);filter:brightness(1.22)}}
@media(prefers-reduced-motion:reduce){.scene .bg,.scene .aura{animation:none!important;transition:none!important}}

/* NANDI_SCENE_V5 — self-contained vector Nandi-before-Shiva scene; no borrowed photo, no external image dependency.

   NANDI_SCENE_V2 — natural devotional composition.
   Keep Nandi grounded before Shiva; animate light, not the whole sacred scene. */
.scene::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.72;
  background:
    radial-gradient(ellipse at 50% 24%,rgba(215,181,109,.075) 0 5%,rgba(215,181,109,.025) 19%,transparent 38%),
    linear-gradient(180deg,rgba(215,181,109,.03) 0%,rgba(142,239,255,.018) 44%,transparent 76%);
  mix-blend-mode:screen
}
.scene::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-8%;
  width:min(70vw,920px);
  height:38%;
  transform:translateX(-50%);
  pointer-events:none;
  opacity:.42;
  background:radial-gradient(ellipse at center,rgba(142,239,255,.075) 0%,rgba(215,181,109,.03) 38%,transparent 72%);
  filter:blur(20px);
  mix-blend-mode:screen
}
.veil{
  background:
    radial-gradient(ellipse at 50% 70%,transparent 0 24%,rgba(2,6,10,.11) 48%,rgba(2,6,10,.48) 100%),
    linear-gradient(180deg,rgba(2,5,9,.20),transparent 34%,rgba(2,5,9,.38))
}
.aura{
  left:50%;
  top:73%;
  width:clamp(220px,27vw,420px);
  height:clamp(165px,20vw,300px);
  transform:translate(-50%,-50%);
  border-radius:48% 52% 46% 54%/58% 58% 42% 42%;
  opacity:.13;
  background:radial-gradient(ellipse at 50% 48%,rgba(142,239,255,.12) 0 16%,rgba(142,239,255,.055) 38%,transparent 72%);
  box-shadow:none;
  filter:blur(16px);
  mix-blend-mode:screen;
  transition:opacity .45s ease,filter .45s ease,background .45s ease
}
.aura::before{
  content:"";
  position:absolute;
  inset:5% 19% 18%;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,rgba(238,247,255,.11),rgba(142,239,255,.05) 42%,transparent 74%);
  filter:blur(12px);
  opacity:.72
}
.aura::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:2%;
  width:76%;
  height:24%;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(142,239,255,.12),rgba(215,181,109,.035) 45%,transparent 75%);
  filter:blur(10px);
  opacity:.8
}
.scene.awake .aura{
  opacity:.34;
  animation:nandiAuraIdle 5.8s ease-in-out infinite
}
.scene.listening .aura{
  opacity:.48;
  background:radial-gradient(ellipse at 50% 48%,rgba(142,239,255,.16) 0 15%,rgba(142,239,255,.065) 40%,transparent 74%);
  box-shadow:none;
  animation:nandiAuraListen 2.8s ease-in-out infinite
}
.scene.thinking .aura{
  opacity:.5;
  background:radial-gradient(ellipse at 50% 48%,rgba(215,181,109,.16) 0 14%,rgba(215,181,109,.06) 40%,transparent 74%);
  box-shadow:none;
  animation:nandiAuraThink 2.35s ease-in-out infinite
}
.scene.thinking .aura::before{
  background:radial-gradient(ellipse at 50% 42%,rgba(255,238,190,.12),rgba(215,181,109,.05) 44%,transparent 74%)
}
.scene.speaking .aura{
  opacity:.45;
  background:radial-gradient(ellipse at 50% 48%,rgba(131,244,189,.14) 0 15%,rgba(131,244,189,.055) 40%,transparent 74%);
  box-shadow:none;
  animation:nandiAuraSpeak 2s ease-in-out infinite
}
.scene.awake .bg{
  animation:none;
  transform:scale(1.025);
  transform-origin:50% 82%
}
.scene.ack .bg{animation:nandiNodV2 1.02s cubic-bezier(.2,.8,.25,1)}
.scene.thinking .bg{filter:saturate(1.02) brightness(.88);transform:scale(1.025)}
.scene.speaking .bg{filter:saturate(1.02) brightness(.94);transform:scale(1.025)}
.top{opacity:.78;transition:opacity .3s ease}
.scene.awake .top{opacity:.96}
.status{
  padding:9px 14px;
  border-color:rgba(255,255,255,.075);
  background:rgba(4,8,13,.34);
  backdrop-filter:blur(12px);
  box-shadow:0 10px 35px rgba(0,0,0,.12)
}
.answer{
  border-color:rgba(255,255,255,.075);
  background:linear-gradient(180deg,rgba(4,8,13,.58),rgba(4,8,13,.7));
  backdrop-filter:blur(18px);
  box-shadow:0 18px 60px rgba(0,0,0,.22)
}
@keyframes nandiAuraIdle{
  0%,100%{transform:translate(-50%,-50%) scale(.99);filter:blur(16px)}
  50%{transform:translate(-50%,-50%) scale(1.025);filter:blur(17px)}
}
@keyframes nandiAuraListen{
  0%,100%{transform:translate(-50%,-50%) scale(.99);filter:blur(15px)}
  50%{transform:translate(-50%,-50%) scale(1.045);filter:blur(17px)}
}
@keyframes nandiAuraThink{
  0%,100%{transform:translate(-50%,-50%) scale(.985);filter:blur(16px)}
  50%{transform:translate(-50%,-50%) scale(1.035);filter:blur(18px)}
}
@keyframes nandiAuraSpeak{
  0%,100%{transform:translate(-50%,-50%) scale(.995);filter:blur(15px)}
  50%{transform:translate(-50%,-50%) scale(1.03);filter:blur(17px)}
}
@keyframes nandiNodV2{
  0%,100%{transform:scale(1.025) translateY(0)}
  42%{transform:scale(1.027) translateY(1px)}
  68%{transform:scale(1.026) translateY(-1px)}
}
@media(max-width:720px){
  .aura{top:72%;width:clamp(210px,62vw,340px);height:clamp(160px,45vw,250px)}
  .scene::after{width:92vw;height:34%}
  .answer{background:rgba(4,8,13,.68);max-height:38vh}
}
@media(prefers-reduced-motion:reduce){
  .scene .bg,.scene .aura{animation:none!important;transition:none!important}
}


/* NANDI_SCENE_V6 — cinematic Nandi before Shiva. Raster is purpose-built for this UI and decoded locally at deploy. */
.bg{
  position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:center center;
  filter:saturate(.96) brightness(.74) contrast(1.05);transform:scale(1.02);
  transition:filter .65s ease,transform 1.2s ease;user-select:none;pointer-events:none
}
.scene::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse at 61% 34%,rgba(255,201,111,.16) 0 8%,rgba(255,169,72,.055) 25%,transparent 48%),
    linear-gradient(180deg,rgba(2,4,6,.08),transparent 38%,rgba(2,4,6,.35) 100%);
  mix-blend-mode:screen
}
.scene::after{
  content:"";position:absolute;left:30%;top:69%;width:min(44vw,620px);height:min(46vh,420px);
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 55%,rgba(232,198,126,.11) 0 24%,rgba(114,214,226,.045) 42%,transparent 70%);
  filter:blur(22px);opacity:.34;mix-blend-mode:screen;transition:opacity .5s ease,filter .5s ease
}
.veil{
  z-index:3;background:
    radial-gradient(ellipse at 49% 49%,transparent 0 36%,rgba(2,5,8,.06) 62%,rgba(2,5,8,.38) 100%),
    linear-gradient(180deg,rgba(2,5,8,.08),transparent 34%,rgba(2,5,8,.22))
}
.aura{
  z-index:4;left:30%;top:68%;width:clamp(280px,36vw,590px);height:clamp(210px,35vw,500px);
  transform:translate(-50%,-50%);border-radius:48% 52% 54% 46%/58% 54% 46% 42%;
  opacity:.18;box-shadow:none;filter:blur(17px);mix-blend-mode:screen;
  background:
    radial-gradient(ellipse at 48% 48%,rgba(255,225,164,.13) 0 15%,rgba(215,181,109,.075) 31%,rgba(131,223,232,.03) 48%,transparent 72%);
  transition:opacity .45s ease,filter .45s ease,background .45s ease
}
.aura::before{
  content:"";position:absolute;left:50%;bottom:8%;width:78%;height:25%;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(ellipse,rgba(255,202,104,.16),rgba(255,179,72,.045) 45%,transparent 74%);
  filter:blur(12px);opacity:.65
}
.aura::after{
  content:"";position:absolute;inset:14% 18% 12%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,rgba(255,241,203,.10),rgba(107,221,231,.025) 46%,transparent 72%);
  filter:blur(16px);opacity:.65
}
.scene.awake .bg{animation:none!important;filter:saturate(1.02) brightness(.87) contrast(1.06);transform:scale(1.018)}
.scene.ack .bg{animation:none!important}
.scene.awake::after{opacity:.52}
.scene.awake .aura{opacity:.42;animation:nandiAuraV6 5.2s ease-in-out infinite}
.scene.listening .aura{
  opacity:.58;
  background:radial-gradient(ellipse at 48% 48%,rgba(255,229,172,.16) 0 15%,rgba(215,181,109,.09) 31%,rgba(132,226,235,.055) 48%,transparent 72%);
  animation:nandiListenV6 2.4s ease-in-out infinite
}
.scene.thinking .aura{
  opacity:.62;
  background:radial-gradient(ellipse at 48% 48%,rgba(255,214,126,.18) 0 16%,rgba(230,164,68,.09) 34%,transparent 72%);
  animation:nandiThinkV6 2.1s ease-in-out infinite
}
.scene.speaking .aura{
  opacity:.56;
  background:radial-gradient(ellipse at 48% 48%,rgba(255,232,180,.17) 0 16%,rgba(215,181,109,.085) 34%,rgba(131,244,189,.035) 52%,transparent 72%);
  animation:nandiSpeakV6 1.8s ease-in-out infinite
}
.scene.ack .aura{animation:nandiAckV6 1.05s cubic-bezier(.2,.8,.25,1)}
.top{z-index:8;opacity:.84}.center{z-index:9}.answer{z-index:10}
.status{background:rgba(5,7,9,.34);border-color:rgba(255,220,160,.16);box-shadow:0 10px 32px rgba(0,0,0,.2)}
@keyframes nandiAuraV6{0%,100%{transform:translate(-50%,-50%) scale(.99);filter:blur(17px)}50%{transform:translate(-50%,-50%) scale(1.035);filter:blur(19px)}}
@keyframes nandiListenV6{0%,100%{transform:translate(-50%,-50%) scale(.98)}50%{transform:translate(-50%,-50%) scale(1.065)}}
@keyframes nandiThinkV6{0%,100%{transform:translate(-50%,-50%) scale(.99)}50%{transform:translate(-50%,-50%) scale(1.045)}}
@keyframes nandiSpeakV6{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}
@keyframes nandiAckV6{0%,100%{transform:translate(-50%,-50%) scale(1)}42%{transform:translate(-50%,-50%) scale(1.12)}70%{transform:translate(-50%,-50%) scale(1.03)}}
@media(max-width:720px){
  .bg{object-position:48% center}
  .scene::after{left:35%;top:70%;width:70vw;height:42vh}
  .aura{left:35%;top:70%;width:68vw;height:48vh}
}


/* NANDI_AGENT_V7 — Nandi is the reactive agent; Shiva remains the spatial anchor. */
.nandi-agent{
  position:absolute;inset:-2%;z-index:5;width:104%;height:104%;
  object-fit:cover;object-position:center center;pointer-events:none;user-select:none;
  transform:scale(1.02);transform-origin:29% 72%;opacity:.26;
  filter:saturate(1.06) brightness(1.04) contrast(1.06) drop-shadow(0 0 12px rgba(139,229,238,.10));
  -webkit-mask-image:
    radial-gradient(ellipse 31% 34% at 22% 83%,#000 0 56%,transparent 76%),
    radial-gradient(ellipse 18% 30% at 31% 52%,#000 0 47%,transparent 73%);
  -webkit-mask-repeat:no-repeat;
  mask-image:
    radial-gradient(ellipse 31% 34% at 22% 83%,#000 0 56%,transparent 76%),
    radial-gradient(ellipse 18% 30% at 31% 52%,#000 0 47%,transparent 73%);
  mask-repeat:no-repeat;
  transition:opacity .45s ease,filter .45s ease
}
.scene.awake .nandi-agent{animation:nandiAgentIdleV7 4.8s ease-in-out infinite}
.scene.listening .nandi-agent{animation:nandiAgentListenV7 2.2s ease-in-out infinite}
.scene.thinking .nandi-agent{animation:nandiAgentThinkV7 2.15s ease-in-out infinite}
.scene.speaking .nandi-agent{animation:nandiAgentSpeakV7 1.55s ease-in-out infinite}
.scene.ack .nandi-agent{animation:nandiAgentAckV7 .9s cubic-bezier(.2,.8,.25,1)}
.aura{
  left:29%;top:63%;width:min(48vw,690px);height:min(60vh,540px);
  opacity:.20;filter:blur(26px);
  background:radial-gradient(ellipse at 54% 48%,
    rgba(145,231,241,.16) 0 11%,
    rgba(255,219,152,.12) 24%,
    rgba(231,161,65,.045) 43%,
    transparent 70%);
  mix-blend-mode:screen
}
.aura::before{
  left:50%;bottom:1%;width:86%;height:27%;transform:translateX(-50%);
  background:radial-gradient(ellipse,
    rgba(248,195,100,.23) 0,
    rgba(117,220,232,.075) 38%,
    transparent 73%);
  filter:blur(14px);opacity:.72
}
.aura::after{
  inset:18% 23% 21%;
  background:radial-gradient(ellipse at 52% 42%,
    rgba(248,242,215,.13),
    rgba(121,227,238,.055) 40%,
    transparent 72%);
  filter:blur(18px);opacity:.72
}
.scene.awake .aura{opacity:.48;animation:nandiPresenceV7 4.6s ease-in-out infinite}
.scene.listening .aura{opacity:.72;animation:nandiListenAuraV7 2.1s ease-in-out infinite}
.scene.thinking .aura{
  opacity:.67;
  background:radial-gradient(ellipse at 54% 48%,
    rgba(255,215,132,.20) 0 12%,rgba(231,164,70,.11) 29%,rgba(139,229,238,.025) 48%,transparent 72%);
  animation:nandiThinkAuraV7 2s ease-in-out infinite
}
.scene.speaking .aura{
  opacity:.64;
  background:radial-gradient(ellipse at 54% 48%,
    rgba(255,228,171,.19) 0 12%,rgba(215,181,109,.10) 30%,rgba(131,244,189,.055) 50%,transparent 72%);
  animation:nandiSpeakAuraV7 1.45s ease-in-out infinite
}
.center{
  z-index:12;bottom:20px;width:min(760px,78vw);max-width:none;gap:8px
}
.heard{font-size:12px;min-height:18px;opacity:.92}
.status{
  position:relative;padding:8px 13px 8px 34px;
  border-color:rgba(255,219,155,.16);
  background:rgba(4,7,10,.42);backdrop-filter:blur(16px)
}
.status::before{
  content:"▮ ▮▮ ▮";position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:#97edf6;font-size:7px;letter-spacing:1px;opacity:.8;
  animation:nandiWaveV7 1s ease-in-out infinite
}
.composer{
  width:100%;display:flex;align-items:center;gap:8px;padding:9px;
  border:1px solid rgba(255,219,155,.18);
  background:rgba(4,7,10,.56);backdrop-filter:blur(22px);
  border-radius:999px;box-shadow:0 20px 72px rgba(0,0,0,.34),0 0 28px rgba(215,181,109,.045)
}
.composer input{
  min-width:0;flex:1;border:0;outline:0;background:transparent;color:#edf3f7;
  font:inherit;font-size:14px;padding:0 6px
}
.composer input::placeholder{color:#aab5bd}
.composer button{
  flex:0 0 42px;width:42px;height:42px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.08);font-size:17px
}
.talk{background:rgba(255,255,255,.065);color:#edf6fa}
.send{
  background:linear-gradient(145deg,#e3bd70,#9b6228);color:#130d07;
  border-color:rgba(255,226,171,.28)!important;box-shadow:0 0 24px rgba(215,181,109,.16)
}
.composer button:disabled,.composer input:disabled{opacity:.48;cursor:not-allowed}
.answer{
  right:24px;bottom:104px;width:min(450px,36vw);max-height:40vh;
  background:linear-gradient(180deg,rgba(8,7,7,.56),rgba(10,7,6,.70));
  border-color:rgba(255,219,155,.14)
}
@keyframes nandiAgentIdleV7{
  0%,100%{transform:scale(1.02);opacity:.27;filter:saturate(1.05) brightness(1.04) contrast(1.06) drop-shadow(0 0 10px rgba(139,229,238,.08))}
  50%{transform:scale(1.022);opacity:.36;filter:saturate(1.08) brightness(1.075) contrast(1.07) drop-shadow(0 0 18px rgba(139,229,238,.16))}
}
@keyframes nandiAgentListenV7{
  0%,100%{transform:scale(1.02);opacity:.32;filter:saturate(1.07) brightness(1.05) contrast(1.07) drop-shadow(0 0 13px rgba(139,229,238,.13))}
  50%{transform:scale(1.024);opacity:.47;filter:saturate(1.10) brightness(1.11) contrast(1.08) drop-shadow(0 0 26px rgba(139,229,238,.25))}
}
@keyframes nandiAgentThinkV7{
  0%,100%{transform:scale(1.02);opacity:.34;filter:saturate(1.07) brightness(1.05) contrast(1.07) drop-shadow(0 0 12px rgba(231,170,82,.12))}

<body>
<div id="scene" class="scene">
<img id="sceneArt" class="bg" src="/assets/nandi-shiva-cinematic.jpg" alt="" aria-hidden="true" loading="eager" fetchpriority="high" decoding="async"><div class="nandi-bg-patch"></div><div class="aura"></div><canvas id="nandi3d" class="nandi3d" aria-hidden="true"></canvas><div class="veil"></div>
<div class="top"><span class="dot"></span><div><span class="name">NANDI</span><span id="mode" class="mode">IDLE · SAY “HI NANDI”</span></div></div>
<div id="answer" class="answer"><b>NANDI</b><span id="answerText"></span></div>
<div class="center"><div id="heard" class="heard"></div><button id="enable" class="enable" type="button">Enable microphone</button><div id="status" class="status">Preparing default microphone…</div><form id="askForm" class="composer" autocomplete="off"><button id="talk" class="talk" type="button" aria-label="Talk to Nandi">●</button><input id="prompt" type="text" inputmode="text" placeholder="Ask Nandi anything…" aria-label="Ask Nandi anything"><button id="send" class="send" type="submit" aria-label="Send to Nandi">➤</button></form></div>
</div>
<script>
(function(){
const scene=document.getElementById('scene'),status=document.getElementById('status'),heard=document.getElementById('heard'),mode=document.getElementById('mode'),enable=document.getElementById('enable'),answer=document.getElementById('answer'),answerText=document.getElementById('answerText'),askForm=document.getElementById('askForm'),promptInput=document.getElementById('prompt'),talk=document.getElementById('talk'),send=document.getElementById('send');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,awake=false,busy=false,restart=null,history=[];
function setState(s){scene.classList.remove('listening','thinking','speaking');if(s)scene.classList.add(s);window.dispatchEvent(new CustomEvent('nandi-state',{detail:s||'idle'}))}
function setStatus(t){status.textContent=t;if(/Working|Understanding|Thinking|Using|Verifying/.test(t)){setState('thinking');if(awake)mode.textContent='ACTIVE · THINKING'}else if(/Listening/.test(t)){setState('listening');if(awake)mode.textContent='ACTIVE · LISTENING'}}
function say(t){if(!('speechSynthesis' in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.98;u.pitch=.92;u.volume=.92;u.onstart=function(){setState('speaking');if(awake)mode.textContent='ACTIVE · SPEAKING'};u.onend=function(){if(awake&&!busy){setState('listening');mode.textContent='ACTIVE · LISTENING'}};speechSynthesis.speak(u)}
function wake(){setState('listening');scene.classList.remove('ack');void scene.offsetWidth;scene.classList.add('ack','awake');window.dispatchEvent(new Event('nandi-ack'));awake=true;mode.textContent='ACTIVE · LISTENING';setStatus('Listening…');say("I'm listening.")}
function sleep(){setState('');awake=false;scene.classList.remove('awake');mode.textContent='IDLE · SAY “HI NANDI”';setStatus('Waiting for “Hi Nandi”…');answer.classList.remove('show');say('Going quiet.')}
async function ask(q){if(busy)return;if(!awake){awake=true;scene.classList.add('awake');mode.textContent='ACTIVE · THINKING'}busy=true;promptInput.disabled=true;send.disabled=true;setStatus('Working…');heard.textContent='“'+q+'”';answer.classList.remove('show');try{const c=new AbortController();const timer=setTimeout(function(){c.abort()},55000);const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(-6)}),signal:c.signal});clearTimeout(timer);if(!r.ok)throw new Error('Relay returned '+r.status);if(!r.body)throw new Error('Streaming unavailable');const rd=r.body.getReader(),dec=new TextDecoder();let buf='',final='';while(true){const p=await rd.read();buf+=dec.decode(p.value||new Uint8Array(),{stream:!p.done});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(!line.trim())continue;const e=JSON.parse(line);if(e.type==='planner')setStatus('Understanding…');if(e.type==='worker'||e.type==='worker_selected')setStatus('Thinking…');if(e.type==='tool')setStatus('Using '+String(e.tool||'tool')+'…');if(e.type==='reviewer')setStatus('Verifying…');if(e.type==='done')final=String(e.answer||'').trim();if(e.type==='error')throw new Error(e.message||'Relay error')}if(p.done)break}if(buf.trim()){const e=JSON.parse(buf);if(e.type==='done')final=String(e.answer||'').trim()}if(!final)final='I finished, but no answer text came back.';answerText.textContent=final;answer.classList.add('show');history.push({role:'user',content:q},{role:'assistant',content:final});history=history.slice(-8);setStatus('Listening…');say(final)}catch(e){const m=e&&e.name==='AbortError'?'That took too long. I stopped the request.':'I hit a problem: '+(e.message||String(e));answerText.textContent=m;answer.classList.add('show');setStatus('Listening…');say(m)}finally{busy=false;promptInput.disabled=false;send.disabled=false}}
function handle(t){t=String(t||'').trim();if(!t)return;heard.textContent='“'+t+'”';const l=t.toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();if(!awake){if(/(^|\s)(hi|hey)\s+nandi(\s|$)/.test(l)||l==='nandi')wake();else setStatus('Waiting for “Hi Nandi”…');return}if(/\b(go to sleep|sleep nandi|nandi sleep)\b/.test(l)){sleep();return}if(/\b(stop talking|stop speaking)\b/.test(l)){if('speechSynthesis' in window)speechSynthesis.cancel();return}ask(t)}
function build(){if(!SR){mode.textContent='BROWSER VOICE UNSUPPORTED';setStatus('Voice recognition is not available in this browser.');return false}rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-IN';rec.onstart=function(){enable.classList.remove('show');setStatus(awake?'Listening…':'Waiting for “Hi Nandi”…')};rec.onresult=function(ev){let inter='';for(let i=ev.resultIndex;i<ev.results.length;i++){const tx=ev.results[i][0].transcript;if(ev.results[i].isFinal)handle(tx);else inter+=tx}if(inter&&!busy)heard.textContent=inter};rec.onerror=function(ev){if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){enable.classList.add('show');setStatus('Microphone permission needed once.')}else if(ev.error!=='no-speech'&&ev.error!=='aborted')setStatus('Mic issue: '+ev.error)};rec.onend=function(){clearTimeout(restart);restart=setTimeout(function(){try{rec.start()}catch(_){}},650)};return true}
async function start(){try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(function(t){t.stop()})}if(!rec&&!build())return;try{rec.start()}catch(_){}}catch(e){enable.classList.add('show');setStatus('Allow microphone access to start Nandi.')}}
enable.addEventListener('click',start);talk.addEventListener('click',function(){if(!rec){start();return}if(!awake)wake();else setStatus('Listening…')});askForm.addEventListener('submit',function(ev){ev.preventDefault();const q=promptInput.value.trim();if(!q||busy)return;promptInput.value='';ask(q)});window.addEventListener('load',function(){setTimeout(start,500)})
})();
</script>


<script>
setTimeout(function(){
  if(document.documentElement.dataset.nandi3d!=='ready'){
    document.documentElement.dataset.nandi3d='failed';
    const mode=document.getElementById('mode'),status=document.getElementById('status');
    if(mode)mode.textContent='3D LAYER FAILED';
    if(status)status.textContent='Nandi 3D renderer did not start.';
  }

<script type="module">
// NANDI_TRUE3D_SPIKE_V1
import * as THREE from '/assets/vendor/three.module.js';

const canvas=document.getElementById('nandi3d');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,premultipliedAlpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const world=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(31,1,.1,100);
camera.position.set(0,1.5,8.2);
camera.lookAt(-.55,.25,0);

world.add(new THREE.HemisphereLight(0xffe6b8,0x09121a,1.45));
const key=new THREE.DirectionalLight(0xffbd69,3.0);
key.position.set(3.5,6,4.5);key.castShadow=true;world.add(key);
const rim=new THREE.PointLight(0x7de8f4,0.9,8,2);
rim.position.set(-2.2,1.7,2.4);world.add(rim);
const shrine=new THREE.PointLight(0xffa441,1.4,10,2);
shrine.position.set(1.8,2.8,-3.4);world.add(shrine);

const stone=new THREE.MeshStandardMaterial({color:0xb9b2a4,roughness:.62,metalness:.04});
const stoneDark=new THREE.MeshStandardMaterial({color:0x302a28,roughness:.5,metalness:.08});
const gold=new THREE.MeshStandardMaterial({color:0xc8943f,roughness:.28,metalness:.72,emissive:0x2d1604,emissiveIntensity:.22});
const accent=new THREE.MeshStandardMaterial({color:0xd4aa5f,roughness:.34,metalness:.58,emissive:0x3b1d05,emissiveIntensity:.18});

function mesh(geo,mat,pos=[0,0,0],scale=[1,1,1],rot=[0,0,0]){
  const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.scale.set(...scale);m.rotation.set(...rot);
  m.castShadow=true;m.receiveShadow=true;return m;
}
const nandi=new THREE.Group();
const bodyRoot=new THREE.Group();
nandi.add(bodyRoot);

bodyRoot.add(mesh(new THREE.SphereGeometry(1,40,28),stone,[0,.02,.18],[1.12,.76,1.46]));
bodyRoot.add(mesh(new THREE.SphereGeometry(.74,36,24),stone,[0,.58,-.62],[.88,.82,.86]));
bodyRoot.add(mesh(new THREE.SphereGeometry(.62,32,22),stone,[0,.42,.82],[1.03,.82,.92]));

const headPivot=new THREE.Group();
headPivot.position.set(0,.62,-1.27);
bodyRoot.add(headPivot);
headPivot.add(mesh(new THREE.SphereGeometry(.54,32,24),stone,[0,0,-.20],[.78,.72,1.00]));
headPivot.add(mesh(new THREE.SphereGeometry(.34,28,20),stone,[0,-.17,-.68],[.86,.60,.76]));

function horn(side){
  const h=mesh(new THREE.ConeGeometry(.12,.76,20),stoneDark,[side*.43,.33,-.42],[1,1,1],[.18,0,side*.72]);
  headPivot.add(h);
}
horn(-1);horn(1);
headPivot.add(mesh(new THREE.SphereGeometry(.22,20,14),stoneDark,[-.48,.04,-.34],[1.05,.24,.52],[0,0,-.28]));
headPivot.add(mesh(new THREE.SphereGeometry(.22,20,14),stoneDark,[ .48,.04,-.34],[1.05,.24,.52],[0,0, .28]));

const foreL=mesh(new THREE.CylinderGeometry(.16,.20,.82,20),stone,[-.54,-.47,-.82],[1,1,1],[1.08,0,.18]);
const foreR=mesh(new THREE.CylinderGeometry(.16,.20,.82,20),stone,[ .54,-.47,-.82],[1,1,1],[1.08,0,-.18]);
bodyRoot.add(foreL,foreR);
bodyRoot.add(mesh(new THREE.SphereGeometry(.32,24,18),stone,[-.76,-.47,.57],[1.25,.62,1.15],[0,.18,0]));
bodyRoot.add(mesh(new THREE.SphereGeometry(.32,24,18),stone,[ .76,-.47,.57],[1.25,.62,1.15],[0,-.18,0]));

const neckBand=mesh(new THREE.TorusGeometry(.60,.055,12,48),gold,[0,.48,-1.12],[1,1,.78],[Math.PI/2,0,0]);
bodyRoot.add(neckBand);
const backBand=mesh(new THREE.TorusGeometry(1.00,.055,12,64),gold,[0,.18,.14],[1.0,1.0,1.36],[Math.PI/2,0,0]);
bodyRoot.add(backBand);
bodyRoot.add(mesh(new THREE.SphereGeometry(.11,18,12),gold,[0,.12,-1.71],[1,1.25,1]));

const tailCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,.20,1.52),new THREE.Vector3(.16,-.05,1.85),
  new THREE.Vector3(.32,-.45,1.85),new THREE.Vector3(.42,-.72,1.62)
]);
const tail=mesh(new THREE.TubeGeometry(tailCurve,22,.045,10,false),stoneDark);
bodyRoot.add(tail);

const shadowMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.30,depthWrite:false});
const shadow=mesh(new THREE.CircleGeometry(1.25,64),shadowMat,[0,-.78,.40],[1.35,.72,1],[ -Math.PI/2,0,0]);
nandi.add(shadow);

world.add(nandi);
let base={x:-2.18,y:-.18,z:.35,s:1.02};
nandi.position.set(base.x,base.y,base.z);
nandi.scale.setScalar(base.s);
nandi.rotation.y=.03;

let state='idle',ackAt=-999,pointerX=0,pointerY=0,visibleReported=false,visibleProbeFrames=0;
window.addEventListener('nandi-state',e=>{state=e.detail||'idle'});
window.addEventListener('nandi-ack',()=>{ackAt=performance.now()});
window.addEventListener('pointermove',e=>{
  pointerX=(e.clientX/window.innerWidth-.5);
  pointerY=(e.clientY/window.innerHeight-.5);
},{passive:true});

function layout(){
  renderer.setSize(window.innerWidth,window.innerHeight,false);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  if(window.innerWidth<720){base={x:-1.15,y:-.44,z:.15,s:.78}}
  else if(window.innerWidth<1100){base={x:-1.75,y:-.28,z:.25,s:.91}}
  else{base={x:-2.18,y:-.18,z:.35,s:1.02}}
}
window.addEventListener('resize',layout);layout();

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const breathe=Math.sin(t*1.35);
  let headX=.02,headY=0,bodyY=0,bodyRoll=0,light=.72,scalePulse=0;

  if(state==='listening'){
    headY=Math.sin(t*1.55)*.065;headX=.025+Math.sin(t*1.15)*.018;
    bodyY=Math.sin(t*1.35)*.012;light=1.65;scalePulse=.004;
  }else if(state==='thinking'){
    headX=.095+Math.sin(t*.72)*.018;headY=Math.sin(t*.55)*.022;
    bodyY=Math.sin(t*.8)*.006;light=1.12;bodyRoll=Math.sin(t*.5)*.006;
  }else if(state==='speaking'){
    headX=.03+Math.sin(t*3.1)*.035;headY=Math.sin(t*1.1)*.018;
    bodyY=Math.sin(t*1.8)*.009;light=1.35;scalePulse=.003;
  }else{
    headX=.025+breathe*.010;bodyY=breathe*.006;light=.72;
  }

  const ackAge=(performance.now()-ackAt)/1000;
  if(ackAge>=0&&ackAge<.85){
    const p=Math.sin(Math.min(1,ackAge/.85)*Math.PI);
    headX+=p*.14;bodyY-=p*.012;light+=p*.8;
  }

  headPivot.rotation.x+=(headX-headPivot.rotation.x)*.10;
  headPivot.rotation.y+=(headY-headPivot.rotation.y)*.10;
  bodyRoot.rotation.z+=(bodyRoll-bodyRoot.rotation.z)*.08;
  nandi.position.x+=(base.x-nandi.position.x)*.08;
  nandi.position.y+=(base.y+bodyY-nandi.position.y)*.10;
  nandi.position.z+=(base.z-nandi.position.z)*.08;
  const targetScale=base.s*(1+scalePulse*(.5+.5*breathe));
  nandi.scale.x+=(targetScale-nandi.scale.x)*.08;
  nandi.scale.y+=(targetScale-nandi.scale.y)*.08;
  nandi.scale.z+=(targetScale-nandi.scale.z)*.08;

  rim.intensity+=(light-rim.intensity)*.08;
  rim.color.set(state==='thinking'?0xf0ae55:state==='speaking'?0x8ff0bd:0x7de8f4);
  gold.emissiveIntensity=.18+light*.055;
  accent.emissiveIntensity=.15+light*.04;

  const px=window.innerWidth<720?0:pointerX*.10,py=window.innerWidth<720?0:pointerY*.045;
  camera.position.x+=(px-camera.position.x)*.025;
  camera.position.y+=(1.5-py-camera.position.y)*.025;
  camera.lookAt(-.55,.25,0);

  renderer.render(world,camera);
  if(!visibleReported && visibleProbeFrames++<180){
    const gl=renderer.getContext(),w=gl.drawingBufferWidth,h=gl.drawingBufferHeight,p=new Uint8Array(4);
    let hit=false;
    for(let xi=1;xi<=9&&!hit;xi++){
      for(let yi=1;yi<=9&&!hit;yi++){
        const x=Math.floor(w*(.03+xi*.055)),y=Math.floor(h*(.08+yi*.075));
        gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
        if(p[3]>16) hit=true;
      }
    }
    if(hit){
      visibleReported=true;
      document.documentElement.dataset.nandi3dVisible='yes';
    }else if(visibleProbeFrames>=180){
      document.documentElement.dataset.nandi3dVisible='no';
    }
  }
}
animate();
document.documentElement.dataset.nandi3d='ready';
</script>
