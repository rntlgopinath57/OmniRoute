<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a"><title>AI Team</title><link rel="stylesheet" href="./app.css"><script src="https://js.puter.com/v2/"></script>
</head>
<body>
<main class="shell"><header><b><i>✦</i> AI TEAM</b><div class="state"><span></span><em id="stateText">READY</em></div></header>
<section id="workspace"><div id="canvas"><svg id="edges" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="stars"></div><div id="nodes"></div><div class="ask"><div><textarea id="q" rows="1" placeholder="Ask your AI Team anything…"></textarea><button id="go">➜</button></div><small>2 specialists → independent reviewer → one validated answer</small></div></div>
<aside id="answer"><div class="aHead"><span id="tick">✓</span><div><b>AI Team response</b><small id="meta">waiting</small></div><em id="badge">VALIDATED</em></div><div id="body">Your reviewed answer will appear here.</div><div id="agents"></div></aside></section></main>
<script src="./app.js"></script>
</body></html>
