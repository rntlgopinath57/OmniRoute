<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>OmniRoute AI Team</title>
<link rel="stylesheet" href="./app.css?v=11">
</head>
<body>
<main class="shell">
  <header>
    <div class="brand"><span class="brandMark"><i></i><i></i><i></i></span><div><b>OMNIROUTE</b><small>AI TEAM</small></div></div>
    <div class="headRight">
      <div class="liveChip"><span></span> LIVE ROUTING</div>
      <div class="state"><span></span><em id="stateText">READY</em></div>
    </div>
  </header>

  <section id="workspace">
    <div id="canvas">
      <div class="ambient a1"></div><div class="ambient a2"></div><div class="ambient a3"></div>
      <div class="neuralField" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="scanBeam" aria-hidden="true"></div>
      <div id="burstLayer" aria-hidden="true"></div>
      <svg id="edges" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div id="nodes"></div>

      <div class="ask">
        <div class="inputShell">
          <button id="mic" class="mic" aria-label="Voice input"><span class="micIcon">●</span><span class="wave"><i></i><i></i><i></i></span></button>
          <textarea id="q" rows="1" placeholder="Ask your AI Team anything…"></textarea>
          <button id="go" class="send" aria-label="Send">➜</button>
        </div>
        <div class="askMeta"><span id="listenText">Type or speak</span><span>Planner → specialist → independent reviewer</span></div>
      </div>
    </div>

    <aside id="answer">
      <div class="aHead">
        <span id="tick">◉</span>
        <div><b>AI Team conversation</b><small id="meta">READY</small></div>
        <span id="badge" class="badge">LIVE</span>
      </div>
      <div id="thread" class="thread" aria-live="polite">
        <div class="threadWelcome">
          <b>Start a conversation with your AI Team</b>
          <span>Your prompt and every reviewed answer will stay here as one continuous conversation.</span>
        </div>
      </div>
      <div class="followup">
        <button id="followMic" class="followMic" aria-label="Voice follow-up"><span class="micIcon">●</span><span class="wave"><i></i><i></i><i></i></span></button>
        <textarea id="followQ" rows="1" placeholder="Continue the conversation…"></textarea>
        <button id="followGo" class="followSend" aria-label="Send follow-up">➜</button>
      </div>
    </aside>
  </section>
</main>
<script src="./app.js?v=8"></script>
</body>
</html>
