<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<title>AI Team</title>
<style>
:root{color-scheme:dark;--bg:#05070a;--panel:rgba(9,13,19,.88);--text:#f4f8fc;--muted:#6f7c8e;--cyan:#76ebff;--violet:#a18bff;--green:#55f3b4;--amber:#ffc76a;--red:#ff758a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}button,textarea{font:inherit}.shell{min-height:100vh;background:radial-gradient(circle at 50% 6%,rgba(74,101,160,.13),transparent 31%),linear-gradient(180deg,#080b10,#040609 72%)}
.topbar{height:62px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.055);backdrop-filter:blur(22px);position:relative;z-index:20}.brand{font-size:13px;letter-spacing:.17em;font-weight:800}.brandMark{color:var(--cyan);margin-right:7px;text-shadow:0 0 16px rgba(118,235,255,.9)}.topRight{display:flex;align-items:center;gap:10px}.mode{font-size:9px;color:#758297;border:1px solid rgba(255,255,255,.07);padding:6px 9px;border-radius:999px}.statusPill{display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:999px;padding:7px 11px;font-size:9px;letter-spacing:.12em;color:#9aa7b5}.statusDot{width:6px;height:6px;border-radius:50%;background:#5d6976}.statusPill.busy .statusDot{background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1s infinite}.statusPill.done .statusDot{background:var(--green);box-shadow:0 0 12px var(--green)}.statusPill.error .statusDot{background:var(--red);box-shadow:0 0 12px var(--red)}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 0;min-height:calc(100vh - 62px);transition:grid-template-columns .5s cubic-bezier(.22,.8,.2,1)}.workspace.answer-open{grid-template-columns:minmax(0,1fr) min(420px,35vw)}.canvas{position:relative;min-height:calc(100vh - 62px);overflow:hidden}.canvas:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.15) .7px,transparent .7px);background-size:22px 22px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.28),transparent 86%);opacity:.18}.ambient{position:absolute;width:430px;height:430px;border-radius:50%;filter:blur(100px);opacity:.08;pointer-events:none}.ambient.a{background:var(--violet);left:2%;top:3%}.ambient.b{background:var(--cyan);right:3%;top:28%}
.network{position:absolute;inset:1.5% 3% 22%;width:94%;height:77%;overflow:visible}.edge{fill:none;stroke:rgba(126,153,186,.13);stroke-width:.15;vector-effect:non-scaling-stroke;transition:.28s}.edge.active{stroke:rgba(118,235,255,.78);stroke-width:.32;filter:drop-shadow(0 0 5px rgba(118,235,255,.55));stroke-dasharray:1.2 1.3;animation:dash .55s linear infinite}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;z-index:3;transition:opacity .25s,filter .25s}.nodeCore{width:51px;height:51px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.22),rgba(97,117,151,.09) 27%,rgba(12,17,26,.94) 68%);border:1px solid rgba(174,206,237,.20);box-shadow:inset 0 0 24px rgba(111,146,190,.08),0 6px 28px rgba(0,0,0,.45);position:relative;overflow:hidden;transition:.28s}.nodeCore span{position:relative;z-index:2;font-size:15px;color:#aebaca}.orb{position:absolute;inset:-45%;background:conic-gradient(from 10deg,transparent,rgba(118,235,255,.15),transparent 28%,rgba(161,139,255,.13),transparent 64%);animation:spin 9s linear infinite}.halo{position:absolute;top:25px;width:68px;height:68px;border-radius:50%;border:1px solid transparent;transform:translateY(-50%);pointer-events:none}.node strong{font-size:8px;letter-spacing:.11em;color:#c7d1de;text-align:center}.node small{font-size:7px;color:#536071;max-width:92px;text-align:center}.node.active .nodeCore{transform:scale(1.12);border-color:rgba(118,235,255,.75);box-shadow:0 0 15px rgba(118,235,255,.22),0 0 50px rgba(118,235,255,.13),inset 0 0 30px rgba(118,235,255,.10);animation:impact .45s ease-out,nodeBreath 1.25s ease-in-out .45s infinite}.node.active .nodeCore span{color:var(--cyan);text-shadow:0 0 14px var(--cyan)}.node.active .halo{border-color:rgba(118,235,255,.25);animation:ring 1.25s ease-out infinite}.node.selected .nodeCore{border-color:rgba(161,139,255,.50);box-shadow:0 0 32px rgba(161,139,255,.12)}.node.dim{opacity:.18;filter:saturate(.2)}.node.you .nodeCore{width:62px;height:62px}.node.you .halo{top:31px}.node.you.answered .nodeCore{border-color:rgba(85,243,180,.95);box-shadow:0 0 20px rgba(85,243,180,.42),0 0 80px rgba(85,243,180,.22);animation:answerGlow 1.35s ease-out 2}.node.you.answered .nodeCore span{color:var(--green);text-shadow:0 0 17px var(--green)}.node.you.answered .halo{border-color:rgba(85,243,180,.56);animation:doneRing 1.1s ease-out 2}.node.reviewer .nodeCore{width:56px;height:56px}.node.reviewer.pass .nodeCore{border-color:rgba(85,243,180,.65)}
.star{position:absolute;inset:0;z-index:6;pointer-events:none}.star span{position:absolute;left:var(--x1);top:var(--y1);width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 7px 2px #fff,0 0 18px 4px var(--cyan),-12px 3px 16px 1px rgba(118,235,255,.44);animation:flight .62s cubic-bezier(.3,.7,.25,1) forwards}.star span:after{content:"";position:absolute;width:34px;height:2px;right:3px;top:3px;background:linear-gradient(90deg,transparent,rgba(118,235,255,.78));transform:rotate(-10deg);filter:blur(.5px)}
.composerWrap{position:absolute;left:50%;bottom:2.9%;transform:translateX(-50%);width:min(700px,78%);z-index:10}.composer{display:flex;align-items:flex-end;gap:10px;padding:9px 9px 9px 17px;border:1px solid rgba(169,203,239,.14);background:rgba(9,13,20,.84);backdrop-filter:blur(24px);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.43),inset 0 1px 0 rgba(255,255,255,.035)}.composer:focus-within{border-color:rgba(118,235,255,.38);box-shadow:0 20px 60px rgba(0,0,0,.43),0 0 0 3px rgba(118,235,255,.04)}textarea{flex:1;min-height:43px;max-height:128px;resize:none;border:0;outline:0;background:transparent;color:#f4f8fc;padding:10px 0;line-height:1.35;font-size:14px}textarea::placeholder{color:#596676}.send{width:43px;height:43px;border-radius:13px;border:1px solid rgba(118,235,255,.28);background:linear-gradient(145deg,rgba(118,235,255,.17),rgba(161,139,255,.12));color:#eaffff;display:grid;place-items:center;cursor:pointer;transition:.22s}.send:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 30px rgba(118,235,255,.16)}.send:disabled{opacity:.3;cursor:not-allowed}.hint{text-align:center;color:#475366;font-size:8px;margin-top:8px;letter-spacing:.05em}
.answer{border-left:1px solid rgba(255,255,255,.07);background:rgba(7,10,15,.91);backdrop-filter:blur(25px);transform:translateX(100%);opacity:0;transition:transform .5s cubic-bezier(.22,.8,.2,1),opacity .35s;display:flex;flex-direction:column;overflow:hidden}.answer.open{transform:translateX(0);opacity:1}.answerHead{padding:22px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.answerHead>div{display:flex;gap:10px;align-items:center}.verdict{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:rgba(85,243,180,.1);color:var(--green);border:1px solid rgba(85,243,180,.25)}.verdict.bad{background:rgba(255,117,138,.09);border-color:rgba(255,117,138,.25);color:var(--red)}.answerHead strong{display:block;font-size:13px}.answerHead small{display:block;margin-top:4px;color:#687688;font-size:8px;letter-spacing:.08em;text-transform:uppercase}.badge{font-size:8px;letter-spacing:.1em;color:var(--green);border:1px solid rgba(85,243,180,.16);background:rgba(85,243,180,.05);padding:6px 8px;border-radius:999px}.answerBody{padding:24px;overflow:auto;line-height:1.62;color:#d6dee8;font-size:13px;white-space:pre-wrap}.empty{color:#536071}.errorText{color:#ff9cac}.agentsUsed{padding:12px 22px;border-top:1px solid rgba(255,255,255,.05);font-size:8px;color:#5c697a;line-height:1.6}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45;transform:scale(.72)}}@keyframes dash{to{stroke-dashoffset:-2.5}}@keyframes impact{0%{transform:scale(.86)}55%{transform:scale(1.22)}100%{transform:scale(1.12)}}@keyframes nodeBreath{50%{transform:scale(1.07)}}@keyframes ring{0%{transform:translateY(-50%) scale(.8);opacity:.9}100%{transform:translateY(-50%) scale(1.65);opacity:0}}@keyframes doneRing{0%{transform:translateY(-50%) scale(.85);opacity:1}100%{transform:translateY(-50%) scale(2.2);opacity:0}}@keyframes answerGlow{0%{transform:scale(.94)}35%{transform:scale(1.25)}100%{transform:scale(1)}}@keyframes flight{0%{left:var(--x1);top:var(--y1);transform:scale(.45);opacity:0}15%{opacity:1}80%{opacity:1}100%{left:var(--x2);top:var(--y2);transform:scale(1.35);opacity:0}}
@media(max-width:900px){.workspace,.workspace.answer-open{display:block}.canvas{min-height:calc(100vh - 62px);min-height:720px}.answer{position:fixed;left:8px;right:8px;bottom:8px;max-height:48vh;border:1px solid rgba(255,255,255,.08);border-radius:22px;z-index:30;transform:translateY(110%)}.answer.open{transform:translateY(0)}.composerWrap{width:92%;bottom:2.2%}.network{inset:1% 0 22%;width:100%;height:77%}.node small{display:none}.nodeCore{width:45px;height:45px}.node.you .nodeCore{width:56px;height:56px}.topbar{padding:0 13px}.mode{display:none}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><div class="brand"><span class="brandMark">✦</span>AI TEAM</div><div class="topRight"><span class="mode">MULTI-AGENT · PRIVATE REQUEST</span><div id="status" class="statusPill"><span class="statusDot"></span><span id="statusText">READY</span></div></div></header>
<section id="workspace" class="workspace">
<div class="canvas"><div class="ambient a"></div><div class="ambient b"></div><svg id="network" class="network" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="stars"></div><div id="nodes"></div>
<div class="composerWrap"><div class="composer"><textarea id="question" rows="1" placeholder="Ask your AI Team anything…"></textarea><button id="send" class="send" aria-label="Send">➜</button></div><div class="hint">AI Team selects specialists in parallel, then an independent reviewer returns one answer.</div></div></div>
<aside id="answer" class="answer"><div class="answerHead"><div><span id="verdict" class="verdict">✓</span><div><strong>AI Team response</strong><small id="meta">waiting</small></div></div><span id="reviewBadge" class="badge">VALIDATED</span></div><div id="answerBody" class="answerBody empty">Your reviewed answer will appear here.</div><div id="agentsUsed" class="agentsUsed"></div></aside>
</section></main>
<script>
const API='https://text.pollinations.ai/openai';
const POS={you:{x:50,y:91},planner:{x:50,y:73},router:{x:50,y:58},qwenCode:{x:13,y:37},qwen:{x:26,y:25},gemini:{x:40,y:34},deepseek:{x:58,y:34},mistral:{x:74,y:25},kimi:{x:87,y:37},openai:{x:34,y:10},grok:{x:66,y:10},reviewer:{x:50,y:7}};
const INFO={you:['YOU','Prompt'],planner:['PLANNER','Understands'],router:['ROUTER','Selects specialists'],qwenCode:['QWEN CODE','Coding'],qwen:['QWEN','Reasoning'],gemini:['GEMINI','Research'],deepseek:['DEEPSEEK','Reasoning'],mistral:['MISTRAL','General'],kimi:['KIMI','Long context'],openai:['OPENAI','Synthesis'],grok:['GROK','Critic'],reviewer:['REVIEWER','Independent validation']};
const MODELS={qwenCode:'qwen-coder-large',qwen:'qwen-large',gemini:'gemini-large',deepseek:'deepseek',mistral:'mistral-large',kimi:'kimi',openai:'openai-large',grok:'grok-large'};
const ROUTES={coding:{agents:['qwenCode','deepseek'],reviewer:'gemini'},research:{agents:['gemini','qwen'],reviewer:'openai'},automation:{agents:['qwenCode','mistral'],reviewer:'deepseek'},design:{agents:['gemini','openai'],reviewer:'mistral'},reasoning:{agents:['deepseek','qwen'],reviewer:'gemini'},general:{agents:['openai','kimi'],reviewer:'mistral'}};
const FALLBACK=['openai-fast','mistral','deepseek'];
const $=id=>document.getElementById(id),network=$('network'),nodes=$('nodes'),stars=$('stars'),question=$('question'),send=$('send'),workspace=$('workspace'),answer=$('answer');
let busy=false,active=new Set(),activeEdges=new Set(),selected=new Set(),answered=false;
function classify(t){const q=t.toLowerCase();if(/\b(code|bug|fix|debug|refactor|python|javascript|typescript|abap|cds|api|sql|program|function|class)\b/.test(q))return'coding';if(/\b(research|find|discover|compare|analyse|analyze|source|security|privacy|latest|news|github|repo|market)\b/.test(q))return'research';if(/\b(workflow|automate|automation|schedule|monitor|alert|pipeline|action)\b/.test(q))return'automation';if(/\b(design|layout|ui|ux|website|visual|style|logo|screen|interface)\b/.test(q))return'design';if(/\b(reason|math|logic|calculate|solve|why|trade.?off|decision)\b/.test(q))return'reasoning';return'general'}
function path(a,b){const A=POS[a],B=POS[b];return `M ${A.x} ${A.y} C ${A.x} ${(A.y+B.y)/2}, ${B.x} ${(A.y+B.y)/2}, ${B.x} ${B.y}`}
const specialistIds=Object.keys(MODELS);[['you','planner'],['planner','router'],...specialistIds.map(x=>['router',x]),...specialistIds.map(x=>[x,'reviewer']),['reviewer','you']].forEach(([a,b])=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path(a,b));p.dataset.edge=`${a}:${b}`;p.setAttribute('class','edge');network.appendChild(p)});
Object.entries(POS).forEach(([id,p])=>{const el=document.createElement('div');el.id=`node-${id}`;el.className=`node ${id==='you'?'you ':''}${id==='reviewer'?'reviewer ':''}`;el.style.left=`${p.x}%`;el.style.top=`${p.y}%`;const [t,s]=INFO[id];el.innerHTML=`<div class="halo"></div><div class="nodeCore"><div class="orb"></div><span>${id==='you'?'◎':id==='reviewer'?'✓':'✦'}</span></div><strong>${t}</strong><small>${s}</small>`;nodes.appendChild(el)});
function render(){document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('active',activeEdges.has(e.dataset.edge)));Object.keys(POS).forEach(id=>{const e=$(`node-${id}`);e.classList.toggle('active',active.has(id));e.classList.toggle('selected',selected.has(id));e.classList.toggle('answered',answered&&id==='you');if(specialistIds.includes(id))e.classList.toggle('dim',selected.size>0&&!selected.has(id))});$('status').className=`statusPill ${busy?'busy':answered?'done':''}`;$('statusText').textContent=busy?'WORKING':answered?'ANSWERED':'READY';send.disabled=busy||!question.value.trim()}
function star(from,to){const A=POS[from],B=POS[to],d=document.createElement('div');d.className='star';d.style.setProperty('--x1',`${A.x}%`);d.style.setProperty('--y1',`${A.y}%`);d.style.setProperty('--x2',`${B.x}%`);d.style.setProperty('--y2',`${B.y}%`);d.innerHTML='<span></span>';stars.appendChild(d);setTimeout(()=>d.remove(),850)}
async function travel(from,to,hold=420){active=new Set([to]);activeEdges=new Set([`${from}:${to}`]);star(from,to);render();await sleep(hold)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function call(model,messages,maxTokens=1300){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),35000);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages,max_tokens:maxTokens,temperature:.25,private:true,referrer:'ai-team-playground'}),signal:ctl.signal});if(!r.ok)throw new Error(`${model} ${r.status}`);const j=await r.json();const text=j?.choices?.[0]?.message?.content;if(!text)throw new Error(`${model} empty`);return String(text).trim()}finally{clearTimeout(timer)}}
async function callWithFallback(model,messages,maxTokens){let err;for(const m of [model,...FALLBACK.filter(x=>x!==model)]){try{return {model:m,text:await call(m,messages,maxTokens)}}catch(e){err=e}}throw err||new Error('No model responded')}
function specialistPrompt(kind){return kind==='coding'?'Act as a senior coding specialist. Check correctness, edge cases, maintainability and give a concise solution.':kind==='research'?'Act as a rigorous research specialist. Separate facts from assumptions and prioritize reliable evidence.':kind==='automation'?'Act as an automation/reliability engineer. Find failure modes and propose the simplest robust solution.':kind==='design'?'Act as a product/UI specialist. Optimize usability, clarity and implementation practicality.':kind==='reasoning'?'Act as an analytical reasoning specialist. Solve carefully and test the conclusion.':'Act as a strong general problem solver. Give a direct, useful answer and flag uncertainty.'}
async function ask(){const q=question.value.trim();if(!q||busy)return;busy=true;answered=false;answer.classList.remove('open');workspace.classList.remove('answer-open');selected.clear();active.clear();activeEdges.clear();render();const kind=classify(q),route=ROUTES[kind];try{await travel('you','planner');await travel('planner','router');selected=new Set(route.agents);render();await Promise.all(route.agents.map(async(id,i)=>{await sleep(i*120);star('router',id);active.add(id);activeEdges.add(`router:${id}`);render()}));const system=specialistPrompt(kind);const results=await Promise.all(route.agents.map(id=>callWithFallback(MODELS[id],[{role:'system',content:system},{role:'user',content:q}],1450).then(r=>({id,...r}))));for(const r of results){activeEdges.delete(`router:${r.id}`);activeEdges.add(`${r.id}:reviewer`);star(r.id,'reviewer')}active=new Set(['reviewer']);render();const reviewerId=route.reviewer,reviewModel=MODELS[reviewerId];const reviewPrompt=`You are the independent final reviewer and synthesizer for an AI team.\nUser question:\n${q}\n\nCandidate A (${results[0].model}):\n${results[0].text}\n\nCandidate B (${results[1].model}):\n${results[1].text}\n\nReturn the best final answer only. Reconcile disagreements, remove unsupported claims, correct mistakes, and keep it concise unless detail is necessary.`;const reviewed=await callWithFallback(reviewModel,[{role:'user',content:reviewPrompt}],1800);await sleep(200);star('reviewer','you');activeEdges=new Set(['reviewer:you']);active=new Set(['you']);answered=true;render();$('meta').textContent=`${kind.toUpperCase()} · ${reviewed.model}`;$('answerBody').className='answerBody';$('answerBody').textContent=reviewed.text;$('verdict').textContent='✓';$('verdict').classList.remove('bad');$('reviewBadge').textContent='VALIDATED';$('agentsUsed').textContent=`Specialists: ${results.map(r=>r.model).join(' + ')} · Reviewer: ${reviewed.model}`;answer.classList.add('open');workspace.classList.add('answer-open');document.title='✓ AI Team answered';setTimeout(()=>{document.title='AI Team'},2500)}catch(e){answered=false;active=new Set(['you']);activeEdges.clear();render();$('verdict').textContent='!';$('verdict').classList.add('bad');$('reviewBadge').textContent='RETRY';$('meta').textContent='MODEL NETWORK';$('answerBody').className='answerBody errorText';$('answerBody').textContent=`AI Team could not complete this request. ${e?.message||'Please retry.'}`;$('agentsUsed').textContent='No answer was marked validated.';answer.classList.add('open');workspace.classList.add('answer-open');$('status').className='statusPill error';$('statusText').textContent='RETRY'}finally{busy=false;render()}}
question.addEventListener('input',render);question.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});send.addEventListener('click',ask);render();
</script>
</body></html>
