<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Team Playground</title><meta name="description" content="Visual AI Team playground"><style>:root {
  color-scheme: dark;
  --bg: #05070a;
  --panel: rgba(11, 15, 22, .74);
  --line: rgba(145, 178, 214, .15);
  --text: #f3f7fb;
  --muted: #738194;
  --cyan: #74e9ff;
  --violet: #9679ff;
  --green: #55f3b4;
  --amber: #ffc76a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,textarea{font:inherit}
.shell{min-height:100vh;background:radial-gradient(circle at 50% 10%,rgba(69,85,126,.12),transparent 32%),linear-gradient(180deg,#080b10,#040609 72%)}
.topbar{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.055);backdrop-filter:blur(22px);position:relative;z-index:5}
.brand{font-size:13px;letter-spacing:.18em;font-weight:750}.brandMark{color:var(--cyan);margin-right:8px;text-shadow:0 0 16px rgba(116,233,255,.9)}
.statusPill{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:999px;padding:7px 12px;font-size:10px;letter-spacing:.13em;color:#9aa7b5}.statusDot{width:6px;height:6px;border-radius:50%;background:#5d6976}.statusPill.thinking .statusDot,.statusPill.planning .statusDot,.statusPill.routing .statusDot,.statusPill.working .statusDot,.statusPill.reviewing .statusDot{background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1s infinite}.statusPill.done .statusDot{background:var(--green);box-shadow:0 0 12px var(--green)}.statusPill.error .statusDot{background:#ff758a}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 0;min-height:calc(100vh - 64px);transition:grid-template-columns .55s cubic-bezier(.22,.8,.2,1)}.workspace:has(.answerPanel.open){grid-template-columns:minmax(0,1fr) min(410px,34vw)}
.canvasPanel{position:relative;min-height:calc(100vh - 64px);overflow:hidden}.canvasPanel:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.17) .7px,transparent .7px);background-size:22px 22px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.22),transparent 85%);opacity:.18}
.ambient{position:absolute;width:430px;height:430px;border-radius:50%;filter:blur(95px);opacity:.09;pointer-events:none}.ambientA{background:var(--violet);left:4%;top:3%}.ambientB{background:var(--cyan);right:5%;top:26%}
.network{position:absolute;inset:4% 8% 24%;width:84%;height:72%;overflow:visible}.edge{fill:none;stroke:rgba(126,153,186,.15);stroke-width:.16;vector-effect:non-scaling-stroke;transition:stroke .35s,filter .35s}.edge.active{stroke:rgba(116,233,255,.78);stroke-width:.32;filter:url(#glow);stroke-dasharray:1.2 1.3;animation:dash .6s linear infinite}
.nodeWrap{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:9px;z-index:2;transition:opacity .4s,filter .4s}.nodeWrap.dim{opacity:.24;filter:saturate(.3)}
.nodeCore{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.2),rgba(104,122,155,.08) 28%,rgba(13,18,28,.93) 67%);border:1px solid rgba(172,203,232,.22);box-shadow:inset 0 0 25px rgba(112,144,184,.08),0 6px 30px rgba(0,0,0,.45);position:relative;overflow:hidden;transition:transform .35s,border-color .35s,box-shadow .35s}.nodeCore span{font-size:18px;color:#b8c3d2;position:relative;z-index:2}.orbNoise{position:absolute;inset:-40%;background:conic-gradient(from 40deg,transparent,rgba(116,233,255,.15),transparent 28%,rgba(150,121,255,.13),transparent 62%);animation:spin 9s linear infinite}
.nodeHalo{position:absolute;top:27px;width:70px;height:70px;border-radius:50%;border:1px solid transparent;transform:translateY(-50%);pointer-events:none}.nodeText{display:flex;flex-direction:column;align-items:center;gap:3px}.nodeText strong{font-size:9px;letter-spacing:.14em;color:#c8d3df}.nodeText small{font-size:8px;color:#546173}
.nodeWrap.active .nodeCore{transform:scale(1.14);border-color:rgba(116,233,255,.72);box-shadow:0 0 15px rgba(116,233,255,.2),0 0 55px rgba(116,233,255,.12),inset 0 0 30px rgba(116,233,255,.12);animation:impact .5s ease-out,nodeBreath 1.3s ease-in-out .5s infinite}.nodeWrap.active .nodeCore span{color:var(--cyan);text-shadow:0 0 14px var(--cyan)}.nodeWrap.active .nodeHalo{border-color:rgba(116,233,255,.24);animation:ring 1.4s ease-out infinite}.nodeWrap.active .nodeText strong{color:white}
.node-you{top:auto!important;bottom:13.5%;left:50%!important}.node-you .nodeCore{width:62px;height:62px}.node-you .nodeHalo{top:31px}.node-reviewer{top:8%!important}.nodeWrap.answered .nodeCore{border-color:rgba(85,243,180,.95);box-shadow:0 0 18px rgba(85,243,180,.38),0 0 75px rgba(85,243,180,.18);animation:answerGlow 1.5s ease-out 2}.nodeWrap.answered .nodeCore span{color:var(--green);text-shadow:0 0 16px var(--green)}.nodeWrap.answered .nodeHalo{border-color:rgba(85,243,180,.55);animation:doneRing 1.2s ease-out 2}
.shootingStar{position:absolute;inset:0;z-index:4;pointer-events:none}.shootingStar span{position:absolute;left:var(--x1);top:var(--y1);width:7px;height:7px;border-radius:50%;background:white;box-shadow:0 0 7px 2px white,0 0 18px 4px var(--cyan),-12px 3px 16px 1px rgba(116,233,255,.45);animation:starFlight .7s cubic-bezier(.3,.7,.25,1) forwards}.shootingStar span:after{content:"";position:absolute;width:34px;height:2px;right:3px;top:3px;background:linear-gradient(90deg,transparent,rgba(116,233,255,.75));transform:rotate(-10deg);filter:blur(.5px)}
.composerWrap{position:absolute;left:50%;bottom:3.6%;transform:translateX(-50%);width:min(680px,76%);z-index:6}.composer{display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 18px;border:1px solid rgba(169,203,239,.14);background:rgba(10,14,20,.82);backdrop-filter:blur(22px);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.035);transition:border-color .3s,box-shadow .3s}.composer:focus-within{border-color:rgba(116,233,255,.38);box-shadow:0 20px 60px rgba(0,0,0,.42),0 0 0 3px rgba(116,233,255,.04)}.composer textarea{flex:1;min-height:42px;max-height:128px;resize:none;border:0;outline:0;background:transparent;color:#f4f8fc;padding:10px 0;line-height:1.35;font-size:14px}.composer textarea::placeholder{color:#596676}.composer button{width:42px;height:42px;border-radius:13px;border:1px solid rgba(116,233,255,.28);background:linear-gradient(145deg,rgba(116,233,255,.17),rgba(150,121,255,.12));color:#eaffff;display:grid;place-items:center;cursor:pointer;transition:.25s}.composer button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 30px rgba(116,233,255,.16)}.composer button:disabled{opacity:.32;cursor:not-allowed}.composer.busy button span{animation:spin 1s linear infinite}
.answerPanel{border-left:1px solid rgba(255,255,255,.07);background:rgba(7,10,15,.87);backdrop-filter:blur(24px);transform:translateX(100%);opacity:0;transition:transform .55s cubic-bezier(.22,.8,.2,1),opacity .4s;overflow:hidden;display:flex;flex-direction:column}.answerPanel.open{transform:translateX(0);opacity:1}.answerHeader{padding:24px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.answerHeader>div{display:flex;gap:11px;align-items:center}.answerHeader strong{display:block;font-size:13px}.answerHeader small{display:block;margin-top:4px;color:#687688;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.verdict{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:rgba(85,243,180,.1);color:var(--green);border:1px solid rgba(85,243,180,.25)}.verdict.bad{background:rgba(255,117,138,.09);border-color:rgba(255,117,138,.25);color:#ff758a}.reviewBadge{font-size:8px;letter-spacing:.11em;color:var(--green);border:1px solid rgba(85,243,180,.16);background:rgba(85,243,180,.05);padding:6px 8px;border-radius:999px;white-space:nowrap}.answerBody{padding:25px;overflow:auto;line-height:1.65;color:#d5dde7;font-size:13px;white-space:pre-wrap}.answerBody p{margin:0}.emptyAnswer{color:#536071}.errorText{color:#ff9cac}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45;transform:scale(.7)}}@keyframes dash{to{stroke-dashoffset:-2.5}}@keyframes impact{0%{transform:scale(.86)}55%{transform:scale(1.22)}100%{transform:scale(1.14)}}@keyframes nodeBreath{50%{transform:scale(1.08)}}@keyframes ring{0%{transform:translateY(-50%) scale(.8);opacity:.9}100%{transform:translateY(-50%) scale(1.65);opacity:0}}@keyframes doneRing{0%{transform:translateY(-50%) scale(.85);opacity:1}100%{transform:translateY(-50%) scale(2.1);opacity:0}}@keyframes answerGlow{0%{transform:scale(.95)}35%{transform:scale(1.24)}100%{transform:scale(1)}}@keyframes starFlight{0%{left:var(--x1);top:var(--y1);transform:scale(.45);opacity:0}15%{opacity:1}80%{opacity:1}100%{left:var(--x2);top:var(--y2);transform:scale(1.35);opacity:0}}
@media (max-width:900px){.workspace,.workspace:has(.answerPanel.open){display:block}.canvasPanel{min-height:720px}.answerPanel{position:fixed;left:10px;right:10px;bottom:10px;max-height:46vh;border:1px solid rgba(255,255,255,.08);border-radius:22px;z-index:20;transform:translateY(110%)}.answerPanel.open{transform:translateY(0)}.composerWrap{width:90%;bottom:2.5%}.nodeText small{display:none}.network{inset:4% 3% 22%;width:94%;height:74%}.topbar{padding:0 16px}}
</style></head>
<body><main class="shell"><header class="topbar"><div class="brand"><span class="brandMark">✦</span> AI TEAM</div><div id="statusPill" class="statusPill idle"><span class="statusDot"></span><span id="statusText">READY</span></div></header>
<section id="workspace" class="workspace"><div class="canvasPanel"><div class="ambient ambientA"></div><div class="ambient ambientB"></div><svg id="network" class="network" viewBox="0 0 100 92" preserveAspectRatio="none"><defs><filter id="glow"><feGaussianBlur stdDeviation="0.6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg><div id="stars"></div><div id="nodes"></div>
<div class="composerWrap"><div id="composer" class="composer"><textarea id="question" rows="1" placeholder="Ask your AI Team anything…" aria-label="Ask AI Team"></textarea><button id="send" aria-label="Send"><span>➜</span></button></div></div></div>
<aside id="answerPanel" class="answerPanel"><div class="answerHeader"><div><span id="verdict" class="verdict">•</span><div><strong id="answerTitle">AI Team response</strong><small id="answerMeta">Waiting for a question</small></div></div><span id="reviewBadge" class="reviewBadge" hidden></span></div><div class="answerBody"><div id="answerBody" class="emptyAnswer">Your reviewed answer will appear here.</div></div></aside></section></main><script>const POS={you:{x:50,y:84},planner:{x:50,y:65},router:{x:50,y:46},research:{x:25,y:26},worker:{x:50,y:20},coding:{x:75,y:26},reviewer:{x:50,y:4}};
const COPY={you:['YOU','Prompt'],planner:['PLANNER','Understands'],router:['ROUTER','Chooses path'],research:['RESEARCH','Investigates'],worker:['WORKER','Builds answer'],coding:['CODING','Solves code'],reviewer:['REVIEWER','Checks quality']};
const EDGES=[['you','planner'],['planner','router'],['router','research'],['router','worker'],['router','coding'],['research','reviewer'],['worker','reviewer'],['coding','reviewer'],['reviewer','you']];
let state={phase:'idle',activeNode:null,activeEdge:null,route:null,model:null,review:null};
const $=id=>document.getElementById(id);const network=$('network'),nodes=$('nodes'),stars=$('stars'),question=$('question'),send=$('send'),workspace=$('workspace'),answerPanel=$('answerPanel');
function path(a,b){const A=POS[a],B=POS[b];return `M ${A.x} ${A.y} C ${A.x} ${(A.y+B.y)/2}, ${B.x} ${(A.y+B.y)/2}, ${B.x} ${B.y}`}
EDGES.forEach(([a,b])=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path(a,b));p.dataset.edge=`${a}:${b}`;p.setAttribute('class','edge');network.appendChild(p)});
Object.entries(POS).forEach(([id,p])=>{const el=document.createElement('div');el.id=`node-${id}`;el.className=`nodeWrap node-${id}`;el.style.left=`${p.x}%`;el.style.top=`${p.y}%`;const [t,s]=COPY[id];el.innerHTML=`<div class="nodeHalo"></div><div class="nodeCore"><div class="orbNoise"></div><span>${id==='you'?'◎':id==='reviewer'?'✓':'✦'}</span></div><div class="nodeText"><strong>${t}</strong><small>${s}</small></div>`;nodes.appendChild(el)});
function status(){const p=state.phase;return p==='idle'?'READY':p==='done'?'ANSWERED':p==='error'?'NEEDS ATTENTION':'THINKING'}
function render(){document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('active',e.dataset.edge===state.activeEdge));Object.keys(POS).forEach(id=>{const e=$(`node-${id}`);e.classList.toggle('active',id===state.activeNode);e.classList.toggle('answered',state.phase==='done'&&id==='you');e.classList.toggle('dim',(state.route==='coding'&&id==='research')||(state.route==='research'&&id==='coding'))});$('statusPill').className=`statusPill ${state.phase}`;$('statusText').textContent=status();$('composer').classList.toggle('busy',!['idle','done','error'].includes(state.phase));send.disabled=!question.value.trim()||!['idle','done','error'].includes(state.phase)}
function shooting(from,to){stars.innerHTML='';const A=POS[from],B=POS[to],d=document.createElement('div');d.className='shootingStar';d.style.setProperty('--x1',`${A.x}%`);d.style.setProperty('--y1',`${A.y}%`);d.style.setProperty('--x2',`${B.x}%`);d.style.setProperty('--y2',`${B.y}%`);d.innerHTML='<span></span>';stars.appendChild(d);setTimeout(()=>{if(stars.contains(d))d.remove()},900)}
function activate(from,to,phase){state.activeNode=to;state.activeEdge=`${from}:${to}`;state.phase=phase||to;shooting(from,to);render()}
function preview(t){const q=t.toLowerCase();if(/\b(code|bug|fix|debug|refactor|python|javascript|typescript|abap|cds|api)\b/.test(q))return'coding';if(/\b(research|find|discover|compare|analyse|analyze|repository|github|source|security|privacy)\b/.test(q))return'research';if(/\b(workflow|automate|automation|schedule|monitor|alert|github actions)\b/.test(q))return'automation';if(/\b(design|layout|ui|ux|website|visual|style)\b/.test(q))return'design';return'general'}
function sourceNode(){return state.route==='coding'?'coding':state.route==='research'?'research':'worker'}
function openAnswer(error,answer){answerPanel.classList.add('open');if(error){$('verdict').textContent='!';$('verdict').classList.add('bad');$('answerTitle').textContent='AI Team needs attention';$('answerBody').className='errorText';$('answerBody').textContent=error;$('reviewBadge').hidden=true}else{$('verdict').classList.remove('bad');$('verdict').textContent='✓';$('answerTitle').textContent='AI Team response';$('answerBody').className='';$('answerBody').textContent=answer;$('answerMeta').textContent=`${(state.route||'general').toUpperCase()} · ${state.model||'routing'}`;$('reviewBadge').hidden=false;$('reviewBadge').textContent=`REVIEW ${state.review||'PASS'}`}}
async function ask(){const text=question.value.trim();if(!text||!['idle','done','error'].includes(state.phase))return;answerPanel.classList.remove('open');state={phase:'thinking',activeNode:'you',activeEdge:null,route:preview(text),model:null,review:null};render();setTimeout(()=>activate('you','planner','planning'),80);try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});if(!r.ok||!r.body)throw new Error(`Request failed (${r.status})`);const reader=r.body.getReader(),dec=new TextDecoder();let buf='';while(true){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(!line.trim())continue;const e=JSON.parse(line);if(e.type==='planner'){state.route=e.taskType;activate('planner','router','routing')}if(e.type==='worker'){state.model=e.model;const target=e.taskType==='coding'?'coding':e.taskType==='research'?'research':'worker';activate('router',target,'working')}if(e.type==='reviewer'){activate(sourceNode(),'reviewer','reviewing')}if(e.type==='retry'){state.review='RETRY';state.activeNode='worker';state.phase='retrying';render()}if(e.type==='done'){state.review=e.review||'PASS';state.model=e.model||state.model;activate('reviewer','you','done');openAnswer(null,e.answer||'')}if(e.type==='error')throw new Error(e.message||'AI Team failed')}}}catch(e){state.phase='error';state.activeNode='you';state.activeEdge=null;render();openAnswer(e.message||'Something went wrong')}}
send.addEventListener('click',ask);question.addEventListener('input',render);question.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});render();</script></body></html>
