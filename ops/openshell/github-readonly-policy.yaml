# Proof-only. Do not grant write operations, arbitrary network access or secrets.
# Static policy must be supplied when creating the sandbox.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
  read_write:
    - /tmp
landlock:
  compatibility: hard_requirement
network_policies:
  github_readonly:
    name: github-readonly
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /repos/NVIDIA/OpenShell
          - allow:
              method: GET
              path: /repos/rntlgopinath57/OmniRoute
    binaries:
      - path: /usr/bin/curl
