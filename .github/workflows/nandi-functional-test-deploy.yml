name: Nandi Voice Agent Deploy

on:
  push:
    branches:
      - nandi-voice-agent-v1
    paths:
      - "ai-team-playground/nandi.html"
      - "ai-team-playground/src/nandi-neural-voice.mjs"
      - "netlify/functions/ask.mts"
      - "cloudflare/**"
      - "relay-runtime/**"
      - "wrangler.jsonc"
      - ".github/workflows/nandi-voice-agent-test-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nandi-voice-agent-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_GEMINI_BASE_URL: ${{ secrets.GOOGLE_GEMINI_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RELAY_GITHUB_TOKEN: ${{ secrets.RELAY_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: nandi-voice-agent-v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build pinned neural voice bundle
        shell: bash
        run: |
          rm -rf /tmp/nandi-voice-build
          mkdir -p /tmp/nandi-voice-build ai-team-playground/assets
          cd /tmp/nandi-voice-build
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund --ignore-scripts kokoro-js@1.2.1 esbuild@0.28.2
          NODE_PATH=/tmp/nandi-voice-build/node_modules ./node_modules/.bin/esbuild             "$GITHUB_WORKSPACE/ai-team-playground/src/nandi-neural-voice.mjs"             --bundle --format=esm --platform=browser --target=es2022             --outfile="$GITHUB_WORKSPACE/ai-team-playground/assets/nandi-neural-voice.js"
          test -s "$GITHUB_WORKSPACE/ai-team-playground/assets/nandi-neural-voice.js"
          test "$(wc -c < "$GITHUB_WORKSPACE/ai-team-playground/assets/nandi-neural-voice.js")" -gt 100000
          grep -q 'NANDI_NEURAL_VOICE_V1' "$GITHUB_WORKSPACE/ai-team-playground/assets/nandi-neural-voice.js"
          cd "$GITHUB_WORKSPACE"
          npx --yes esbuild@0.28.2 netlify/functions/ask.mts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/nandi-ask-check.mjs >/dev/null
          test -s /tmp/nandi-ask-check.mjs

      - name: Validate Nandi page
        run: |
          test -f ai-team-playground/nandi.html
          grep -q 'Hi Nandi' ai-team-playground/nandi.html
          grep -q 'SpeechRecognition' ai-team-playground/nandi.html
          grep -q '/api/ask' ai-team-playground/nandi.html
          grep -q 'NANDI_VOICE_AGENT_V1' ai-team-playground/nandi.html
          grep -q '/assets/nandi-neural-voice.js' ai-team-playground/nandi.html
          grep -q 'barge-in' ai-team-playground/nandi.html
          grep -q 'stream_reset' ai-team-playground/nandi.html
          grep -q 'likelyEcho' ai-team-playground/nandi.html
          ! grep -q 'SpeechSynthesisUtterance' ai-team-playground/nandi.html
          grep -q 'voiceStreamSafe' netlify/functions/ask.mts
          grep -q 'type: "delta"' netlify/functions/ask.mts
          grep -q 'callModelStreaming' netlify/functions/ask.mts
          grep -q 'NANDI_UI_V2' ai-team-playground/nandi.html
          grep -q 'LIVE TRACE' ai-team-playground/nandi.html
          grep -q '>LISTEN<' ai-team-playground/nandi.html
          grep -q '>ROUTE<' ai-team-playground/nandi.html
          grep -q '>ACT<' ai-team-playground/nandi.html
          grep -q '>VERIFY<' ai-team-playground/nandi.html
          grep -q '>RESPOND<' ai-team-playground/nandi.html
          grep -q 'listenPulse' ai-team-playground/nandi.html
          grep -q 'verifyScan' ai-team-playground/nandi.html
          grep -q 'wave' ai-team-playground/nandi.html
          ! grep -q 'nandi-shiva-cinematic' ai-team-playground/nandi.html
          ! grep -q 'sketchfab' ai-team-playground/nandi.html
          ! grep -q 'three.module' ai-team-playground/nandi.html

      - name: Deploy isolated Nandi worker
        run: |
          npx --yes wrangler@latest deploy --config wrangler.jsonc --name nandi-voice-agent-test

      - name: Sync configured Relay secrets
        shell: bash
        run: |
          put_secret () {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Skipped $key"
              return 0
            fi
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$key" --name nandi-voice-agent-test >/dev/null
            echo "Synced $key"
          }
          put_secret OPENAI_BASE_URL "$OPENAI_BASE_URL"
          put_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          put_secret ANTHROPIC_BASE_URL "$ANTHROPIC_BASE_URL"
          put_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          put_secret GOOGLE_GEMINI_BASE_URL "$GOOGLE_GEMINI_BASE_URL"
          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret OPENROUTER_BASE_URL "$OPENROUTER_BASE_URL"
          put_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put_secret GROQ_API_KEY "$GROQ_API_KEY"
          put_secret RELAY_GITHUB_TOKEN "$RELAY_GITHUB_TOKEN"

      - name: Smoke Nandi page
        run: |
          for attempt in 1 2 3 4 5 6; do
            if body="$(curl --location --fail --silent --show-error https://nandi-voice-agent-test.gopi-alerts-3859dc2239de.workers.dev/nandi)"; then
              if printf '%s' "$body" | grep -q 'NANDI' \
                && printf '%s' "$body" | grep -q 'LIVE TRACE' \
                && printf '%s' "$body" | grep -q 'Ask Nandi anything' \
                && printf '%s' "$body" | grep -q 'listenPulse' \
                && printf '%s' "$body" | grep -q '/api/ask' \
                && printf '%s' "$body" | grep -q 'NANDI_VOICE_AGENT_V1' \
                && printf '%s' "$body" | grep -q '/assets/nandi-neural-voice.js'; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Browser verify animated voice-agent states
        shell: bash
        run: |
          rm -rf /tmp/nandi-voice-pw
          mkdir -p /tmp/nandi-voice-pw
          cd /tmp/nandi-voice-pw
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install chromium
          cat > nandi-voice.spec.js <<'NODE'
          const { test, expect } = require('@playwright/test');

          test('Nandi voice shell animates and exposes voice-agent controls', async ({ page }) => {
            await page.goto('https://nandi-voice-agent-test.gopi-alerts-3859dc2239de.workers.dev/nandi', { waitUntil: 'domcontentloaded' });

            await expect(page.locator('#agent')).toHaveClass(/idle/);
            await expect(page.locator('.agent-zone')).toBeVisible();
            await expect(page.locator('.pipeline')).toBeVisible();
            await expect(page.locator('.composer')).toBeVisible();
            await expect(page.locator('.activity')).toBeVisible();
            const uiMarker = await page.locator('html').evaluate(() => document.documentElement.outerHTML.includes('NANDI_UI_V2'));
            expect(uiMarker).toBeTruthy();
            await expect(page.locator('[data-stage="listen"]')).toBeVisible();
            await expect(page.locator('[data-stage="route"]')).toBeVisible();
            await expect(page.locator('[data-stage="act"]')).toBeVisible();
            await expect(page.locator('[data-stage="verify"]')).toBeVisible();
            await expect(page.locator('[data-stage="respond"]')).toBeVisible();

            await page.locator('#micBtn').click();
            await expect(page.locator('#agent')).toHaveClass(/wake|listening/, { timeout: 3000 });

            const animationNames = await page.evaluate(() => {
              const agent = document.querySelector('#agent');
              const core = document.querySelector('.core');
              const waveBar = document.querySelector('.wave i');
              return {
                agentClass: agent?.className || '',
                coreAnimation: getComputedStyle(core).animationName,
                waveAnimation: getComputedStyle(waveBar).animationName,
              };
            });
            expect(animationNames.agentClass).toMatch(/wake|listening/);
            expect(animationNames.coreAnimation).not.toBe('none');

            await page.evaluate(() => {
              const a = document.querySelector('#agent');
              a.className = 'agent routing';
            });
            const ringAnimation = await page.locator('.ring.r1').evaluate(el => getComputedStyle(el).animationName);
            expect(ringAnimation).toBe('spin');

            await page.evaluate(() => {
              const a = document.querySelector('#agent');
              a.className = 'agent verifying';
            });
            const verifyAnimation = await page.locator('.ring.r3').evaluate(el => getComputedStyle(el).animationName);
            expect(verifyAnimation).toBe('verifyScan');

            const markers = await page.evaluate(() => ({
              voiceAgent: document.documentElement.outerHTML.includes('NANDI_VOICE_AGENT_V1'),
              noBrowserReadAloud: !document.documentElement.outerHTML.includes('SpeechSynthesisUtterance'),
              neuralModuleTag: !!document.querySelector('script[src="/assets/nandi-neural-voice.js"]'),
            }));
            expect(markers.voiceAgent).toBeTruthy();
            expect(markers.noBrowserReadAloud).toBeTruthy();
            expect(markers.neuralModuleTag).toBeTruthy();
          });
          NODE
          npx playwright test nandi-voice.spec.js --workers=1 --reporter=line

      - name: Verify real neural voice generation
        shell: bash
        run: |
          cd /tmp/nandi-voice-pw
          cat > nandi-neural.spec.js <<'NODE'
          const { test, expect } = require('@playwright/test');
          test.setTimeout(180000);

          test('Nandi generates real Kokoro audio locally', async ({ page }) => {
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('https://nandi-voice-agent-test.gopi-alerts-3859dc2239de.workers.dev/nandi', { waitUntil: 'domcontentloaded' });
            await expect.poll(
              () => page.evaluate(() => window.NandiNeuralVoiceVersion || ''),
              { timeout: 20000 }
            ).toBe('NANDI_NEURAL_VOICE_V1');

            const result = await page.evaluate(async () => {
              return await window.NandiNeuralVoice.probe('Nandi is ready.');
            });
            expect(result.ok).toBeTruthy();
            expect(result.bytes).toBeGreaterThan(1000);
            expect(errors).toEqual([]);
          });
          NODE
          npx playwright test nandi-neural.spec.js --workers=1 --reporter=line

      - name: Verify real Relay response
        shell: bash
        run: |
          response="$(curl --location --fail --silent --show-error --max-time 65 \
            -H 'Content-Type: application/json' \
            --data '{"question":"Reply briefly with: Nandi functional agent is working.","history":[]}' \
            https://nandi-voice-agent-test.gopi-alerts-3859dc2239de.workers.dev/api/ask)"
          printf '%s\n' "$response"
          ! printf '%s' "$response" | grep -q '"type":"error"'
          printf '%s' "$response" | grep -q '"type":"planner"'
          printf '%s' "$response" | grep -Eq '"type":"worker"|"type":"worker_selected"'
          printf '%s' "$response" | grep -q '"type":"done"'
          printf '%s' "$response" | grep -q '"answer"'
          printf '%s' "$response" | grep -q '"voiceStreamSafe"'
          printf '%s' "$response" | grep -q '"type":"delta"'

      - name: Verify GitHub action routing
        shell: bash
        run: |
          response="$(curl --location --fail --silent --show-error --max-time 65 \
            -H 'Content-Type: application/json' \
            --data '{"question":"can you access all my get hub report and all the work flows inside them and tell me the status of each workflow","history":[]}' \
            https://nandi-voice-agent-test.gopi-alerts-3859dc2239de.workers.dev/api/ask)"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"type":"tool"'
          printf '%s' "$response" | grep -q '"tool":"github"'
          printf '%s' "$response" | grep -q '"status":"complete"'
          printf '%s' "$response" | grep -q 'rntlgopinath57/OmniRoute'
          printf '%s' "$response" | grep -q 'rntlgopinath57/gopi_alerts'
          printf '%s' "$response" | grep -q 'rntlgopinath57/safeqr'
          ! printf '%s' "$response" | grep -qi "don't have the ability to access.*github"

      - name: Record verified deployment
        run: |
          printf '{"status":"GREEN","url":"https://nandi-voice-agent-test.gopi-alerts-3859dc2239de.workers.dev/nandi.html","source_commit":"%s","mode":"conversational-neural-voice","tts":"kokoro-js-1.2.1","barge_in":true,"echo_guard":true}\n' "$GITHUB_SHA" > ai-team-playground/nandi-deploy-status.json
          git config user.name "nandi-test-bot"
          git config user.email "nandi-test-bot@users.noreply.github.com"
          git add ai-team-playground/nandi-deploy-status.json
          git commit -m "Record verified Nandi test deployment [skip ci]"
          git push origin HEAD:nandi-voice-agent-v1
