name: Nandi Functional Agent Deploy

on:
  push:
    branches:
      - nandi-functional-v1
    paths:
      - "ai-team-playground/nandi.html"
      - "cloudflare/**"
      - "relay-runtime/**"
      - "wrangler.jsonc"
      - ".github/workflows/nandi-functional-test-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nandi-functional-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_GEMINI_BASE_URL: ${{ secrets.GOOGLE_GEMINI_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RELAY_GITHUB_TOKEN: ${{ secrets.RELAY_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: nandi-functional-v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate Nandi page
        run: |
          test -f ai-team-playground/nandi.html
          grep -q 'Hi Nandi' ai-team-playground/nandi.html
          grep -q 'SpeechRecognition' ai-team-playground/nandi.html
          grep -q '/api/ask' ai-team-playground/nandi.html
          grep -q 'NANDI_UI_V2' ai-team-playground/nandi.html
          grep -q 'LIVE TRACE' ai-team-playground/nandi.html
          grep -q '01 · LISTEN' ai-team-playground/nandi.html
          grep -q '02 · ROUTE' ai-team-playground/nandi.html
          grep -q '03 · ACT' ai-team-playground/nandi.html
          grep -q '04 · VERIFY' ai-team-playground/nandi.html
          grep -q '05 · RESPOND' ai-team-playground/nandi.html
          grep -q 'listenPulse' ai-team-playground/nandi.html
          grep -q 'verifyScan' ai-team-playground/nandi.html
          grep -q 'wave' ai-team-playground/nandi.html
          ! grep -q 'nandi-shiva-cinematic' ai-team-playground/nandi.html
          ! grep -q 'sketchfab' ai-team-playground/nandi.html
          ! grep -q 'three.module' ai-team-playground/nandi.html

      - name: Deploy isolated Nandi worker
        run: |
          npx --yes wrangler@latest deploy --config wrangler.jsonc --name nandi-functional-test

      - name: Sync configured Relay secrets
        shell: bash
        run: |
          put_secret () {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Skipped $key"
              return 0
            fi
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$key" --name nandi-functional-test >/dev/null
            echo "Synced $key"
          }
          put_secret OPENAI_BASE_URL "$OPENAI_BASE_URL"
          put_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          put_secret ANTHROPIC_BASE_URL "$ANTHROPIC_BASE_URL"
          put_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          put_secret GOOGLE_GEMINI_BASE_URL "$GOOGLE_GEMINI_BASE_URL"
          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret OPENROUTER_BASE_URL "$OPENROUTER_BASE_URL"
          put_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put_secret GROQ_API_KEY "$GROQ_API_KEY"
          put_secret RELAY_GITHUB_TOKEN "$RELAY_GITHUB_TOKEN"

      - name: Smoke Nandi page
        run: |
          for attempt in 1 2 3 4 5 6; do
            if body="$(curl --location --fail --silent --show-error https://nandi-functional-test.gopi-alerts-3859dc2239de.workers.dev/nandi)"; then
              if printf '%s' "$body" | grep -q 'NANDI' \
                && printf '%s' "$body" | grep -q 'LIVE FLOW' \
                && printf '%s' "$body" | grep -q 'Ask Nandi anything' \
                && printf '%s' "$body" | grep -q 'listenPulse' \
                && printf '%s' "$body" | grep -q '/api/ask'; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Browser verify animated agent states
        shell: bash
        run: |
          rm -rf /tmp/nandi-functional-pw
          mkdir -p /tmp/nandi-functional-pw
          cd /tmp/nandi-functional-pw
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install chromium
          cat > nandi-functional.spec.js <<'NODE'
          const { test, expect } = require('@playwright/test');

          test('Nandi functional shell animates real agent states', async ({ page }) => {
            await page.goto('https://nandi-functional-test.gopi-alerts-3859dc2239de.workers.dev/nandi', { waitUntil: 'networkidle' });

            await expect(page.locator('#agent')).toHaveClass(/idle/);
            await expect(page.locator('.agent-zone')).toBeVisible();
            await expect(page.locator('.pipeline')).toBeVisible();
            await expect(page.locator('.composer')).toBeVisible();
            await expect(page.locator('.activity')).toBeVisible();
            const uiMarker = await page.locator('html').evaluate(() => document.documentElement.outerHTML.includes('NANDI_UI_V2'));
            expect(uiMarker).toBeTruthy();
            await expect(page.locator('[data-stage="listen"]')).toBeVisible();
            await expect(page.locator('[data-stage="route"]')).toBeVisible();
            await expect(page.locator('[data-stage="act"]')).toBeVisible();
            await expect(page.locator('[data-stage="verify"]')).toBeVisible();
            await expect(page.locator('[data-stage="respond"]')).toBeVisible();

            await page.locator('#micBtn').click();
            await expect(page.locator('#agent')).toHaveClass(/wake|listening/, { timeout: 3000 });

            const animationNames = await page.evaluate(() => {
              const agent = document.querySelector('#agent');
              const core = document.querySelector('.core');
              const waveBar = document.querySelector('.wave i');
              return {
                agentClass: agent?.className || '',
                coreAnimation: getComputedStyle(core).animationName,
                waveAnimation: getComputedStyle(waveBar).animationName,
              };
            });
            expect(animationNames.agentClass).toMatch(/wake|listening/);
            expect(animationNames.coreAnimation).not.toBe('none');

            await page.evaluate(() => {
              const a = document.querySelector('#agent');
              a.className = 'agent routing';
            });
            const ringAnimation = await page.locator('.ring.r1').evaluate(el => getComputedStyle(el).animationName);
            expect(ringAnimation).toBe('spin');

            await page.evaluate(() => {
              const a = document.querySelector('#agent');
              a.className = 'agent verifying';
            });
            const verifyAnimation = await page.locator('.ring.r3').evaluate(el => getComputedStyle(el).animationName);
            expect(verifyAnimation).toBe('verifyScan');
          });
          NODE
          npx playwright test nandi-functional.spec.js --workers=1 --reporter=line

      - name: Verify real Relay response
        shell: bash
        run: |
          response="$(curl --location --fail --silent --show-error --max-time 65 \
            -H 'Content-Type: application/json' \
            --data '{"question":"Reply briefly with: Nandi functional agent is working.","history":[]}' \
            https://nandi-functional-test.gopi-alerts-3859dc2239de.workers.dev/api/ask)"
          printf '%s\n' "$response"
          ! printf '%s' "$response" | grep -q '"type":"error"'
          printf '%s' "$response" | grep -q '"type":"planner"'
          printf '%s' "$response" | grep -Eq '"type":"worker"|"type":"worker_selected"'
          printf '%s' "$response" | grep -q '"type":"done"'
          printf '%s' "$response" | grep -q '"answer"'

      - name: Record verified deployment
        run: |
          printf '{"status":"GREEN","url":"https://nandi-functional-test.gopi-alerts-3859dc2239de.workers.dev/nandi.html","source_commit":"%s","mode":"functional-animated"}\n' "$GITHUB_SHA" > ai-team-playground/nandi-deploy-status.json
          git config user.name "nandi-test-bot"
          git config user.email "nandi-test-bot@users.noreply.github.com"
          git add ai-team-playground/nandi-deploy-status.json
          git commit -m "Record verified Nandi test deployment [skip ci]"
          git push origin HEAD:nandi-functional-v1
