name: Nandi LiveKit Proof

on:
  push:
    branches:
      - nandi-livekit-proof
    paths:
      - "livekit-nandi/**"
      - ".github/workflows/nandi-livekit-proof.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nandi-livekit-proof
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      SECRET_LIST: GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},RELAY_GITHUB_TOKEN=${{ secrets.RELAY_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: nandi-livekit-proof
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate proof source
        shell: bash
        run: |
          test -n "$LIVEKIT_URL"
          test -n "$LIVEKIT_API_KEY"
          test -n "$LIVEKIT_API_SECRET"
          test -n "${{ secrets.GROQ_API_KEY }}"
          test -n "${{ secrets.RELAY_GITHUB_TOKEN }}"
          python -m py_compile livekit-nandi/agent.py
          grep -q 'agent_name="nandi-livekit-proof"' livekit-nandi/agent.py
          grep -q 'whisper-large-v3-turbo' livekit-nandi/agent.py
          grep -q 'silero.VAD.load' livekit-nandi/agent.py
          grep -q 'check_gopi_alerts' livekit-nandi/agent.py
          grep -q 'show_workflows' livekit-nandi/agent.py

      - name: Create LiveKit agent
        if: ${{ hashFiles('livekit-nandi/livekit.toml') == '' }}
        uses: livekit/deploy-action@v2
        with:
          OPERATION: create
          WORKING_DIRECTORY: livekit-nandi

      - name: Deploy existing LiveKit agent
        if: ${{ hashFiles('livekit-nandi/livekit.toml') != '' }}
        uses: livekit/deploy-action@v2
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: livekit-nandi

      - name: Wait for LiveKit agent
        uses: livekit/deploy-action@v2
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: livekit-nandi
          TIMEOUT: 5m

      - name: Preserve generated LiveKit config
        shell: bash
        run: |
          if [ -f livekit-nandi/livekit.toml ] && ! git ls-files --error-unmatch livekit-nandi/livekit.toml >/dev/null 2>&1; then
            git config user.name "nandi-livekit-bot"
            git config user.email "nandi-livekit-bot@users.noreply.github.com"
            git add livekit-nandi/livekit.toml
            git commit -m "Record Nandi LiveKit proof deployment [skip ci]"
            git push origin HEAD:nandi-livekit-proof
          else
            echo "LiveKit config already tracked"
          fi

      - name: Proof summary
        run: |
          echo "NANDI_LIVEKIT_AGENT: RUNNING"
          echo "AGENT_NAME: nandi-livekit-proof"
          echo "VOICE_RUNTIME: LiveKit WebRTC + Silero VAD + Groq STT/LLM/TTS"
