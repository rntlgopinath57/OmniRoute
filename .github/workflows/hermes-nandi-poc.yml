name: Hermes Nandi POC

on:
  push:
    branches: [release/v3.8.51]
    paths: ['.github/workflows/hermes-nandi-poc.yml'] # poc-trigger-11
  workflow_dispatch:
    inputs:
      ref:
        description: "POC branch/ref to test"
        required: true
        default: "spike/hermes-nandi-poc-20260925"

permissions:
  contents: read

concurrency:
  group: hermes-nandi-poc
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_GEMINI_BASE_URL: ${{ secrets.GOOGLE_GEMINI_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RELAY_GITHUB_TOKEN: ${{ secrets.RELAY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/hermes-nandi-poc-20260925
      - name: Guard isolated ref
        run: test "$(git branch --show-current)" = "spike/hermes-nandi-poc-20260925"
      - name: Require Nandi credentials
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$RELAY_GITHUB_TOKEN"
      - name: Install Hermes
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          hermes --version
      - name: Load Nandi skill
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.hermes/skills/nandi-repo-check"
          cp experiments/hermes-nandi/skills/nandi-repo-check/SKILL.md "$HOME/.hermes/skills/nandi-repo-check/SKILL.md"
          cp experiments/hermes-nandi/skills/nandi-repo-check/check_repo.py "$HOME/.hermes/skills/nandi-repo-check/check_repo.py"
          hermes skills list | tee /tmp/hermes-skills.txt
          grep -q 'nandi-repo-check' /tmp/hermes-skills.txt
      - name: Configure native Gemini
        run: |
          mkdir -p "$HOME/.hermes"
          cat > "$HOME/.hermes/config.yaml" <<'YAML'
          model:
            default: gemini-3.8-flash
            provider: gemini
            base_url: https://generativelanguage.googleapis.com/v1beta
          skills:
            inline_shell: true
            inline_shell_timeout: 20
          YAML
      - name: Isolate Nandi runtime
        run: |
          mkdir -p /tmp/hermes-nandi-runtime
          printf "Nandi POC isolated read-only runtime.\n" > /tmp/hermes-nandi-runtime/AGENTS.md
      - name: Capture expected GitHub evidence
        id: gopi
        run: |
          sha="$(curl --fail --silent -H "Authorization: Bearer $RELAY_GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/rntlgopinath57/gopi_alerts/commits/main | python -c "import sys,json; print(json.load(sys.stdin)['sha'])")"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_GOPI_SHA=$sha"
      - name: Nandi end-to-end task
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set -o pipefail
          (cd /tmp/hermes-nandi-runtime && hermes chat --oneshot --provider gemini --model gemini-3.8-flash --toolsets skills -s nandi-repo-check -q "Nandi, check Gopi Alerts. Use only the live evidence injected by the nandi-repo-check skill. Return repository, default branch, exact latest commit SHA, commit time, and PASS or FAIL." | tee /tmp/nandi-e2e.txt)
          grep -q "rntlgopinath57/gopi_alerts" /tmp/nandi-e2e.txt
          grep -q "main" /tmp/nandi-e2e.txt
          grep -q "${{ steps.gopi.outputs.sha }}" /tmp/nandi-e2e.txt
          grep -q "PASS" /tmp/nandi-e2e.txt
          echo "NANDI_E2E: PASS"
