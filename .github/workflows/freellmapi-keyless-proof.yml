name: FreeLLMAPI Keyless Provider Proof

on:
  push:
    branches:
      - probe/freellmapi-relay-20260919
    paths:
      - ".github/workflows/freellmapi-keyless-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove keyless providers with synthetic prompt only
        shell: bash
        run: |
          set -euo pipefail
          ENC="$(openssl rand -hex 32)"
          docker pull ghcr.io/tashfeenahmed/freellmapi:latest >/dev/null
          docker run -d --name freellmapi-keyless             -p 127.0.0.1:3001:3001             -e NODE_ENV=production             -e PORT=3001             -e ENCRYPTION_KEY="$ENC"             -e FALLBACK_TIME_BUDGET_MS=18000             -e FALLBACK_DETAIL_HEADER=1             ghcr.io/tashfeenahmed/freellmapi:latest >/dev/null
          trap 'docker rm -f freellmapi-keyless >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 45); do
            curl -fsS --max-time 3 http://127.0.0.1:3001/api/ping >/dev/null && break
            [ "$i" -lt 45 ] || { echo "BOOT_RED"; exit 10; }
            sleep 2
          done
          echo "BOOT_GREEN"

          CODE="$(docker logs freellmapi-keyless 2>&1 | sed -n 's/.*First-run setup code: //p' | tail -1 | tr -d '\r')"
          test -n "$CODE"
          python - "$CODE" <<'PY' > /tmp/setup.json
          import json,sys
          print(json.dumps({"email":"keyless-proof@example.com","password":"keyless-proof-2026","setupCode":sys.argv[1]}))
          PY
          curl -fsS --max-time 10 -H 'Content-Type: application/json' --data-binary @/tmp/setup.json             http://127.0.0.1:3001/api/auth/setup > /tmp/setup-response.json
          DASH="$(python -c 'import json; print(json.load(open("/tmp/setup-response.json"))["token"])')"

          curl -fsS --max-time 10 -H "Authorization: Bearer $DASH"             http://127.0.0.1:3001/api/settings/api-key > /tmp/apikey.json
          UNIFIED="$(python -c 'import json; print(json.load(open("/tmp/apikey.json"))["apiKey"])')"
          test -n "$UNIFIED"

          : > /tmp/keyless-ids.tsv
          for P in kilo ovh aihorde; do
            HTTP="$(curl -sS --max-time 10 -w '%{http_code}' -o "/tmp/add-$P.json"               -H "Authorization: Bearer $DASH"               -H 'Content-Type: application/json'               -d "{\"platform\":\"$P\",\"label\":\"keyless-proof\"}"               http://127.0.0.1:3001/api/keys)"
            echo "ADD_$P HTTP=$HTTP BODY=$(cat /tmp/add-$P.json)"
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
              ID="$(python -c "import json; print(json.load(open('/tmp/add-$P.json'))['id'])")"
              printf '%s\t%s\n' "$P" "$ID" >> /tmp/keyless-ids.tsv
            fi
          done

          COUNT="$(wc -l < /tmp/keyless-ids.tsv | tr -d ' ')"
          echo "KEYLESS_CONFIGURED=$COUNT"
          test "$COUNT" -ge 2

          curl -fsS --max-time 10 -H "Authorization: Bearer $UNIFIED"             http://127.0.0.1:3001/v1/providers > /tmp/providers.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/providers.json"))
          rows=d.get("providers",[])
          wanted={"kilo","ovh","aihorde"}
          safe=[(x.get("platform"),x.get("status"),x.get("keys")) for x in rows if x.get("platform") in wanted]
          print("KEYLESS_PROVIDER_STATUS",safe)
          if len(safe)<2:
              raise SystemExit("Fewer than two keyless providers visible")
          PY

          curl -fsS --max-time 15 -H "Authorization: Bearer $UNIFIED"             'http://127.0.0.1:3001/v1/models?available=true' > /tmp/models.json
          python - <<'PY'
          import json
          rows=json.load(open("/tmp/models.json")).get("data",[])
          print("KEYLESS_AVAILABLE_MODELS",len(rows))
          print("KEYLESS_SAMPLE_MODELS",[x.get("id") for x in rows[:10]])
          if not rows:
              raise SystemExit("No models available from keyless pool")
          PY

          python - <<'PY' > /tmp/request.json
          import json
          print(json.dumps({
              "model":"auto:fast",
              "messages":[{"role":"user","content":"Synthetic connectivity test. Reply with exactly KEYLESS_POOL_OK and nothing else."}],
              "max_tokens":24,
              "temperature":0
          }))
          PY

          set +e
          HTTP="$(curl -sS --max-time 35 -w '%{http_code}' -D /tmp/headers.txt -o /tmp/response.json             -H "Authorization: Bearer $UNIFIED"             -H 'Content-Type: application/json'             --data-binary @/tmp/request.json             http://127.0.0.1:3001/v1/chat/completions)"
          RC=$?
          set -e
          echo "KEYLESS_CHAT_RC=$RC HTTP=$HTTP"
          [ -f /tmp/response.json ] && python -c 'import pathlib; print("KEYLESS_CHAT_BODY",pathlib.Path("/tmp/response.json").read_text()[:700])' || true
          awk 'BEGIN{IGNORECASE=1} /^x-routed-via:|^x-fallback-attempts:|^x-fallback-trail:|^x-fallback-detail:/{gsub("\r",""); print}' /tmp/headers.txt || true
          [ "$RC" -eq 0 ] && [ "$HTTP" = "200" ] || exit 21

          python -c 'import json; d=json.load(open("/tmp/response.json")); t=((d.get("choices") or [{}])[0].get("message") or {}).get("content","").strip(); print("KEYLESS_RESPONSE",t[:120]); assert "KEYLESS_POOL_OK" in t'
          ROUTED="$(awk 'BEGIN{IGNORECASE=1} /^x-routed-via:/{sub(/^[^:]+:[[:space:]]*/,""); gsub("\r",""); print; exit}' /tmp/headers.txt)"
          test -n "$ROUTED"
          echo "KEYLESS_ROUTED_VIA=$ROUTED"
          case "$ROUTED" in
            kilo/*|ovh/*|aihorde/*) ;;
            *) echo "Unexpected non-keyless provider $ROUTED"; exit 22 ;;
          esac
          echo "KEYLESS_PROOF_GREEN"
