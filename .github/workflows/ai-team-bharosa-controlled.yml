name: AI Team Bharosa Controlled Test

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Bharosa branch or commit to audit
        required: true
        default: main
        type: string
  push:
    branches:
      - release/v3.8.51
    paths:
      - '.github/workflows/ai-team-bharosa-controlled.yml'

permissions:
  contents: read

jobs:
  bharosa-readonly-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BHAROSA_READ_TOKEN: ${{ secrets.BHAROSA_READ_TOKEN }}
    steps:
      - name: Require private-repository read credential
        shell: bash
        run: |
          if [ -z "$BHAROSA_READ_TOKEN" ]; then
            echo "BHAROSA_READ_TOKEN is required because safeqr is a private repository."
            exit 1
          fi

      - name: Checkout AI Team control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Bharosa target read-only
        uses: actions/checkout@v4
        with:
          repository: rntlgopinath57/safeqr
          ref: ${{ inputs.target_ref || 'main' }}
          path: target-project
          token: ${{ secrets.BHAROSA_READ_TOKEN }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Run controlled Bharosa project audit
        env:
          AI_TEAM_TARGET_ROOT: target-project
          AI_TEAM_TARGET_BRANCH: ${{ inputs.target_ref || 'main' }}
        run: node ai-team/automation/run.mjs bharosa-readonly-baseline
