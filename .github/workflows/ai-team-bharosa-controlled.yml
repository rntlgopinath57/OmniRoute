name: AI Team Bharosa Controlled Test

on:
  push:
    branches:
      - "release/v3.8.51"
    paths:
      - "ai-team/src/automation-catalog.mjs"
      - "ai-team/src/automation-runner.mjs"
      - "ai-team/automation/run.mjs"
      - ".github/workflows/ai-team-bharosa-controlled.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bharosa-readonly-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout AI Team control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Bharosa target read-only
        uses: actions/checkout@v4
        with:
          repository: rntlgopinath57/safeqr
          ref: main
          path: target-project
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Run controlled Bharosa project audit
        env:
          AI_TEAM_TARGET_ROOT: target-project
          AI_TEAM_TARGET_BRANCH: main
        run: node ai-team/automation/run.mjs bharosa-readonly-baseline
