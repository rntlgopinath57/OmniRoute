name: Nandi LiveKit Runtime Diagnose

on:
  push:
    branches:
      - nandi-livekit-proof
    paths:
      - ".github/workflows/nandi-livekit-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nandi-livekit-proof
      - name: Install LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash
      - name: Verify Groq Orpheus directly
        shell: bash
        run: |
          short='Gopi Alerts is verified. Status pass.'
          long="$(python -c "print('This is a bounded voice response test. ' * 8)")"
          short_code="$(curl -sS -o /tmp/orpheus-short.wav -w '%{http_code}' https://api.groq.com/openai/v1/audio/speech \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(python -c 'import json,sys; print(json.dumps({"model":"canopylabs/orpheus-v1-english","voice":"daniel","input":sys.argv[1],"response_format":"wav"}))' "$short")")"
          echo "ORPHEUS_SHORT_HTTP=$short_code"
          test "$short_code" = "200"
          long_code="$(curl -sS -o /tmp/orpheus-long.out -w '%{http_code}' https://api.groq.com/openai/v1/audio/speech \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(python -c 'import json,sys; print(json.dumps({"model":"canopylabs/orpheus-v1-english","voice":"daniel","input":sys.argv[1],"response_format":"wav"}))' "$long")")"
          echo "ORPHEUS_LONG_HTTP=$long_code"
          echo "ORPHEUS_LONG_CHARS=${#long}"

      - name: Capture recent Nandi runtime logs
        shell: bash
        run: |
          set +e
          timeout 15s lk agent logs --id CA_YT7UoRxEaQ5J --log-type deploy 2>&1 | tee /tmp/nandi-livekit-runtime.log
          test -s /tmp/nandi-livekit-runtime.log
          echo "NANDI_RUNTIME_LOG_CAPTURED"
