name: Nandi LiveKit Runtime Diagnose

on:
  push:
    branches:
      - nandi-livekit-proof
    paths:
      - ".github/workflows/nandi-livekit-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nandi-livekit-proof
      - name: Install LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash
      - name: Verify Groq Orpheus directly
        shell: bash
        run: |
          curl -sS https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer $GROQ_API_KEY" > /tmp/groq-models.json
          python - <<'PY'
import json
data=json.load(open('/tmp/groq-models.json'))
ids=[m.get('id','') for m in data.get('data',[])]
print('ORPHEUS_MODEL_VISIBLE=' + str('canopylabs/orpheus-v1-english' in ids).lower())
print('GPT_OSS_MODEL_VISIBLE=' + str('openai/gpt-oss-120b' in ids).lower())
PY
          short='Gopi Alerts is verified. Status pass.'
          for voice in daniel troy autumn; do
            code="$(curl -sS -o "/tmp/orpheus-${voice}.out" -w '%{http_code}' https://api.groq.com/openai/v1/audio/speech \
              -H "Authorization: Bearer $GROQ_API_KEY" \
              -H 'Content-Type: application/json' \
              --data "$(python -c 'import json,sys; print(json.dumps({"model":"canopylabs/orpheus-v1-english","voice":sys.argv[1],"input":sys.argv[2],"response_format":"wav"}))' "$voice" "$short")")"
            echo "ORPHEUS_${voice^^}_HTTP=$code"
            if [ "$code" != "200" ]; then
              echo "ORPHEUS_${voice^^}_BODY=$(cat "/tmp/orpheus-${voice}.out")"
            fi
          done

      - name: Capture recent Nandi runtime logs
        shell: bash
        run: |
          set +e
          timeout 15s lk agent logs --id CA_YT7UoRxEaQ5J --log-type deploy 2>&1 | tee /tmp/nandi-livekit-runtime.log
          test -s /tmp/nandi-livekit-runtime.log
          echo "NANDI_RUNTIME_LOG_CAPTURED"
