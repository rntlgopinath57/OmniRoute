name: AI Team Project Automation

on:
  pull_request:
    branches:
      - "release/v3.8.51"
    paths:
      - "ai-team/src/automation-*.mjs"
      - "ai-team/automation/**"
      - "ai-team/tests/automation-*.test.mjs"
      - ".github/workflows/ai-team-project-automation.yml"
  push:
    branches:
      - "release/v3.8.51"
    paths:
      - "ai-team/src/automation-*.mjs"
      - "ai-team/automation/**"
      - "ai-team/tests/automation-*.test.mjs"
      - ".github/workflows/ai-team-project-automation.yml"
  workflow_dispatch:
    inputs:
      job_id:
        description: Read-only project automation to run
        required: true
        default: omniroute-readiness
        type: choice
        options:
          - omniroute-readiness

permissions:
  contents: read

concurrency:
  group: ai-team-project-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-project-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"

      - name: Run read-only project automation
        env:
          AUTOMATION_ID: ${{ inputs.job_id || 'omniroute-readiness' }}
        run: node ai-team/automation/run.mjs "$AUTOMATION_ID"
