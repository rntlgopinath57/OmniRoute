name: AI Team Config Guard

on:
  pull_request:
    paths:
      - "config/ai-team/**"
      - "skills/**"
      - "scripts/ai-team/**"
      - "scripts/check/validate-ai-team-config.mjs"
      - "scripts/check/ai-team-runtime-smoke.mjs"
      - ".github/workflows/ai-team-config.yml"
  push:
    branches:
      - "feat/ai-team-runtime-v1"
    paths:
      - "config/ai-team/**"
      - "skills/**"
      - "scripts/ai-team/**"
      - "scripts/check/validate-ai-team-config.mjs"
      - "scripts/check/ai-team-runtime-smoke.mjs"
      - ".github/workflows/ai-team-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Validate AI Team policy and capability registry
        run: node scripts/check/validate-ai-team-config.mjs
      - name: Run AI Team deterministic routing smoke tests
        run: node scripts/check/ai-team-runtime-smoke.mjs
