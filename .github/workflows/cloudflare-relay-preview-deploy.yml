name: Relay Cloudflare Preview Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - infra/cloudflare-relay
    paths:
      - "cloudflare/**"
      - "relay-runtime/**"
      - "netlify/functions/**"
      - "ai-team-playground/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-relay-preview-deploy.yml"

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_GEMINI_BASE_URL: ${{ secrets.GOOGLE_GEMINI_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RELAY_GITHUB_TOKEN: ${{ secrets.RELAY_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Validate bundle before deploy
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir .cloudflare-dry-run

      - name: Deploy preview worker
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@latest deploy             --config wrangler.jsonc             --name relay-ai-team-preview | tee deploy.log
          url="$(grep -Eo 'https://[^ ]+\.workers\.dev' deploy.log | tail -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${url:-not detected}"

      - name: Sync configured Relay secrets
        run: |
          put_secret () {
            key="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@latest secret put "$key" --name relay-ai-team-preview >/dev/null
              echo "Synced $key"
            else
              echo "Skipped $key (not configured in GitHub Actions secrets)"
            fi
          }

          put_secret OPENAI_BASE_URL "$OPENAI_BASE_URL"
          put_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          put_secret ANTHROPIC_BASE_URL "$ANTHROPIC_BASE_URL"
          put_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          put_secret GOOGLE_GEMINI_BASE_URL "$GOOGLE_GEMINI_BASE_URL"
          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret OPENROUTER_BASE_URL "$OPENROUTER_BASE_URL"
          put_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put_secret RELAY_GITHUB_TOKEN "$RELAY_GITHUB_TOKEN"

      - name: Smoke health endpoint
        if: steps.deploy.outputs.url != ''
        run: |
          url="${{ steps.deploy.outputs.url }}/api/health"
          for attempt in 1 2 3 4 5 6; do
            if body="$(curl --fail --show-error --silent "$url")"; then
              echo "$body"
              exit 0
            fi
            echo "Health check attempt $attempt failed; waiting for Worker propagation..."
            sleep 5
          done
          echo "Health endpoint did not become ready."
          exit 1

      - name: Smoke Gemini Relay prompt
        if: steps.deploy.outputs.url != '' && env.GEMINI_API_KEY != ''
        run: |
          url="${{ steps.deploy.outputs.url }}/api/ask"
          response="$(curl --fail --show-error --silent             -H 'Content-Type: application/json'             -d '{"question":"Research task: reply with exactly CLOUDFLARE_RELAY_OK and nothing else.","history":[]}'             "$url")"
          echo "$response"
          echo "$response" | grep -q '"type":"done"'
          echo "$response" | grep -q 'CLOUDFLARE_RELAY_OK'

      - name: Verify progressive Relay UI
        if: steps.deploy.outputs.url != ''
        run: |
          html="$(curl --fail --show-error --silent "${{ steps.deploy.outputs.url }}/")"
          echo "$html" | grep -q 'id="runStrip"'
          echo "$html" | grep -q 'id="runToggle"'
          echo "$html" | grep -q 'View run'
          echo "$html" | grep -q 'id="canvas"'
          echo "$html" | grep -q 'id="runToggle"'
          echo "Conversation-first UI with ambient execution canvas verified."

      - name: Verify media capabilities
        if: steps.deploy.outputs.url != '' && env.GEMINI_API_KEY != ''
        run: |
          response="$(curl --fail --show-error --silent             -H 'Content-Type: application/json'             -d '{"action":"capabilities"}'             "${{ steps.deploy.outputs.url }}/api/media")"
          echo "$response"
          echo "$response" | grep -q '"imageGeneration":true'
          echo "$response" | grep -q '"videoGeneration":true'
          echo "$response" | grep -q '"serverGeminiConfigured":true'

      - name: Verify flowchart presentation contract
        if: steps.deploy.outputs.url != '' && env.GEMINI_API_KEY != ''
        run: |
          response="$(curl --fail --show-error --silent             -H 'Content-Type: application/json'             -d '{"question":"/flowchart Show a simple three-step release process: validate, deploy, verify.","history":[]}'             "${{ steps.deploy.outputs.url }}/api/ask")"
          echo "$response"
          echo "$response" | grep -q '"type":"done"'
          echo "$response" | grep -q '"format":"flowchart"'
          echo "$response" | grep -q '"review":"PASS"'
          if echo "$response" | grep -Eq 'flowchart (TD|LR|TB|RL)|graph (TD|LR|TB|RL)|[A-Za-z0-9_]+--?>[A-Za-z0-9_]+|[│▼▲├└┬┴┼─]{2,}|[-=]{2,}>'; then
            echo "Raw diagram source leaked into presentation answer."
            exit 1
          fi

      - name: Verify GitHub workflow inventory path
        if: steps.deploy.outputs.url != '' && env.GEMINI_API_KEY != ''
        run: |
          response="$(curl --fail --show-error --silent             -H 'Content-Type: application/json'             -d '{"question":"List my GitHub workflows by repository. Keep it concise.","history":[]}'             "${{ steps.deploy.outputs.url }}/api/ask")"
          echo "$response"
          echo "$response" | grep -q '"type":"tool","tool":"github","status":"complete"'
          echo "$response" | grep -q '"type":"done"'
          echo "$response" | grep -q '"format":"default"'
          echo "$response" | grep -q 'bharosa-reliability.yml'
          echo "$response" | grep -q 'daily-briefing.yml'
          echo "$response" | grep -q 'ai-team-activation.yml'

      - name: Deployment summary
        run: |
          {
            echo "### Relay Cloudflare preview"
            echo
            if [ -n "${{ steps.deploy.outputs.url }}" ]; then
              echo "- URL: ${{ steps.deploy.outputs.url }}"
            else
              echo "- URL: inspect the deploy step output"
            fi
            echo "- Static UI served from Cloudflare assets"
            echo "- Worker runs only for /api/*"
            echo "- Production traffic was not changed"
          } >> "$GITHUB_STEP_SUMMARY"
