name: Relay Cloudflare Preview Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "35 2 * * *" # 08:05 IST daily runtime verification
  push:
    branches:
      - infra/cloudflare-relay
      - release/v3.8.51
    paths:
      - "cloudflare/**"
      - "relay-runtime/**"
      - "netlify/functions/**"
      - "ai-team-playground/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-relay-preview-deploy.yml"

permissions:
  contents: read

concurrency:
  group: relay-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    uses: ./.github/workflows/cloudflare-relay-preview-runtime.yml
    secrets: inherit
