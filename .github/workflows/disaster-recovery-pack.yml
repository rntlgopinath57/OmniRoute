name: Disaster Recovery Pack
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/disaster-recovery-pack.yml'
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build recovery pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-pack
          repo="${GITHUB_REPOSITORY#*/}"
          git bundle create "recovery-pack/${repo}.bundle" --all
          git archive --format=tar.gz -o "recovery-pack/${repo}-working-tree.tar.gz" HEAD
          git rev-parse HEAD > "recovery-pack/HEAD.txt"
          git branch -a > "recovery-pack/branches.txt"
          git tag -l > "recovery-pack/tags.txt"
          sha256sum recovery-pack/* > recovery-pack/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: disaster-recovery-${{ github.event.repository.name }}
          path: recovery-pack/
          retention-days: 90
          compression-level: 0
