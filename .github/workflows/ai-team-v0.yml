name: AI Team v0 Core

on:
  workflow_dispatch:
  push:
    branches: [release/v3.8.51]
    paths:
      - '.github/workflows/ai-team-v0.yml'

permissions:
  contents: read
  actions: write

jobs:
  core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Run isolated AI Team tests
        run: node --test ai-team/tests/*.test.mjs

      - name: Smoke test task intake
        run: node ai-team/src/main.mjs '{"task":"Review Bharosa security","type":"analysis"}'

      - name: One-time prune obsolete workflow history
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current = int(os.environ["CURRENT_RUN_ID"])
          keep = {
              "AI Team Bharosa Controlled Test",
              "AI Team Project Automation",
              "AI Team Universal Audit",
              "AI Team v0 Core",
              "Relay Cloudflare Preview Deploy",
              "Relay Safety Check",
          }
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deleted = 0
          for page in range(1, 15):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  runs = json.load(resp).get("workflow_runs", [])
              if not runs:
                  break
              for run in runs:
                  if run.get("id") == current or run.get("status") != "completed":
                      continue
                  if run.get("name") in keep:
                      continue
                  dreq = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}",
                      headers=headers,
                      method="DELETE",
                  )
                  with urllib.request.urlopen(dreq, timeout=20):
                      pass
                  deleted += 1
          print(f"Deleted {deleted} completed runs belonging to obsolete workflows.")

