name: AI Team v0 Core

on:
  push:
    branches: [release/v3.8.51]
    paths:
      - '.github/workflows/ai-team-v0.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup-obsolete-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prune obsolete workflow runs until stable
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          current=int(os.environ["CURRENT_RUN_ID"])
          keep={
            "AI Team Bharosa Controlled Test",
            "AI Team Project Automation",
            "AI Team Universal Audit",
            "AI Team v0 Core",
            "Relay Cloudflare Preview Deploy",
            "Relay Safety Check",
          }
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          deleted=0
          while True:
            req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/runs?per_page=100&page=1",headers=headers)
            with urllib.request.urlopen(req,timeout=20) as resp:
              runs=json.load(resp).get("workflow_runs",[])
            victims=[x for x in runs if x.get("id")!=current and x.get("status")=="completed" and x.get("name") not in keep]
            if not victims: break
            for run in victims:
              req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}",headers=headers,method="DELETE")
              with urllib.request.urlopen(req,timeout=20): pass
              deleted+=1
          print(f"Deleted {deleted} additional obsolete workflow runs.")
