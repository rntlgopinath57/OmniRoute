name: Reliability Flag Comparison

on:
  workflow_dispatch:
  pull_request:
    branches:
      - release/v3.8.51
    paths:
      - "ai-team/src/task.mjs"
      - "ai-team/tests/task.test.mjs"
      - ".github/workflows/reliability-flag-comparison.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Legacy path
        env:
          OMNI_RELIABILITY_V1: "0"
        run: |
          node ai-team/src/main.mjs '{"task":"Create a workflow every morning"}' > /tmp/legacy.json
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('/tmp/legacy.json')); if (x.acceptance !== undefined) process.exit(1); if (x.status !== 'success' || !x.route) process.exit(1)"
      - name: Reliability path
        env:
          OMNI_RELIABILITY_V1: "1"
        run: |
          node ai-team/src/main.mjs '{"task":"Create a workflow every morning"}' > /tmp/reliable.json
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('/tmp/reliable.json')); if (!x.acceptance?.ok || x.acceptance?.mode !== 'reliability-v1') process.exit(1); if (x.status !== 'success' || !x.route) process.exit(1)"
      - name: Compare invariant output
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync('/tmp/legacy.json')); const b=JSON.parse(fs.readFileSync('/tmp/reliable.json')); delete b.acceptance; if (JSON.stringify(a)!==JSON.stringify(b)) { console.error('legacy/reliability output drift'); process.exit(1) }"
