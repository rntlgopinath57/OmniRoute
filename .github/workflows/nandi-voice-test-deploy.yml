name: Nandi Immersive Test Deploy

on:
  push:
    branches:
      - nandi-immersive-v1
    paths:
      - "ai-team-playground/nandi.html"
      - "cloudflare/**"
      - "relay-runtime/**"
      - "wrangler.jsonc"
      - ".github/workflows/nandi-voice-test-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nandi-immersive-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_GEMINI_BASE_URL: ${{ secrets.GOOGLE_GEMINI_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RELAY_GITHUB_TOKEN: ${{ secrets.RELAY_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: nandi-immersive-v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate Nandi page
        run: |
          test -f ai-team-playground/nandi.html
          grep -q 'Hi Nandi' ai-team-playground/nandi.html
          grep -q 'SpeechRecognition' ai-team-playground/nandi.html
          grep -q '/api/ask' ai-team-playground/nandi.html
          # Visual regression guard: preserve the purpose-built Nandi scene.
          grep -q 'NANDI_SCENE_V5' ai-team-playground/nandi.html
          grep -q 'animation:nandiNodV2' ai-team-playground/nandi.html
          grep -q 'box-shadow:none' ai-team-playground/nandi.html
          grep -q 'id="nandi-figure"' ai-team-playground/nandi.html
          grep -q 'id="shiva-lingam"' ai-team-playground/nandi.html
          ! grep -q 'data:image/jpeg;base64' ai-team-playground/nandi.html
          ! grep -q 'commons.wikimedia.org' ai-team-playground/nandi.html

      - name: Verify self-contained Nandi scene
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('ai-team-playground/nandi.html','utf8');
          for (const marker of ['NANDI_SCENE_V5','id="nandi-figure"','id="shiva-lingam"','id="trident"','id="lamps"']) {
            if (!html.includes(marker)) throw new Error('missing scene marker: ' + marker);
          }
          if (html.includes('commons.wikimedia.org')) throw new Error('borrowed temple image dependency returned');
          if (html.includes('data:image/jpeg;base64')) throw new Error('raster scene dependency returned');
          if (!html.includes('<svg viewBox="0 0 1600 900"')) throw new Error('self-contained scene SVG missing');
          console.log('Self-contained Nandi scene verified');
          NODE

      - name: Deploy isolated Nandi worker
        run: |
          npx --yes wrangler@latest deploy --config wrangler.jsonc --name nandi-immersive-test

      - name: Sync configured Relay secrets
        shell: bash
        run: |
          put_secret () {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Skipped $key"
              return 0
            fi
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$key" --name nandi-immersive-test >/dev/null
            echo "Synced $key"
          }
          put_secret OPENAI_BASE_URL "$OPENAI_BASE_URL"
          put_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          put_secret ANTHROPIC_BASE_URL "$ANTHROPIC_BASE_URL"
          put_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          put_secret GOOGLE_GEMINI_BASE_URL "$GOOGLE_GEMINI_BASE_URL"
          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret OPENROUTER_BASE_URL "$OPENROUTER_BASE_URL"
          put_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put_secret GROQ_API_KEY "$GROQ_API_KEY"
          put_secret RELAY_GITHUB_TOKEN "$RELAY_GITHUB_TOKEN"

      - name: Smoke Nandi page
        run: |
          for attempt in 1 2 3 4 5 6; do
            if body="$(curl --location --fail --silent --show-error https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/nandi)"; then
              printf '%s' "$body" | grep -q 'NANDI'
              printf '%s' "$body" | grep -q 'Hi Nandi'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Record verified deployment
        run: |
          printf '{"status":"GREEN","url":"https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/nandi.html","source_commit":"%s"}\n' "$GITHUB_SHA" > ai-team-playground/nandi-deploy-status.json
          git config user.name "nandi-test-bot"
          git config user.email "nandi-test-bot@users.noreply.github.com"
          git add ai-team-playground/nandi-deploy-status.json
          git commit -m "Record verified Nandi test deployment [skip ci]"
          git push origin HEAD:nandi-immersive-v1
