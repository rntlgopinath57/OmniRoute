name: Nandi Phone Agent Deploy

on:
  push:
    branches:
      - nandi-immersive-v1
    paths:
      - "ai-team-playground/nandi.html"
      - "ai-team-playground/src/nandi-neural-voice.mjs"
      - "netlify/functions/ask.mts"
      - "netlify/functions/nandi.mts"
      - "netlify/functions/transcribe.mts"
      - "cloudflare/**"
      - "relay-runtime/**"
      - "wrangler.jsonc"
      - ".github/workflows/nandi-voice-test-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nandi-mobile-voice-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_GEMINI_BASE_URL: ${{ secrets.GOOGLE_GEMINI_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RELAY_GITHUB_TOKEN: ${{ secrets.RELAY_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nandi-immersive-v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Build mobile neural voice and server handlers
        shell: bash
        run: |
          rm -rf /tmp/nandi-build
          mkdir -p /tmp/nandi-build ai-team-playground/assets
          cd /tmp/nandi-build
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund --ignore-scripts kokoro-js@1.2.1 esbuild@0.28.2
          grep -q 'Apache License' node_modules/kokoro-js/LICENSE
          NODE_PATH=/tmp/nandi-build/node_modules ./node_modules/.bin/esbuild \
            "$GITHUB_WORKSPACE/ai-team-playground/src/nandi-neural-voice.mjs" \
            --bundle --format=esm --platform=browser --target=es2022 \
            --outfile="$GITHUB_WORKSPACE/ai-team-playground/assets/nandi-neural-voice.js"
          cd "$GITHUB_WORKSPACE"
          npx --yes esbuild@0.28.2 netlify/functions/ask.mts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/nandi-ask-check.mjs >/dev/null
          npx --yes esbuild@0.28.2 netlify/functions/nandi.mts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/nandi-runtime-check.mjs >/dev/null
          npx --yes esbuild@0.28.2 netlify/functions/transcribe.mts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/nandi-stt-check.mjs >/dev/null
          test "$(wc -c < ai-team-playground/assets/nandi-neural-voice.js)" -gt 100000

      - name: Validate mobile-first contract
        run: |
          grep -q 'NANDI_PHONE_AGENT_V1' ai-team-playground/nandi.html
          grep -q 'MediaRecorder' ai-team-playground/nandi.html
          grep -q '/api/transcribe' ai-team-playground/nandi.html
          grep -q '/api/nandi' ai-team-playground/nandi.html
          grep -q 'verified-skill-bridge-v1' netlify/functions/nandi.mts
          grep -q '/api/nandi' cloudflare/worker.ts
          grep -q 'NANDI_AUDIO_UNLOCK_V3_MOBILE' ai-team-playground/src/nandi-neural-voice.mjs
          grep -q 'MODEL_DTYPE = MOBILE_DEVICE ? "q4" : "q8"' ai-team-playground/src/nandi-neural-voice.mjs
          grep -q 'whisper-large-v3-turbo' netlify/functions/transcribe.mts
          grep -q '/api/transcribe' cloudflare/worker.ts
          grep -q 'LIVE GITHUB ACTIONS RUNS' netlify/functions/ask.mts
          grep -q 'liveWorkflowRuns' netlify/functions/ask.mts
          ! grep -q 'SpeechRecognition' ai-team-playground/nandi.html
          ! grep -q 'nandi-shiva-cinematic' ai-team-playground/nandi.html
          ! grep -q 'temple' ai-team-playground/nandi.html
          ! grep -q 'LIVE TRACE' ai-team-playground/nandi.html

      - name: Deploy isolated Nandi worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --name nandi-immersive-test

      - name: Sync configured Relay secrets
        shell: bash
        run: |
          put_secret () {
            key="$1"; value="$2"
            if [ -z "$value" ]; then echo "Skipped $key"; return 0; fi
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$key" --name nandi-immersive-test >/dev/null
            echo "Synced $key"
          }
          put_secret OPENAI_BASE_URL "$OPENAI_BASE_URL"
          put_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          put_secret ANTHROPIC_BASE_URL "$ANTHROPIC_BASE_URL"
          put_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          put_secret GOOGLE_GEMINI_BASE_URL "$GOOGLE_GEMINI_BASE_URL"
          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret OPENROUTER_BASE_URL "$OPENROUTER_BASE_URL"
          put_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put_secret GROQ_API_KEY "$GROQ_API_KEY"
          put_secret RELAY_GITHUB_TOKEN "$RELAY_GITHUB_TOKEN"

      - name: Smoke deployed mobile UI and APIs
        shell: bash
        run: |
          URL=https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev
          for attempt in 1 2 3 4 5 6; do
            body="$(curl --location --fail --silent --show-error "$URL/nandi" || true)"
            if printf '%s' "$body" | grep -q 'NANDI_PHONE_AGENT_V1' \
              && printf '%s' "$body" | grep -q 'MediaRecorder' \
              && printf '%s' "$body" | grep -q '/api/transcribe' \
              && ! printf '%s' "$body" | grep -q 'nandi-shiva-cinematic'; then
              break
            fi
            sleep 5
          done
          printf '%s' "$body" | grep -q 'NANDI_PHONE_AGENT_V1'
          code="$(curl --silent --output /tmp/stt.json --write-out '%{http_code}' -X POST -H 'X-Nandi-Voice: 1' "$URL/api/transcribe")"
          test "$code" = "400"
          grep -q 'Audio file is required\|Invalid audio upload\|Expected multipart audio upload' /tmp/stt.json

      - name: Verify Groq speech-to-text gateway
        shell: bash
        run: |
          python - <<'PY'
          import wave, math, struct
          rate=16000
          with wave.open('/tmp/nandi-probe.wav','wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              frames=[struct.pack('<h',int(1200*math.sin(2*math.pi*440*i/rate))) for i in range(rate)]
              w.writeframes(b''.join(frames))
          PY
          response="$(curl --fail --silent --show-error --max-time 35 -F 'file=@/tmp/nandi-probe.wav;type=audio/wav' https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/api/transcribe)"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"model":"whisper-large-v3-turbo"'
          printf '%s' "$response" | grep -q '"text"'

      - name: Guard STT against prompt hallucination
        shell: bash
        run: |
          ! grep -F 'Terms may include GitHub' netlify/functions/transcribe.mts
          ! grep -F 'upstream.append("prompt"' netlify/functions/transcribe.mts
          grep -F 'upstream.append("language", "en")' netlify/functions/transcribe.mts

      - name: Browser verify iPhone flow and talkback
        shell: bash
        run: |
          rm -rf /tmp/nandi-pw
          mkdir -p /tmp/nandi-pw
          cd /tmp/nandi-pw
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install --with-deps chromium webkit
          cat > nandi.spec.js <<'NODE'
          const { test, expect, webkit, devices } = require('@playwright/test');
          test.setTimeout(120000);
          const URL='https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev';

          test('phone UI completes a voice-answer turn without temple or Relay dashboard', async ({ page }) => {
            await page.route('**/assets/nandi-neural-voice.js', route => route.fulfill({
              contentType:'application/javascript',
              body:`window.NandiNeuralVoiceVersion='NANDI_NEURAL_VOICE_V1';window.NandiNeuralVoice={unlock:async()=>true,load:async()=>({}),status:()=>({ready:true,unlocked:true,dtype:'q4'}),cancel:()=>{},speak:async(t)=>{window.dispatchEvent(new CustomEvent('nandi-voice',{detail:{type:'start',text:t}}));await new Promise(r=>setTimeout(r,250));return true;}};`
            }));
            await page.route('**/api/nandi', route => route.fulfill({
              contentType:'application/x-ndjson',
              body:[
                JSON.stringify({type:'planner',taskType:'automation'}),
                JSON.stringify({type:'worker',model:'groq:qwen/qwen3.8-27b'}),
                JSON.stringify({type:'tool',tool:'nandi-repo-check',status:'complete',evidence:'github-live'}),
                JSON.stringify({type:'done',answer:'Gopi Alerts is verified. Status: PASS.',review:'PASS'})
              ].join('\n')+'\n'
            }));
            await page.goto(URL+'/nandi?nandi_test=1',{waitUntil:'domcontentloaded'});
            await expect(page.locator('#startBtn')).toBeVisible();
            await expect(page.locator('#presence')).toBeVisible();
            await expect(page.locator('img')).toHaveCount(0);
            await expect(page.locator('body')).not.toContainText('LIVE TRACE');
            await expect.poll(()=>page.evaluate(()=>Boolean(window.__NANDI_PHONE_TEST__)),{timeout:10000}).toBeTruthy();
            await page.evaluate(()=>window.__NANDI_PHONE_TEST__.simulateTranscript('Hi Nandi check Gopi Alerts'));
            await expect(page.locator('#answerText')).toContainText('Gopi Alerts is verified');
            await page.locator('#activity').click();
            await expect(page.locator('#drawer')).toHaveClass(/show/);
          });

          test('first spoken command works without requiring Hi Nandi', async ({ page }) => {
            await page.route('**/assets/nandi-neural-voice.js', route => route.fulfill({
              contentType:'application/javascript',
              body:`window.__spoken=[];window.NandiNeuralVoice={unlock:async()=>true,load:async()=>({}),status:()=>({ready:true,unlocked:true,dtype:'q4'}),cancel:()=>{},speak:async(t)=>{window.__spoken.push(t);return true;}};`
            }));
            await page.route('**/api/nandi', async route => {
              await new Promise(r=>setTimeout(r,700));
              await route.fulfill({
                contentType:'application/x-ndjson',
                body:[
                  JSON.stringify({type:'tool',tool:'nandi-repo-check',status:'complete',evidence:'github-live'}),
                  JSON.stringify({type:'done',answer:'Gopi Alerts is verified. Latest commit SHA: 1234567890123456789012345678901234567890. Status: PASS.',review:'PASS'})
                ].join('\n')+'\n'
              });
            });
            await page.goto(URL+'/nandi?nandi_test=1',{waitUntil:'domcontentloaded'});
            const turn=page.evaluate(()=>window.__NANDI_PHONE_TEST__.simulateTranscript('Check Gopi Alerts'));
            await expect.poll(()=>page.evaluate(()=>window.__spoken[0]||''),{timeout:1500}).toBe('Checking Gopi Alerts.');
            await turn;
            await expect(page.locator('#answerText')).toContainText('Latest commit SHA');
            await expect.poll(()=>page.evaluate(()=>window.__spoken.length)).toBe(2);
            const spoken=await page.evaluate(()=>window.__spoken);
            expect(spoken[1]).toContain('latest main update is confirmed');
            expect(spoken.join(' ')).not.toContain('1234567890123456789012345678901234567890');
          });

          test('STT variant Goopy Alerts uses the Gopi action path', async ({ page }) => {
            await page.route('**/assets/nandi-neural-voice.js', route => route.fulfill({
              contentType:'application/javascript',
              body:`window.__spoken=[];window.NandiNeuralVoice={unlock:async()=>true,load:async()=>({}),status:()=>({ready:true,unlocked:true,dtype:'q4'}),cancel:()=>{},speak:async(t)=>{window.__spoken.push(t);return true;}};`
            }));
            let postedQuestion='';
            await page.route('**/api/nandi', async route => {
              const body=route.request().postDataJSON();
              postedQuestion=String(body?.question||'');
              await route.fulfill({
                contentType:'application/x-ndjson',
                body:[
                  JSON.stringify({type:'tool',tool:'nandi-repo-check',status:'complete',evidence:'github-live'}),
                  JSON.stringify({type:'done',answer:'Gopi Alerts is verified. Status: PASS.',review:'PASS',taskType:'repo_check'})
                ].join('\n')+'\n'
              });
            });
            await page.goto(URL+'/nandi?nandi_test=1',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>window.__NANDI_PHONE_TEST__.simulateTranscript('Show Goopy Alerts'));
            await expect(page.locator('#answerText')).toContainText('Gopi Alerts is verified');
            await expect.poll(()=>page.evaluate(()=>window.__spoken[0]||'')).toBe('Checking Gopi Alerts.');
            expect(postedQuestion).toContain('Show Goopy Alerts');
          });

          test('workflow follow-up speaks only a short summary and keeps full details on screen', async ({ page }) => {
            await page.route('**/assets/nandi-neural-voice.js', route => route.fulfill({
              contentType:'application/javascript',
              body:`window.__spoken=[];window.NandiNeuralVoice={unlock:async()=>true,load:async()=>({}),status:()=>({ready:true,unlocked:true,dtype:'q4'}),cancel:()=>{},speak:async(t)=>{window.__spoken.push(t);return true;}};`
            }));
            const longAnswer='WORKFLOW_DETAILS '+('full workflow row with status and metadata. '.repeat(80));
            await page.route('**/api/nandi', route => route.fulfill({
              contentType:'application/x-ndjson',
              body:[
                JSON.stringify({type:'tool',tool:'github',status:'complete',liveWorkflowRuns:true,runCount:12}),
                JSON.stringify({type:'done',answer:longAnswer,review:'PASS'})
              ].join('\n')+'\n'
            }));
            await page.goto(URL+'/nandi?nandi_test=1',{waitUntil:'domcontentloaded'});
            await page.locator('#input').fill('show workflows');
            await page.locator('button.send').click();
            await expect(page.locator('#answerText')).toContainText('WORKFLOW_DETAILS');
            await expect.poll(()=>page.evaluate(()=>window.__spoken.length)).toBe(2);
            const spoken=await page.evaluate(()=>window.__spoken);
            expect(spoken[0]).toBe('Checking the live workflows.');
            expect(spoken[1]).toContain('12 live workflow runs');
            expect(spoken.every(s=>s.length<180)).toBeTruthy();
            expect(spoken.join(' ')).not.toContain('WORKFLOW_DETAILS');
          });

          test('Nandi ignores its own recent spoken text instead of re-querying', async ({ page }) => {
            let apiCalls=0;
            await page.route('**/assets/nandi-neural-voice.js', route => route.fulfill({
              contentType:'application/javascript',
              body:`window.NandiNeuralVoice={unlock:async()=>true,load:async()=>({}),status:()=>({ready:true,unlocked:true,dtype:'q4'}),cancel:()=>{},speak:async()=>true};`
            }));
            await page.route('**/api/nandi', route => {
              apiCalls++;
              return route.fulfill({
                contentType:'application/x-ndjson',
                body:[
                  JSON.stringify({type:'tool',tool:'nandi-repo-check',status:'complete',evidence:'github-live'}),
                  JSON.stringify({type:'done',answer:'Gopi Alerts is verified. Status: PASS.',review:'PASS'})
                ].join('\n')+'\n'
              });
            });
            await page.goto(URL+'/nandi?nandi_test=1',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>window.__NANDI_PHONE_TEST__.simulateTranscript('Check Gopi Alerts'));
            await expect(page.locator('#answerText')).toContainText('Gopi Alerts is verified');
            await page.evaluate(()=>window.__NANDI_PHONE_TEST__.simulateTranscript('Gopi Alerts is verified. The latest main update is confirmed.'));
            await page.waitForTimeout(500);
            expect(apiCalls).toBe(1);
          });

          test('iPhone-sized WebKit renders Nandi without the desktop-only assumptions', async () => {
            const browser=await webkit.launch();
            const context=await browser.newContext({...devices['iPhone 15']});
            const page=await context.newPage();
            await page.goto(URL+'/nandi',{waitUntil:'domcontentloaded'});
            await expect(page.locator('#startBtn')).toBeVisible();
            await expect(page.locator('#presence')).toBeVisible();
            await expect(page.locator('.composer')).toBeVisible();
            await expect(page.locator('img')).toHaveCount(0);
            const contract=await page.evaluate(()=>({
              noLegacyRecognition:!document.documentElement.innerHTML.includes('SpeechRecognition'),
              usesRecorder:document.documentElement.innerHTML.includes('MediaRecorder'),
              usesServerStt:document.documentElement.innerHTML.includes('/api/transcribe'),
              hasSystemVoiceFallback:document.documentElement.innerHTML.includes('systemSpeak')
            }));
            expect(contract.noLegacyRecognition).toBeTruthy();
            expect(contract.usesRecorder).toBeTruthy();
            expect(contract.usesServerStt).toBeTruthy();
            expect(contract.hasSystemVoiceFallback).toBeTruthy();
            await browser.close();
          });
          NODE
          npx playwright test nandi.spec.js --workers=1 --reporter=line

      - name: Browser verify live UI-to-Nandi backend
        shell: bash
        run: |
          cd /tmp/nandi-pw
          cat > nandi-live.spec.js <<'NODE'
          const { test, expect } = require('@playwright/test');
          test.setTimeout(90000);
          const URL='https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev';

          test('real browser renders live Gopi Alerts evidence from /api/nandi', async ({ page }) => {
            await page.route('**/assets/nandi-neural-voice.js', route => route.fulfill({
              contentType:'application/javascript',
              body:"window.NandiNeuralVoice={unlock:async()=>true,load:async()=>({}),status:()=>({ready:true,unlocked:true,dtype:'q4'}),cancel:()=>{},speak:async()=>true};"
            }));
            await page.goto(URL+'/nandi?nandi_test=1',{waitUntil:'domcontentloaded'});
            await page.locator('#input').fill('Check Gopi Alerts');
            await page.locator('button.send').click();
            await expect(page.locator('#answerText')).toContainText('Gopi Alerts is verified', { timeout: 70000 });
            await expect(page.locator('#answerText')).toContainText('Status: PASS');
            await expect(page.locator('#answerText')).toHaveText(/Latest commit SHA: [0-9a-f]{40}/);
            await page.locator('#activity').click();
            await expect(page.locator('#drawer')).toContainText('nandi-repo-check');
          });
          NODE
          npx playwright test nandi-live.spec.js --workers=1 --reporter=line

      - name: Verify fast live workflow path
        shell: bash
        run: |
          URL=https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev
          start="$(python -c 'import time; print(time.time())')"
          response="$(curl --location --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' --data '{"question":"[Nandi voice session] Reply naturally and briefly unless detail is requested. Use live GitHub/workflow evidence when asked. Show workflows.","history":[]}' "$URL/api/nandi")"
          end="$(python -c 'import time; print(time.time())')"
          elapsed="$(python - "$start" "$end" <<'PY'
          import sys
          print(float(sys.argv[2]) - float(sys.argv[1]))
          PY
          )"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"runtime":"fast-workflow-bridge-v1"'
          printf '%s' "$response" | grep -q '"tool":"github"'
          printf '%s' "$response" | grep -q '"fastPath":true'
          printf '%s' "$response" | grep -q 'rntlgopinath57/gopi_alerts'
          python - "$elapsed" <<'PY'
          import sys
          elapsed=float(sys.argv[1])
          assert elapsed < 8.0, f"workflow fast path too slow: {elapsed:.2f}s"
          print(f"NANDI_WORKFLOW_FAST_PATH: PASS {elapsed:.2f}s")
          PY

      - name: Verify Goopy speech alias routes to Gopi Alerts
        shell: bash
        run: |
          URL=https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev
          response="$(curl --location --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' --data '{"question":"[Nandi voice session] Reply naturally and briefly unless detail is requested. Use live GitHub/workflow evidence when asked. Show Goopy Alerts","history":[]}' "$URL/api/nandi")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"runtime":"verified-skill-bridge-v1"'
          printf '%s' "$response" | grep -q '"tool":"nandi-repo-check"'
          printf '%s' "$response" | grep -q '"taskType":"repo_check"'
          ! printf '%s' "$response" | grep -q '"taskType":"workflow_inventory"'
          printf '%s' "$response" | grep -q 'Gopi Alerts is verified'
          echo "NANDI_GOPI_STT_ALIAS: PASS"

      - name: Verify live Gopi Alerts through Nandi
        shell: bash
        run: |
          URL=https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev
          expected="$(curl --fail --silent -H "Authorization: Bearer $RELAY_GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/rntlgopinath57/gopi_alerts/commits/main | python -c "import sys,json; print(json.load(sys.stdin)['sha'])")"
          response="$(curl --location --fail --silent --show-error --max-time 70 -H 'Content-Type: application/json' --data '{"question":"Check Gopi Alerts.","history":[]}' "$URL/api/nandi")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"tool":"nandi-repo-check"'
          printf '%s' "$response" | grep -q '"evidence":"github-live"'
          printf '%s' "$response" | grep -q "rntlgopinath57/gopi_alerts"
          printf '%s' "$response" | grep -q "$expected"
          printf '%s' "$response" | grep -q '"review":"PASS"'
          echo "NANDI_BROWSER_BACKEND_E2E: PASS"

      - name: Record verified mobile deployment
        run: |
          printf '{"status":"GREEN","url":"https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/nandi.html","source_commit":"%s","mode":"phone-first-voice-agent","stt":"groq-whisper-large-v3-turbo","tts":"kokoro-q4-with-system-fallback","github_live_actions":true,"backend":"verified-skill-bridge-v1","wake":"hi-nandi","ui":"NANDI_PHONE_AGENT_V1","webkit_verified":true}\n' "$GITHUB_SHA" > ai-team-playground/nandi-deploy-status.json
          git config user.name "nandi-test-bot"
          git config user.email "nandi-test-bot@users.noreply.github.com"
          git add ai-team-playground/nandi-deploy-status.json
          git commit -m "Record verified mobile Nandi deployment [skip ci]"
          git push origin HEAD:nandi-immersive-v1
