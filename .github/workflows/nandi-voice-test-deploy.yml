name: Nandi Phone Agent Deploy

on:
  push:
    branches: [nandi-immersive-v1]
    paths:
      - "ai-team-playground/nandi.html"
      - "ai-team-playground/src/nandi-neural-voice.mjs"
      - "netlify/functions/ask.mts"
      - "netlify/functions/transcribe.mts"
      - "cloudflare/**"
      - "relay-runtime/**"
      - "wrangler.jsonc"
      - ".github/workflows/nandi-voice-test-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nandi-phone-agent-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_GEMINI_BASE_URL: ${{ secrets.GOOGLE_GEMINI_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RELAY_GITHUB_TOKEN: ${{ secrets.RELAY_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: nandi-immersive-v1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24" }

      - name: Build pinned voice bundle
        shell: bash
        run: |
          rm -rf /tmp/nandi-build
          mkdir -p /tmp/nandi-build ai-team-playground/assets
          cd /tmp/nandi-build
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund --ignore-scripts kokoro-js@1.2.1 esbuild@0.28.2
          grep -q 'Apache License' node_modules/kokoro-js/LICENSE
          NODE_PATH=/tmp/nandi-build/node_modules ./node_modules/.bin/esbuild             "$GITHUB_WORKSPACE/ai-team-playground/src/nandi-neural-voice.mjs"             --bundle --format=esm --platform=browser --target=es2022             --outfile="$GITHUB_WORKSPACE/ai-team-playground/assets/nandi-neural-voice.js"
          cd "$GITHUB_WORKSPACE"
          npx --yes esbuild@0.28.2 netlify/functions/ask.mts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/ask.mjs >/dev/null
          npx --yes esbuild@0.28.2 netlify/functions/transcribe.mts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/transcribe.mjs >/dev/null

      - name: Validate phone-first contract
        run: |
          grep -q 'NANDI_PHONE_AGENT_V1' ai-team-playground/nandi.html
          grep -q '/api/transcribe' ai-team-playground/nandi.html
          grep -q 'MediaRecorder' ai-team-playground/nandi.html
          grep -q 'getUserMedia' ai-team-playground/nandi.html
          grep -q '/api/ask' ai-team-playground/nandi.html
          grep -q 'systemSpeak' ai-team-playground/nandi.html
          grep -q 'whisper-large-v3-turbo' netlify/functions/transcribe.mts
          grep -q 'actions/runs?per_page=40' netlify/functions/ask.mts
          grep -q 'liveWorkflowRuns' netlify/functions/ask.mts
          grep -q '/api/transcribe' cloudflare/worker.ts
          ! grep -q 'SpeechRecognition' ai-team-playground/nandi.html
          ! grep -q 'nandi-shiva-cinematic' ai-team-playground/nandi.html
          ! grep -q 'LIVE TRACE' ai-team-playground/nandi.html

      - name: Deploy isolated Nandi worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --name nandi-immersive-test

      - name: Sync Relay secrets
        shell: bash
        run: |
          put_secret () { key="$1"; value="$2"; if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@latest secret put "$key" --name nandi-immersive-test >/dev/null; fi; }
          put_secret OPENAI_BASE_URL "$OPENAI_BASE_URL"
          put_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          put_secret ANTHROPIC_BASE_URL "$ANTHROPIC_BASE_URL"
          put_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          put_secret GOOGLE_GEMINI_BASE_URL "$GOOGLE_GEMINI_BASE_URL"
          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret OPENROUTER_BASE_URL "$OPENROUTER_BASE_URL"
          put_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put_secret GROQ_API_KEY "$GROQ_API_KEY"
          put_secret RELAY_GITHUB_TOKEN "$RELAY_GITHUB_TOKEN"

      - name: Smoke live phone shell
        run: |
          body="$(curl --retry 5 --retry-delay 3 --fail --silent --show-error https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/nandi)"
          printf '%s' "$body" | grep -q 'NANDI_PHONE_AGENT_V1'
          printf '%s' "$body" | grep -q 'START NANDI'
          printf '%s' "$body" | grep -q 'MediaRecorder'
          ! printf '%s' "$body" | grep -q 'nandi-shiva-cinematic'
          curl --fail --silent --show-error https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/assets/nandi-neural-voice.js -o /tmp/voice.js
          test "$(wc -c < /tmp/voice.js)" -gt 100000

      - name: Verify speech-to-text gateway
        shell: bash
        run: |
          python - <<'PY'
          import wave, math, struct
          rate=16000
          with wave.open('/tmp/probe.wav','wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              frames=[]
              for i in range(rate):
                  v=int(1400*math.sin(2*math.pi*440*i/rate))
                  frames.append(struct.pack('<h',v))
              w.writeframes(b''.join(frames))
          PY
          out="$(curl --fail --silent --show-error --max-time 35 -F 'file=@/tmp/probe.wav;type=audio/wav' https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/api/transcribe)"
          printf '%s
' "$out"
          printf '%s' "$out" | grep -q '"model":"whisper-large-v3-turbo"'
          printf '%s' "$out" | grep -q '"text"'

      - name: Verify mobile WebKit UI
        shell: bash
        run: |
          rm -rf /tmp/nandi-pw && mkdir -p /tmp/nandi-pw && cd /tmp/nandi-pw
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install webkit
          cat > nandi.spec.js <<'NODE'
          const { test, expect, devices } = require('@playwright/test');
          test.use({ ...devices['iPhone 15'] });
          test('phone-first Nandi renders without temple or Relay dashboard', async ({ page }) => {
            await page.goto('https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/nandi?nandi_test=1',{waitUntil:'domcontentloaded'});
            await expect(page.locator('#startBtn')).toBeVisible();
            await expect(page.locator('#presence')).toBeVisible();
            await expect(page.locator('.composer')).toBeVisible();
            await expect(page.locator('body')).not.toContainText('LIVE TRACE');
            await expect(page.locator('img')).toHaveCount(0);
            const contract=await page.evaluate(()=>({
              hasMediaRecorder: typeof MediaRecorder !== 'undefined',
              hasGetUserMedia: Boolean(navigator.mediaDevices?.getUserMedia),
              noSpeechRecognition: !document.documentElement.innerHTML.includes('SpeechRecognition'),
              testHook: Boolean(window.__NANDI_PHONE_TEST__)
            }));
            expect(contract.hasMediaRecorder).toBeTruthy();
            expect(contract.hasGetUserMedia).toBeTruthy();
            expect(contract.noSpeechRecognition).toBeTruthy();
            expect(contract.testHook).toBeTruthy();
            await page.evaluate(()=>window.__NANDI_PHONE_TEST__.setVisual('listen','LISTENING','phone test'));
            await expect(page.locator('#presence')).toHaveClass(/listen/);
            await page.evaluate(()=>window.__NANDI_PHONE_TEST__.setVisual('think','THINKING','phone test'));
            await expect(page.locator('#presence')).toHaveClass(/think/);
            await page.evaluate(()=>window.__NANDI_PHONE_TEST__.setVisual('speak','SPEAKING','phone test'));
            await expect(page.locator('#presence')).toHaveClass(/speak/);
          });
          NODE
          npx playwright test nandi.spec.js --browser=webkit --workers=1 --reporter=line

      - name: Verify live Relay and GitHub workflow runs
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error --max-time 70             -H 'Content-Type: application/json'             --data '{"question":"Check the current GitHub Actions workflow status across my active repos. Use live runs, not just workflow filenames.","history":[]}'             https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/api/ask)"
          printf '%s
' "$response"
          printf '%s' "$response" | grep -q '"type":"tool"'
          printf '%s' "$response" | grep -q '"tool":"github"'
          printf '%s' "$response" | grep -q '"liveWorkflowRuns":true'
          printf '%s' "$response" | grep -q '"type":"done"'
          printf '%s' "$response" | grep -q 'rntlgopinath57/OmniRoute'

      - name: Record verified phone deployment
        run: |
          printf '{"status":"GREEN","url":"https://nandi-immersive-test.gopi-alerts-3859dc2239de.workers.dev/nandi.html","source_commit":"%s","mode":"phone-first-voice-agent","stt":"groq-whisper-large-v3-turbo","tts":"kokoro-js-1.2.1-with-system-fallback","ui":"NANDI_PHONE_AGENT_V1","github_live_runs":true,"webkit_verified":true}\n' "$GITHUB_SHA" > ai-team-playground/nandi-deploy-status.json
          git config user.name "nandi-test-bot"
          git config user.email "nandi-test-bot@users.noreply.github.com"
          git add ai-team-playground/nandi-deploy-status.json
          git commit -m "Record verified phone-first Nandi deployment [skip ci]"
          git push origin HEAD:nandi-immersive-v1
