name: FreeLLMAPI Relay Proof v3

on:
  push:
    branches:
      - probe/freellmapi-relay-20260919
    paths:
      - ".github/workflows/freellmapi-relay-proof-v3.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Run one bounded FreeLLMAPI request
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/config.json
          import json, os
          keys=[]
          for platform, env_name in [
              ("groq","GROQ_API_KEY"),
              ("google","GEMINI_API_KEY"),
              ("openrouter","OPENROUTER_API_KEY"),
          ]:
              v=os.getenv(env_name,"").strip()
              if v:
                  keys.append({"platform":platform,"key":v,"label":"relay-existing","enabled":True})
          if not keys:
              raise SystemExit("No existing Relay provider keys")
          print(json.dumps({"keys":keys,"routing":{"strategy":"balanced"}},separators=(",",":")))
          PY
          KEY_COUNT="$(python -c 'import json; print(len(json.load(open("/tmp/config.json"))["keys"]))')"
          echo "Existing Relay keys available to proof: $KEY_COUNT"
          test "$KEY_COUNT" -ge 1

          ENC="$(openssl rand -hex 32)"
          docker pull ghcr.io/tashfeenahmed/freellmapi:latest >/dev/null
          docker run -d --name freellmapi-proof             -p 127.0.0.1:3001:3001             -e NODE_ENV=production             -e PORT=3001             -e ENCRYPTION_KEY="$ENC"             -e FREEAPI_CONFIG_JSON="$(cat /tmp/config.json)"             ghcr.io/tashfeenahmed/freellmapi:latest >/dev/null
          trap 'docker rm -f freellmapi-proof >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 45); do
            curl -fsS --max-time 3 http://127.0.0.1:3001/api/ping >/dev/null && break
            [ "$i" -lt 45 ] || { echo "BOOT_RED"; docker logs --tail 60 freellmapi-proof; exit 10; }
            sleep 2
          done
          echo "BOOT_GREEN"

          CODE="$(docker logs freellmapi-proof 2>&1 | sed -n 's/.*First-run setup code: //p' | tail -1 | tr -d '\r')"
          test -n "$CODE"
          python - "$CODE" <<'PY' > /tmp/setup.json
          import json,sys
          print(json.dumps({"email":"relay-proof@example.com","password":"relay-proof-2026","setupCode":sys.argv[1]}))
          PY
          curl -fsS --max-time 10             -H 'Content-Type: application/json'             --data-binary @/tmp/setup.json             http://127.0.0.1:3001/api/auth/setup > /tmp/setup-response.json
          DASH="$(python -c 'import json; print(json.load(open("/tmp/setup-response.json"))["token"])')"

          curl -fsS --max-time 10             -H "Authorization: Bearer $DASH"             http://127.0.0.1:3001/api/settings/api-key > /tmp/apikey.json
          UNIFIED="$(python -c 'import json; print(json.load(open("/tmp/apikey.json"))["apiKey"])')"
          test -n "$UNIFIED"
          echo "UNIFIED_KEY_GREEN"

          curl -fsS --max-time 10             -H "Authorization: Bearer $UNIFIED"             http://127.0.0.1:3001/v1/providers > /tmp/providers.json
          python -c 'import json; d=json.load(open("/tmp/providers.json")); rows=d.get("providers",[]); print("PROVIDERS",[(x.get("platform"),x.get("status"),x.get("keys")) for x in rows]); assert rows'

          curl -fsS --max-time 15             -H "Authorization: Bearer $UNIFIED"             'http://127.0.0.1:3001/v1/models?available=true' > /tmp/models.json
          python -c 'import json; rows=json.load(open("/tmp/models.json")).get("data",[]); print("AVAILABLE_MODELS",len(rows)); print("SAMPLE_MODELS",[x.get("id") for x in rows[:5]]); assert rows'

          python - <<'PY' > /tmp/request.json
          import json
          print(json.dumps({
              "model":"auto:fast",
              "messages":[{"role":"user","content":"Reply with exactly FREELLMAPI_RELAY_OK and nothing else."}],
              "max_tokens":32,
              "temperature":0
          }))
          PY

          curl -fsS --max-time 35             -D /tmp/headers.txt             -o /tmp/response.json             -H "Authorization: Bearer $UNIFIED"             -H 'Content-Type: application/json'             --data-binary @/tmp/request.json             http://127.0.0.1:3001/v1/chat/completions

          python -c 'import json; d=json.load(open("/tmp/response.json")); t=((d.get("choices") or [{}])[0].get("message") or {}).get("content","").strip(); print("MODEL_RESPONSE",t[:120]); assert "FREELLMAPI_RELAY_OK" in t'
          ROUTED="$(awk 'BEGIN{IGNORECASE=1} /^x-routed-via:/{sub(/^[^:]+:[[:space:]]*/,""); gsub("\r",""); print; exit}' /tmp/headers.txt)"
          test -n "$ROUTED"
          echo "ROUTED_VIA=$ROUTED"
          echo "FREELLMAPI_PROOF_GREEN"
