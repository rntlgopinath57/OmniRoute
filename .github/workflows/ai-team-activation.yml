name: AI Team Read-only Activation

on:
  push:
    branches:
      - "feature/ai-team-control-plane"
      - "release/v3.8.51"
    paths:
      - "ai-team/activation/**"
      - ".github/workflows/ai-team-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      OMNIROUTE_NO_UPDATE_NOTIFIER: "1"
      OMNIROUTE_BASE_URL: "http://127.0.0.1:20128"
      OMNIROUTE_SERVER_HOST: "127.0.0.1"
      REQUIRE_API_KEY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Install OmniRoute release
        run: npm install --global omniroute@3.8.50

      - name: Start local OmniRoute gateway
        run: omniroute serve --no-open --daemon

      - name: Wait for local gateway
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:20128/api/health > /tmp/omniroute-health.json; then
              cat /tmp/omniroute-health.json
              exit 0
            fi
            sleep 2
          done
          echo "OmniRoute health endpoint did not become reachable within 90 seconds" >&2
          exit 1

      - name: Run bounded read-only project job
        run: node ai-team/activation/read-only-smoke.mjs
