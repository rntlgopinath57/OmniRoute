name: AI Team Playground Pages

on:
  push:
    branches:
      - playground
    paths:
      - "ai-team-playground/**"
      - ".github/workflows/ai-team-playground-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-team-playground-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload playground
        uses: actions/upload-pages-artifact@v4
        with:
          path: ai-team-playground

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
