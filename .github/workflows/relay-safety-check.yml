name: Relay Safety Check

on:
  pull_request:
    branches:
      - infra/cloudflare-relay
    paths:
      - "ai-team-playground/**"
      - "netlify/functions/**"
      - "cloudflare/**"
      - "relay-runtime/**"
      - "docs/relay/**"
      - ".github/workflows/relay-safety-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Syntax and parse
        run: |
          node --check ai-team-playground/app.js
          node --check ai-team-playground/media-generator.js
          node --check ai-team-playground/video-editor.js
          npx --yes esbuild@0.25.10 netlify/functions/ask.mts --loader:.mts=ts --format=esm --outfile=/tmp/relay-ask.js
          npx --yes esbuild@0.25.10 netlify/functions/media.mts --loader:.mts=ts --format=esm --outfile=/tmp/relay-media.js
          npx --yes esbuild@0.25.10 netlify/functions/health.mts --loader:.mts=ts --format=esm --outfile=/tmp/relay-health.js
          npx --yes esbuild@0.25.10 cloudflare/worker.ts --loader:.ts=ts --format=esm --bundle --external:cloudflare:* --outfile=/tmp/relay-worker.js

      - name: Relay invariants
        shell: python
        run: |
          from pathlib import Path
          html = Path("ai-team-playground/index.html").read_text(encoding="utf-8")
          app = Path("ai-team-playground/app.js").read_text(encoding="utf-8")
          css = Path("ai-team-playground/app.css").read_text(encoding="utf-8")
          ask = Path("netlify/functions/ask.mts").read_text(encoding="utf-8")
          worker = Path("cloudflare/worker.ts").read_text(encoding="utf-8")

          for item in ["Ask Relay anything", "GENERATE IMAGE", "GENERATE VIDEO", "EDIT VIDEO"]:
              assert item in html, f"Missing UI capability: {item}"

          for item in ["explicitModelRoute", "callGroq", "callGemini", "callOpenRouter",
                       "review_skipped", "providerAvailable", "coolDownProvider",
                       "worker_selected", "emergency_fallback"]:
              assert item in ask, f"Missing routing guardrail: {item}"

          assert 'provider === "groq"' in ask and 'GROQ_API_KEY' in ask
          assert "GROQ_API_KEY?: string;" in worker, "Cloudflare runtime must expose Groq secret"
          assert "/api/ask" in app
          assert "scroll" in app.lower() or "scroll" in css.lower(), "Conversation scrolling regression"
          assert "handwritten" in ask.lower(), "Presentation routing regression"
          assert "resolveReviewerModels" in ask, "Reviewer candidate resolver missing"
          assert "reviewerCandidates.slice(0, 2)" in ask, "Reviewer fallback must be bounded to one alternate"
          assert "reviewer_fallback" in ask, "Reviewer fallback visibility missing"
          assert "120, 2500" in ask, "Reviewer latency budget regression"
          assert "Explicit provider intent is strict" in ask, "Explicit provider strictness regression"
          assert "Relay will not silently switch providers for an explicit request." in ask, "Explicit provider failsafe missing"
          assert "let pool = explicitRoute.explicit" in ask, "Explicit provider must use a strict candidate pool"
          assert "const strictIntent =" in ask, "Provider mention must not force strict routing"
          for provider in ["gemini", "claude", "openai", "deepseek", "qwen", "groq", "cloudflare", "grok"]:
              assert f'family: "{provider}"' in ask, f"Missing explicit route for {provider}"
          print("Relay safety invariants: PASS")

      - name: Secret guard
        shell: bash
        run: |
          if grep -R -n -E 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}' ai-team-playground netlify/functions cloudflare relay-runtime; then
            echo "Potential hard-coded secret detected."
            exit 1
          fi
          echo "No obvious hard-coded provider secrets found."

      - name: Summary
        run: |
          {
            echo "## Relay Safety Gate"
            echo "- Syntax/parse: PASS"
            echo "- Routing/fallback/reviewer invariants: PASS"
            echo "- Prompt/UI/scroll/presentation invariants: PASS"
            echo "- Cloudflare Groq binding contract: PASS"
            echo "- Secret scan: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
