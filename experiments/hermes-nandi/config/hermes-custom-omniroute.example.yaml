# Hermes -> OmniRoute POC configuration template
# No secrets committed. Use only on the isolated POC runtime.
#
# VERIFIED CONTRACT:
# Hermes custom provider sends POST {base_url}/chat/completions.
# OmniRoute exposes POST /api/v1/chat/completions as OpenAI-compatible.
# Therefore base_url MUST end in /api/v1 (not /v1).
model:
  provider: custom
  default: relay
  base_url: ${OMNIROUTE_BASE_URL}/api/v1
  api_key: ${OMNIROUTE_API_KEY}
  context_length: 64000

# First gate is deliberately read-only.
# Do not enable deploy/messaging/browser mutation until repo-check passes.
